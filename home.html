<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afnan AI - White Edition</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    
    <!-- Fonts: Noto Sans Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- SVGA Library -->
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/home.css">
</head>
<body class="antialiased selection:bg-blue-100 selection:text-blue-900">

    <!-- ================= MAIN APP ================= -->
    <div id="main-app" class="min-h-screen pb-24">
        
        <!-- HEADER -->
        <header class="fixed top-0 left-0 right-0 h-20 z-30 px-6 flex items-center justify-between glass">
            <div class="flex items-center gap-2">
                <div class="header-icon">
                    <i data-lucide="home" class="w-4 h-4 text-gray-700" id="homeIcon"></i>
                </div>
                <div class="header-icon hidden" id="friendsIcon">
                    <i data-lucide="users" class="w-4 h-4 text-gray-700"></i>
                </div>
                <h2 id="pageTitle" class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600">الرئيسية</h2>
            </div>
            <button onclick="toggleSidebar(true)" class="w-10 h-10 rounded-full flex items-center justify-center active:scale-90 transition">
                <i data-lucide="menu" class="text-black w-6 h-6"></i>
            </button>
        </header>

        <!-- VIEW CONTAINER -->
        <main class="pt-24 px-5">

            <!-- VIEW: HOME -->
            <div id="view-home" class="view-section fade-in">
                <div id="homeBanner" class="w-full banner-container rounded-[28px] glass-card mb-6 relative overflow-hidden flex items-center justify-center shadow-sm group"></div>
                <div class="flex p-1 bg-white/60 backdrop-blur-md rounded-2xl mb-6 shadow-sm border border-white/40">
                    <button id="btn-public" onclick="filterRooms('public')" class="flex-1 py-3 rounded-xl bg-white text-black font-bold shadow-sm text-sm transition-all">عامة</button>
                    <button id="btn-private" onclick="filterRooms('private')" class="flex-1 py-3 rounded-xl text-gray-500 font-bold text-sm hover:text-black transition-all">خاصة</button>
                </div>
                <div id="roomsGrid" class="space-y-3"></div>
            </div>

            <!-- VIEW: WALLET -->
            <div id="view-wallet" class="view-section hidden fade-in">
                <div class="glass-card rounded-[40px] p-8 text-center mb-8 relative overflow-hidden">
                    <div class="absolute -top-20 -left-20 w-48 h-48 bg-yellow-200/30 rounded-full blur-3xl"></div>
                    <div class="relative z-10">
                        <p class="text-gray-500 text-sm font-semibold mb-2">الرصيد الكلي</p>
                        <h2 class="text-6xl font-black text-gray-900 tracking-tight mb-2" id="walletAmount">0</h2>
                        <span class="inline-flex items-center gap-1 bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold">
                            <i data-lucide="coins" class="w-3 h-3"></i> عملة ذهبية
                        </span>
                    </div>
                </div>
                <h3 class="font-bold text-xl mb-4 mr-2">شحن الرصيد</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div onclick="recharge(85000)" class="glass-card p-6 rounded-3xl flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-white transition">
                        <span class="text-2xl font-black text-gray-900">85,000</span>
                        <span class="text-gray-400 text-xs">$1</span>
                    </div>
                </div>
            </div>

            <!-- VIEW: STORE -->
            <div id="view-store" class="view-section hidden fade-in">
                <div class="flex gap-3 mb-6 overflow-x-auto no-scrollbar pb-2">
                    <button onclick="loadStoreItems('frame')" id="store-tab-frames" class="flex-none px-6 py-2.5 bg-gray-900 text-white rounded-full font-bold text-sm shadow-lg hover:bg-gray-800 transition">إطارات</button>
                    <button onclick="loadStoreItems('badge')" id="store-tab-badges" class="flex-none px-6 py-2.5 glass-card text-gray-600 rounded-full font-bold text-sm hover:bg-white transition">شارات</button>
                    <button onclick="loadStoreItems('svga')" id="store-tab-svga" class="flex-none px-6 py-2.5 glass-card text-gray-600 rounded-full font-bold text-sm hover:bg-white transition">رسوم متحركة</button>
                    <button onclick="loadStoreItems('chatbubble')" id="store-tab-chatbubble" class="flex-none px-6 py-2.5 glass-card text-gray-600 rounded-full font-bold text-sm hover:bg-white transition">فقاعات</button>
                </div>
                <div id="storeGrid" class="grid grid-cols-2 gap-4 pb-20"></div>
            </div>

            <!-- VIEW: BAG -->
            <div id="view-bag" class="view-section hidden fade-in">
                <h3 class="font-bold text-lg mb-4 text-gray-800">إطاراتي</h3>
                <div id="bagGrid" class="grid grid-cols-3 gap-3 mb-8"></div>
                <h3 class="font-bold text-lg mb-4 text-gray-800">شاراتي</h3>
                <div id="badgesBagGrid" class="badges-grid mb-8"></div>
                <h3 class="font-bold text-lg mb-4 text-gray-800">رسوم متحركة</h3>
                <div id="svgaBagGrid" class="grid grid-cols-3 gap-3 mb-8"></div>
                <h3 class="font-bold text-lg mb-4 text-gray-800">شاراتي النشطة</h3>
                <div id="activeBadgesGrid" class="badges-grid mb-8"></div>
                <h3 class="font-bold text-lg mb-4 text-gray-800">فقاعاتي</h3>
                <div id="chatbubblesBagGrid" class="grid grid-cols-3 gap-3 mb-8"></div>
            </div>

            <!-- VIEW: FRIENDS -->
            <div id="view-friends" class="view-section hidden fade-in">
                <div class="relative mb-6">
                    <input type="text" id="searchUserInput" placeholder="ابحث عن مستخدم بواسطة البريد الإلكتروني..." 
                           class="w-full p-4 pr-12 rounded-2xl glass-card border-0 focus:ring-0 focus:outline-none text-sm">
                    <button onclick="searchUser()" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="searchResults" class="space-y-3 mb-8 hidden">
                    <h3 class="font-bold text-lg text-gray-800">نتائج البحث</h3>
                    <div id="userResult" class="glass-card p-4 rounded-3xl"></div>
                </div>
                <h3 class="font-bold text-lg mb-4 text-gray-800">طلبات المتابعة</h3>
                <div id="friendRequestsList" class="space-y-3 mb-6"></div>
                <h3 class="font-bold text-lg mb-4 text-gray-800">أصدقائي</h3>
                <div id="friendsList" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <!-- ================= SIDEBAR ================= -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>
    <aside id="sidebar" class="sidebar-container glass-deep flex flex-col overflow-hidden">
        <div class="pt-12 px-6 flex justify-between items-start">
             <button onclick="toggleSidebar(false)" class="p-2 rounded-full bg-gray-100/50 hover:bg-gray-200/50 transition">
                <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
            </button>
            <button onclick="openEditProfile()" class="p-3 rounded-full glass hover:bg-white transition shadow-sm group">
                <i data-lucide="edit-3" class="w-5 h-5 text-gray-600 group-hover:text-black"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto no-scrollbar px-6 pt-2 pb-10">
            <div class="mb-6 mt-4">
                <div class="avatar-wrapper">
                    <img id="sideAvatar" src="https://via.placeholder.com/150" class="avatar-img">
                    <div id="sideSvgaFrame" class="svga-avatar-frame"></div>
                    <img id="sideFrame" src="" class="perfect-frame hidden">
                </div>
            </div>
            <div class="text-center mb-6">
                <h3 id="sideName" class="text-2xl font-black text-gray-900 mb-1">...</h3>
                <div class="inline-flex items-center gap-2 bg-gray-100/50 px-3 py-1 rounded-lg border border-gray-200/50">
                    <span class="text-xs font-bold text-gray-400">البريد:</span>
                    <span id="sideEmail" class="text-sm font-medium text-gray-600 truncate max-w-[150px]">...</span>
                    <button onclick="copyEmail()" class="text-gray-400 hover:text-black"><i data-lucide="copy" class="w-3 h-3"></i></button>
                </div>
            </div>
            <div class="flex gap-3 mb-8">
                <div class="flex-1 glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-1">
                    <div class="w-16 h-16 flex items-center justify-center overflow-hidden">
                        <img id="magicLevelImg" src="" class="w-full h-full object-contain">
                    </div>
                    <span class="text-[10px] font-bold text-gray-400">مستوى السحر</span>
                    <span id="sideMagicLevelText" class="text-sm font-black text-gray-900">1</span>
                </div>
                <div class="flex-1 glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-1">
                    <div class="w-16 h-16 flex items-center justify-center overflow-hidden">
                        <img id="wealthLevelImg" src="" class="w-full h-full object-contain">
                    </div>
                    <span class="text-[10px] font-bold text-gray-400">مستوى الثراء</span>
                    <span id="sideWealthLevelText" class="text-sm font-black text-gray-900">1</span>
                </div>
            </div>
            <div class="space-y-2">
                <button onclick="switchView('home')" class="w-full p-4 rounded-2xl flex items-center gap-4 hover:bg-white transition group">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center group-hover:bg-blue-500 transition">
                        <i data-lucide="home" class="w-5 h-5 text-blue-500 group-hover:text-white"></i>
                    </div>
                    <span class="font-bold text-gray-700">الرئيسية</span>
                </button>
                <button onclick="switchView('wallet')" class="w-full p-4 rounded-2xl flex items-center gap-4 hover:bg-white transition group">
                    <div class="w-10 h-10 rounded-xl bg-yellow-50 flex items-center justify-center group-hover:bg-yellow-500 transition">
                        <i data-lucide="wallet" class="w-5 h-5 text-yellow-600 group-hover:text-white"></i>
                    </div>
                    <span class="font-bold text-gray-700">المحفظة</span>
                </button>
                <button onclick="switchView('store')" class="w-full p-4 rounded-2xl flex items-center gap-4 hover:bg-white transition group">
                    <div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center group-hover:bg-purple-500 transition">
                        <i data-lucide="shopping-bag" class="w-5 h-5 text-purple-500 group-hover:text-white"></i>
                    </div>
                    <span class="font-bold text-gray-700">المتجر</span>
                </button>
                <button onclick="switchView('bag')" class="w-full p-4 rounded-2xl flex items-center gap-4 hover:bg-white transition group">
                    <div class="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center group-hover:bg-green-500 transition">
                        <i data-lucide="package" class="w-5 h-5 text-green-500 group-hover:text-white"></i>
                    </div>
                    <span class="font-bold text-gray-700">حقيبتي</span>
                </button>
                <button onclick="switchView('friends')" class="w-full p-4 rounded-2xl flex items-center gap-4 hover:bg-white transition group">
                    <div class="w-10 h-10 rounded-xl bg-pink-50 flex items-center justify-center group-hover:bg-pink-500 transition">
                        <i data-lucide="users" class="w-5 h-5 text-pink-500 group-hover:text-white"></i>
                    </div>
                    <span class="font-bold text-gray-700">أصدقائي</span>
                </button>
            </div>
            <div class="mt-10 pt-6 border-t border-gray-100">
                <button onclick="confirmLogout()" class="w-full p-4 rounded-2xl flex items-center gap-4 text-red-500 hover:bg-red-50 transition group">
                    <div class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center group-hover:bg-red-500 transition">
                        <i data-lucide="log-out" class="w-5 h-5 text-red-500 group-hover:text-white"></i>
                    </div>
                    <span class="font-bold">تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- ================= MODALS ================= -->
    <!-- EDIT PROFILE MODAL -->
    <div id="editModal" class="fixed inset-0 z-[60] flex items-center justify-center p-6 hidden">
        <div class="absolute inset-0 bg-black/20 backdrop-blur-sm" onclick="closeEditModal()"></div>
        <div class="glass p-8 rounded-[40px] w-full max-w-sm relative z-10 shadow-2xl">
            <h3 class="text-2xl font-black mb-6 text-gray-900">تعديل الملف الشخصي</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 mr-2">الاسم المستعار</label>
                    <input type="text" id="editNameInp" class="w-full p-4 rounded-2xl glass-card border-0 focus:ring-2 focus:ring-black transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-2 mr-2">رابط الصورة الشخصية</label>
                    <input type="text" id="editPhotoInp" class="w-full p-4 rounded-2xl glass-card border-0 focus:ring-2 focus:ring-black transition">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="saveProfileChanges()" class="flex-1 py-4 rounded-2xl bg-black text-white font-bold shadow-lg active:scale-95 transition">حفظ</button>
                    <button onclick="closeEditModal()" class="flex-1 py-4 rounded-2xl glass-card font-bold active:scale-95 transition">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CHAT MODAL -->
    <div id="chatModal" class="fixed inset-0 z-40 bg-white hidden flex flex-col">
        <header class="h-20 px-6 flex items-center justify-between border-b border-gray-50">
            <div class="flex items-center gap-3">
                <button onclick="closeChat()" class="p-2 rounded-full hover:bg-gray-100 transition">
                    <i data-lucide="chevron-right" class="w-6 h-6 text-gray-700"></i>
                </button>
                <div class="relative">
                    <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm">
                        <img id="chatUserAvatar" src="" class="w-full h-full object-cover">
                    </div>
                    <div id="chatUserSvgaFrame" class="svga-avatar-frame !w-12 !h-12"></div>
                    <img id="chatUserFrame" src="" class="perfect-frame !w-12 !h-12 hidden">
                </div>
                <div>
                    <h3 id="chatUserName" class="font-bold text-gray-900 leading-tight">...</h3>
                    <div class="flex items-center gap-1">
                        <img id="chatUserMagicLevel" src="" class="w-3 h-3 object-contain">
                        <img id="chatUserWealthLevel" src="" class="w-3 h-3 object-contain">
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleGiftBox()" class="w-10 h-10 rounded-full bg-yellow-50 flex items-center justify-center text-xl shadow-sm active:scale-90 transition">🎁</button>
                <div class="relative group">
                    <button class="p-2 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="more-vertical" class="w-5 h-5 text-gray-400"></i>
                    </button>
                    <div class="absolute left-0 top-full mt-2 w-48 glass rounded-2xl shadow-xl border border-white/50 hidden group-hover:block overflow-hidden z-50">
                        <button id="unfollowBtn" onclick="unfollowInChat()" class="w-full p-4 text-right text-sm font-bold text-gray-700 hover:bg-white transition flex items-center gap-3">
                            <i data-lucide="user-minus" class="w-4 h-4"></i> إلغاء المتابعة
                        </button>
                        <button onclick="blockUserInChat()" class="w-full p-4 text-right text-sm font-bold text-red-500 hover:bg-red-50 transition flex items-center gap-3">
                            <i data-lucide="slash" class="w-4 h-4"></i> حظر المستخدم
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-8 bg-[#f8fafc] no-scrollbar"></div>

        <div id="giftBox" class="absolute bottom-24 left-6 right-6 glass rounded-[32px] p-6 shadow-2xl border-2 border-white hidden z-50">
            <div class="flex items-center justify-between mb-6">
                <div class="flex gap-4">
                    <button id="tab-fixed" onclick="switchGiftTab('fixed')" class="font-bold text-black border-b-2 border-black pb-1">هدايا</button>
                    <button id="tab-luck" onclick="switchGiftTab('luck')" class="font-bold text-gray-400 pb-1">هدايا سحرية</button>
                </div>
                <div class="bg-yellow-100 px-3 py-1 rounded-full flex items-center gap-1">
                    <span id="giftWalletBalance" class="text-xs font-black text-yellow-700">0</span>
                    <i data-lucide="coins" class="w-3 h-3 text-yellow-600"></i>
                </div>
            </div>
            <div id="giftGrid" class="grid grid-cols-4 gap-4 max-h-60 overflow-y-auto no-scrollbar"></div>
        </div>

        <footer class="p-4 bg-white border-t border-gray-50">
            <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-[24px] border border-gray-100">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." 
                       class="flex-1 bg-transparent border-0 focus:ring-0 text-sm px-4 py-2"
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="w-12 h-12 rounded-full bg-black text-white flex items-center justify-center shadow-lg active:scale-90 transition">
                    <i data-lucide="send" class="w-5 h-5 transform rotate-180"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-6 left-6 right-6 h-20 glass rounded-[30px] z-30 px-4 flex items-center justify-around shadow-xl border border-white/60">
        <button onclick="switchView('home')" class="flex flex-col items-center gap-1 group">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center group-active:scale-90 transition">
                <i data-lucide="home" class="w-6 h-6 text-gray-400 group-hover:text-black"></i>
            </div>
        </button>
        <button onclick="switchView('wallet')" class="flex flex-col items-center gap-1 group">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center group-active:scale-90 transition">
                <i data-lucide="wallet" class="w-6 h-6 text-gray-400 group-hover:text-black"></i>
            </div>
        </button>
        <button onclick="switchView('store')" class="flex flex-col items-center gap-1 group">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center group-active:scale-90 transition">
                <i data-lucide="shopping-bag" class="w-6 h-6 text-gray-400 group-hover:text-black"></i>
            </div>
        </button>
        <button onclick="switchView('bag')" class="flex flex-col items-center gap-1 group">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center group-active:scale-90 transition">
                <i data-lucide="package" class="w-6 h-6 text-gray-400 group-hover:text-black"></i>
            </div>
        </button>
        <button onclick="switchView('friends')" class="flex flex-col items-center gap-1 group">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center group-active:scale-90 transition">
                <i data-lucide="users" class="w-6 h-6 text-gray-400 group-hover:text-black"></i>
            </div>
        </button>
    </nav>

    <!-- Custom JS -->
    <script type="module" src="js/home.js"></script>
</body>
</html>
