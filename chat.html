<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الدردشة</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Noto Sans Arabic', sans-serif; touch-action: manipulation }
        body { background: radial-gradient(circle at 0% 0%, #eef2ff 0%, #fdf2f8 50%, #f0f9ff 100%); color: #1f2937; min-height: 100vh; overflow-x: hidden }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.6) }
        .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); transition: all 0.3s ease }
        .header { position: fixed; top: 0; left: 0; right: 0; height: 70px; z-index: 100; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05) }
        .chat-area { padding: 90px 15px 100px; min-height: 100vh }
        .msg-container { display: flex; flex-direction: column; gap: 12px }
        .msg-sent { align-self: flex-start; max-width: 80% }
        .msg-received { align-self: flex-end; max-width: 80% }
        .msg-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            position: relative;
            word-break: break-word;
        }
        .msg-sent .msg-bubble {
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
            color: white;
            border-bottom-left-radius: 4px;
        }
        .msg-received .msg-bubble {
            background: white;
            color: #333;
            border: 1px solid rgba(0,0,0,0.08);
            border-bottom-right-radius: 4px;
        }
        .msg-time { font-size: 11px; opacity: 0.7; margin-top: 6px; display: flex; align-items: center; gap: 5px }
        .msg-status { font-size: 12px }
        .msg-status.sent { color: #aaa }
        .msg-status.delivered { color: #3b82f6 }
        .msg-status.read { color: #22c55e }
        .msg-edited { font-size: 10px; opacity: 0.6; margin-right: 5px }
        .msg-actions {
            position: absolute;
            top: -35px;
            background: white;
            border-radius: 12px;
            padding: 8px;
            display: none;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .msg-bubble:hover .msg-actions { display: flex }
        .msg-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: 0.2s;
        }
        .msg-action-btn:hover { transform: scale(1.1) }
        .msg-action-btn.edit { background: #3b82f6; color: white }
        .msg-action-btn.delete { background: #ef4444; color: white }
        .msg-action-btn.gift { background: #f59e0b; color: white }
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 20px 25px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .input-box {
            flex: 1;
            background: rgba(0,0,0,0.05);
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
        }
        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: #333;
        }
        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: 0.2s;
        }
        .send-btn:active { transform: scale(0.95) }
        .gift-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: 0.2s;
        }
        .friend-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.6);
            border-radius: 20px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .friend-item:hover { background: white; transform: translateX(-5px) }
        .friend-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover }
        .friend-name { font-weight: bold; font-size: 15px }
        .friend-status { font-size: 12px; color: #666; display: flex; align-items: center; gap: 5px }
        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e }
        .offline-dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af }
        .unread-badge {
            background: #ef4444;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            align-items: flex-end;
        }
        .sheet-overlay.show { display: flex }
        .bottom-sheet {
            background: white;
            width: 100%;
            border-radius: 30px 30px 0 0;
            padding: 25px;
            max-height: 70vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
        .gift-card {
            background: rgba(0,0,0,0.05);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .gift-card:hover { background: rgba(139, 92, 246, 0.1); border-color: #8B5CF6 }
        .gift-card.selected { background: rgba(139, 92, 246, 0.15); border-color: #8B5CF6 }
        .notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 500;
            animation: slideUpNotif 0.3s ease;
        }
        @keyframes slideUpNotif { from { transform: translateX(-50%) translateY(20px); opacity: 0 } to { transform: translateX(-50%) translateY(0); opacity: 1 } }
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
        }
        .menu-overlay.show { display: block }
        .friend-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 25px;
            z-index: 160;
            transform: translateY(100%);
            transition: 0.3s;
        }
        .menu-overlay.show + .friend-menu { transform: translateY(0) }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
            font-weight: 600;
        }
        .menu-item:hover { background: rgba(0,0,0,0.05) }
        .menu-item.danger { color: #ef4444 }
        .menu-item.danger:hover { background: rgba(239, 68, 68, 0.1) }
        .no-scrollbar::-webkit-scrollbar { display: none }
        .edit-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .edit-overlay.show { display: flex }
        .edit-modal {
            background: white;
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
        }
        .edit-input {
            width: 100%;
            background: rgba(0,0,0,0.05);
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-size: 15px;
            margin: 15px 0;
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Friends List View -->
    <div id="friendsView">
        <div class="header">
            <button onclick="window.location.href='afnan_ai_white.html'" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center;">←</button>
            <h2 style="font-weight: bold; font-size: 18px;">أصدقائي</h2>
            <div style="width: 40px;"></div>
        </div>
        <div class="chat-area">
            <div id="friendsList" class="msg-container"></div>
        </div>
    </div>

    <!-- Chat View -->
    <div id="chatView" style="display: none;">
        <div class="header">
            <button onclick="backToFriends()" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center;">←</button>
            <div style="display: flex; align-items: center; gap: 12px;" onclick="openFriendMenu()">
                <img id="chatFriendAvatar" src="" style="width: 45px; height: 45px; border-radius: 50%; object-fit: cover;">
                <div>
                    <div id="chatFriendName" style="font-weight: bold; font-size: 16px;"></div>
                    <div id="chatFriendStatus" style="font-size: 12px; color: #666;"></div>
                </div>
            </div>
            <button onclick="openFriendMenu()" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center;">⋮</button>
        </div>
        <div class="chat-area">
            <div id="messagesContainer" class="msg-container"></div>
        </div>
        <div class="input-area">
            <button class="gift-btn" onclick="openGiftSheet()">🎁</button>
            <div class="input-box">
                <input type="text" id="messageInput" class="message-input" placeholder="اكتب رسالة...">
            </div>
            <button class="send-btn" onclick="sendMessage()">📤</button>
        </div>
    </div>

    <!-- Gift Sheet -->
    <div id="giftSheet" class="sheet-overlay" onclick="closeGiftSheet(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <h3 style="text-align: center; margin-bottom: 20px; font-weight: bold;">إرسال هدية</h3>
            <div id="giftsGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-height: 300px; overflow-y: auto;"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                <span style="font-size: 14px;">الرصيد: <span id="giftBalance" style="color: #f59e0b; font-weight: bold;">0</span> 🪙</span>
                <button onclick="sendGift()" style="background: linear-gradient(135deg, #8B5CF6, #7C3AED); color: white; padding: 12px 30px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer;">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Friend Menu -->
    <div id="menuOverlay" class="menu-overlay" onclick="closeFriendMenu()"></div>
    <div id="friendMenu" class="friend-menu">
        <div style="width: 40px; height: 4px; background: rgba(0,0,0,0.2); border-radius: 2px; margin: 0 auto 20px;"></div>
        <div class="menu-item" onclick="viewFriendProfile()">
            <span>👤</span>
            <span>عرض الملف الشخصي</span>
        </div>
        <div class="menu-item" onclick="clearChat()">
            <span>🗑️</span>
            <span>مسح المحادثة</span>
        </div>
        <div class="menu-item danger" onclick="blockFriend()">
            <span>🚫</span>
            <span>حظر</span>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editOverlay" class="edit-overlay" onclick="closeEditModal()">
        <div class="edit-modal" onclick="event.stopPropagation()">
            <h3 style="text-align: center; font-weight: bold; margin-bottom: 10px;">تعديل الرسالة</h3>
            <input type="text" id="editInput" class="edit-input">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeEditModal()" style="flex: 1; padding: 12px; border-radius: 12px; border: none; background: rgba(0,0,0,0.1); cursor: pointer; font-weight: bold;">إلغاء</button>
                <button onclick="saveEdit()" style="flex: 1; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, #8B5CF6, #7C3AED); color: white; cursor: pointer; font-weight: bold;">حفظ</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, query, where, addDoc, deleteDoc, serverTimestamp, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY", 
            authDomain: "rtx3090-28439.firebaseapp.com", 
            projectId: "rtx3090-28439", 
            storageBucket: "rtx3090-28439.firebasestorage.app", 
            messagingSenderId: "178612030690", 
            appId: "1:178612030690:web:883189ced2ed3a78e3e2bb", 
            databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUserData = null;
        let currentFriend = null;
        let friends = [];
        let messages = [];
        let selectedGift = null;
        let editingMessageId = null;
        let storeData = { gifts: [], itemsById: {} };

        // Simple encryption
        const encrypt = (text) => btoa(unescape(encodeURIComponent(text)));
        const decrypt = (text) => decodeURIComponent(escape(atob(text)));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadUserData();
                await loadStoreData();
                await loadFriends();
            } else {
                window.location.href = 'login.html';
            }
        });

        async function loadUserData() {
            const snap = await getDoc(doc(db, 'users', currentUser.uid));
            if (snap.exists()) {
                currentUserData = snap.data();
                document.getElementById('giftBalance').textContent = (currentUserData.balance || 0).toLocaleString();
            }
        }

        async function loadStoreData() {
            const giftsSnap = await getDocs(collection(db, 'gifts'));
            storeData.gifts = giftsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            storeData.gifts.forEach(g => storeData.itemsById[g.id] = g);
        }

        async function loadFriends() {
            const userSnap = await getDoc(doc(db, 'users', currentUser.uid));
            const userData = userSnap.data();
            const friendIds = userData.friends || [];
            
            friends = [];
            for (const friendId of friendIds) {
                const friendSnap = await getDoc(doc(db, 'users', friendId));
                if (friendSnap.exists()) {
                    friends.push({ id: friendId, ...friendSnap.data() });
                }
            }
            
            renderFriends();
        }

        function renderFriends() {
            const list = document.getElementById('friendsList');
            if (friends.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px;">
                        <div style="font-size: 60px; margin-bottom: 20px;">👥</div>
                        <p style="color: #666; font-size: 16px;">لا يوجد أصدقاء</p>
                        <p style="color: #999; font-size: 13px; margin-top: 10px;">أرسل طلب صداقة للمستخدمين</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = friends.map(f => `
                <div class="friend-item" onclick="openChat('${f.id}')">
                    <img src="${f.photoURL || 'https://i.pravatar.cc/100'}" class="friend-avatar">
                    <div style="flex: 1;">
                        <div class="friend-name">${f.displayName}</div>
                        <div class="friend-status"><span class="offline-dot"></span> غير متصل</div>
                    </div>
                </div>
            `).join('');
        }

        window.openChat = async (friendId) => {
            currentFriend = friends.find(f => f.id === friendId);
            if (!currentFriend) {
                const friendSnap = await getDoc(doc(db, 'users', friendId));
                currentFriend = { id: friendId, ...friendSnap.data() };
            }
            
            document.getElementById('chatFriendAvatar').src = currentFriend.photoURL || 'https://i.pravatar.cc/100';
            document.getElementById('chatFriendName').textContent = currentFriend.displayName;
            document.getElementById('chatFriendStatus').innerHTML = '<span class="offline-dot"></span> غير متصل';
            
            document.getElementById('friendsView').style.display = 'none';
            document.getElementById('chatView').style.display = 'block';
            
            loadMessages();
        };

        window.backToFriends = () => {
            document.getElementById('chatView').style.display = 'none';
            document.getElementById('friendsView').style.display = 'block';
            currentFriend = null;
        };

        function loadMessages() {
            if (!currentFriend) return;
            
            const chatId = getChatId(currentUser.uid, currentFriend.id);
            const messagesRef = collection(db, 'chats', chatId, 'messages');
            const q = query(messagesRef, orderBy('timestamp', 'asc'));
            
            onSnapshot(q, (snapshot) => {
                messages = [];
                snapshot.forEach(doc => {
                    messages.push({ id: doc.id, ...doc.data() });
                });
                renderMessages();
            });
        }

        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = messages.map(m => {
                const isSent = m.senderId === currentUser.uid;
                const msgClass = isSent ? 'msg-sent' : 'msg-received';
                const time = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }) : '';
                const isEdited = m.edited ? '<span class="msg-edited">(تم التعديل)</span>' : '';
                const canEdit = isSent && m.timestamp && (Date.now() - m.timestamp.toDate().getTime() < 15 * 60 * 1000);
                const text = m.type === 'gift' ? `🎁 ${m.giftName || 'هدية'}` : decrypt(m.text || '');
                
                return `
                    <div class="${msgClass}">
                        <div class="msg-bubble" id="msg-${m.id}">
                            ${m.type === 'gift' && m.giftFileUrl ? 
                                `<div style="width: 80px; height: 80px; margin-bottom: 8px;" id="gift-${m.id}"></div>` : ''}
                            <div>${text}</div>
                            <div class="msg-time">
                                ${isEdited}
                                ${time}
                                ${isSent ? '<span class="msg-status delivered">✓✓</span>' : ''}
                            </div>
                            ${canEdit && m.type !== 'gift' ? `
                                <div class="msg-actions">
                                    <button class="msg-action-btn edit" onclick="editMessage('${m.id}')" title="تعديل">✏️</button>
                                    <button class="msg-action-btn delete" onclick="deleteMessage('${m.id}')" title="حذف">🗑️</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            
            // Play gift animations
            messages.forEach(m => {
                if (m.type === 'gift' && m.giftFileUrl) {
                    setTimeout(() => {
                        const container = document.getElementById(`gift-${m.id}`);
                        if (container) {
                            const player = new SVGA.Player(container);
                            const parser = new SVGA.Parser();
                            parser.load(m.giftFileUrl, (videoItem) => {
                                player.setVideoItem(videoItem);
                                player.loops = 0;
                                player.startAnimation();
                            });
                        }
                    }, 100);
                }
            });
            
            container.scrollTop = container.scrollHeight;
        }

        window.sendMessage = async () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentFriend) return;
            
            const chatId = getChatId(currentUser.uid, currentFriend.id);
            const messagesRef = collection(db, 'chats', chatId, 'messages');
            
            await addDoc(messagesRef, {
                senderId: currentUser.uid,
                recipientId: currentFriend.id,
                text: encrypt(text),
                timestamp: serverTimestamp(),
                type: 'text',
                edited: false
            });
            
            input.value = '';
        };

        window.editMessage = (msgId) => {
            const msg = messages.find(m => m.id === msgId);
            if (!msg) return;
            
            editingMessageId = msgId;
            document.getElementById('editInput').value = decrypt(msg.text);
            document.getElementById('editOverlay').classList.add('show');
        };

        window.saveEdit = async () => {
            if (!editingMessageId || !currentFriend) return;
            
            const newText = document.getElementById('editInput').value.trim();
            if (!newText) return;
            
            const chatId = getChatId(currentUser.uid, currentFriend.id);
            const msgRef = doc(db, 'chats', chatId, 'messages', editingMessageId);
            
            await updateDoc(msgRef, {
                text: encrypt(newText),
                edited: true
            });
            
            closeEditModal();
        };

        window.closeEditModal = () => {
            document.getElementById('editOverlay').classList.remove('show');
            editingMessageId = null;
        };

        window.deleteMessage = async (msgId) => {
            if (!confirm('حذف هذه الرسالة؟')) return;
            if (!currentFriend) return;
            
            const chatId = getChatId(currentUser.uid, currentFriend.id);
            await deleteDoc(doc(db, 'chats', chatId, 'messages', msgId));
        };

        window.openGiftSheet = () => {
            const grid = document.getElementById('giftsGrid');
            grid.innerHTML = storeData.gifts.map(g => `
                <div class="gift-card ${selectedGift?.id === g.id ? 'selected' : ''}" onclick="selectGift('${g.id}')">
                    <div style="width: 60px; height: 60px; margin-bottom: 8px;" id="gift-preview-${g.id}"></div>
                    <span style="font-size: 12px; font-weight: bold;">${g.name}</span>
                    <span style="font-size: 11px; color: #f59e0b; margin-top: 4px;">${g.price} 🪙</span>
                </div>
            `).join('');
            
            // Play previews
            storeData.gifts.forEach(g => {
                if (g.fileUrl) {
                    setTimeout(() => {
                        const container = document.getElementById(`gift-preview-${g.id}`);
                        if (container) {
                            const player = new SVGA.Player(container);
                            const parser = new SVGA.Parser();
                            parser.load(g.fileUrl, (videoItem) => {
                                player.setVideoItem(videoItem);
                                player.loops = 0;
                                player.startAnimation();
                            });
                        }
                    }, 100);
                }
            });
            
            document.getElementById('giftSheet').classList.add('show');
        };

        window.selectGift = (giftId) => {
            selectedGift = storeData.gifts.find(g => g.id === giftId);
            openGiftSheet();
        };

        window.closeGiftSheet = (e) => {
            if (e.target === document.getElementById('giftSheet')) {
                document.getElementById('giftSheet').classList.remove('show');
                selectedGift = null;
            }
        };

        window.sendGift = async () => {
            if (!selectedGift || !currentFriend) {
                showNotification('اختر هدية أولاً');
                return;
            }
            
            const cost = selectedGift.price;
            if ((currentUserData.balance || 0) < cost) {
                showNotification('رصيدك غير كافٍ');
                return;
            }
            
            // Deduct balance
            await updateDoc(doc(db, 'users', currentUser.uid), { balance: increment(-cost) });
            
            // Send gift message
            const chatId = getChatId(currentUser.uid, currentFriend.id);
            const messagesRef = collection(db, 'chats', chatId, 'messages');
            
            await addDoc(messagesRef, {
                senderId: currentUser.uid,
                recipientId: currentFriend.id,
                text: encrypt(`🎁 ${selectedGift.name}`),
                timestamp: serverTimestamp(),
                type: 'gift',
                giftId: selectedGift.id,
                giftName: selectedGift.name,
                giftFileUrl: selectedGift.fileUrl,
                giftIcon: selectedGift.icon
            });
            
            // Add points to recipient
            const updates = {};
            if (selectedGift.type === 'magic') {
                updates.magicPoints = increment(selectedGift.reward || 1000);
            } else if (selectedGift.type === 'wealth') {
                updates.wealthPoints = increment(selectedGift.reward || 1000);
            }
            if (Object.keys(updates).length) {
                await updateDoc(doc(db, 'users', currentFriend.id), updates);
            }
            
            document.getElementById('giftSheet').classList.remove('show');
            selectedGift = null;
            showNotification('تم إرسال الهدية! 🎁');
            
            // Reload user data
            await loadUserData();
        };

        window.openFriendMenu = () => {
            document.getElementById('menuOverlay').classList.add('show');
        };

        window.closeFriendMenu = () => {
            document.getElementById('menuOverlay').classList.remove('show');
        };

        window.viewFriendProfile = () => {
            closeFriendMenu();
            if (currentFriend) {
                window.location.href = `profile.html?id=${currentFriend.id}`;
            }
        };

        window.clearChat = async () => {
            if (!confirm('مسح جميع رسائل هذه المحادثة؟')) return;
            closeFriendMenu();
            if (!currentFriend) return;
            
            const chatId = getChatId(currentUser.uid, currentFriend.id);
            const messagesRef = collection(db, 'chats', chatId, 'messages');
            const snapshot = await getDocs(messagesRef);
            
            snapshot.forEach(async (d) => {
                await deleteDoc(doc(db, 'chats', chatId, 'messages', d.id));
            });
            
            showNotification('تم مسح المحادثة');
        };

        window.blockFriend = async () => {
            if (!confirm(`حظر ${currentFriend?.displayName}؟`)) return;
            closeFriendMenu();
            if (!currentFriend) return;
            
            await updateDoc(doc(db, 'users', currentUser.uid), {
                blockedUsers: arrayUnion(currentFriend.id),
                friends: arrayRemove(currentFriend.id)
            });
            
            showNotification('تم الحظر');
            backToFriends();
            await loadFriends();
        };

        function showNotification(msg) {
            const div = document.createElement('div');
            div.className = 'notification';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
