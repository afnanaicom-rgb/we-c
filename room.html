<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Premium Live Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --accent: #f59e0b;
            --bg-black: #000000;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
            --wealth: #facc15;
            --magic: #d946ef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-black);
            color: #fff; height: 100vh; overflow: hidden;
            display: flex; justify-content: center;
        }

        .app-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 10%, #1e1b4b 0%, #000000 50%);
            z-index: -1;
        }

        .app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative; }

        /* الهيدر */
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); }
        .room-info {
            display: flex; align-items: center; gap: 10px; background: var(--glass);
            padding: 5px 12px; border-radius: 30px; border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px); cursor: pointer;
        }
        .owner-img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }

        /* زر التحكم في الهيدر */
        .btn-control { background: transparent; border: none; color: #fff; font-size: 18px; padding: 5px; opacity: 0.7; cursor: pointer; }
        .btn-control:active { transform: scale(0.9); }

        /* زر المجموعة */
        .btn-group {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .btn-group:active { transform: scale(0.9); }
        .online-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
        }

        /* الشات */
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble {
            background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 18px; border-bottom-right-radius: 2px;
            backdrop-filter: blur(10px); display: flex; align-items: flex-start; gap: 10px;
            max-width: 85%; animation: slideIn 0.3s ease;
        }
        .msg-bubble.other {
            border-bottom-right-radius: 18px;
            border-bottom-left-radius: 2px;
            align-self: flex-start;
        }
        .msg-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--accent); cursor: pointer; transition: 0.2s; object-fit: cover; }
        .msg-avatar:active { transform: scale(0.9); }
        .msg-user { font-size: 11px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 5px; }
        .msg-text { font-size: 13px; line-height: 1.5; color: #eee; }
        
        .badge { font-size: 8px; padding: 1px 6px; border-radius: 10px; font-weight: bold; }
        .b-wealth { background: var(--wealth); color: #000; }
        .b-magic { background: var(--magic); color: #fff; }

        /* شارات المستخدم */
        .user-badges { display: flex; gap: 2px; align-items: center; }
        .user-badge { width: 14px; height: 14px; border-radius: 3px; overflow: hidden; }
        .user-badge img { width: 100%; height: 100%; object-fit: contain; }

        /* الفوتر */
        .footer { padding: 10px 15px 25px; display: flex; align-items: center; gap: 10px; z-index: 500; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .input-box {
            flex: 1; background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 25px; height: 46px; padding: 0 15px; display: flex; align-items: center;
        }
        .main-input { background: transparent; border: none; color: #fff; width: 100%; font-size: 14px; }
        .main-input::placeholder { color: rgba(255,255,255,0.5); }
        .btn-action {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.9); }

        /* النوافذ (Sheets) */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }
        .bottom-sheet {
            background: rgba(20, 20, 25, 0.75); backdrop-filter: blur(40px);
            width: 100%; border-radius: 30px 30px 0 0; border-top: 1px solid var(--glass-border);
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 25px; position: relative;
        }
        .sheet-overlay.show .bottom-sheet { transform: translateY(0); }

        /* نافذة المستخدمين النشطين */
        .users-sheet {
            background: rgba(20, 20, 25, 0.95);
            width: 100%;
            border-radius: 30px 30px 0 0;
            border-top: 1px solid var(--glass-border);
            transform: translateY(100%);
            transition: 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 25px;
            position: relative;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }
        .sheet-overlay.show .users-sheet { transform: translateY(0); }
        .users-list {
            overflow-y: auto;
            max-height: 50vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .user-item:active { background: rgba(255,255,255,0.1); }
        .user-item-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }
        .user-item-info { flex: 1; }
        .user-item-name {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .user-item-id {
            font-size: 11px;
            color: #888;
        }
        .user-item-levels {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }
        .level-badge {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
        }
        .level-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* أزرار البروفايل */
        .profile-tools { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .tool-btn {
            width: 45px; height: 45px; border-radius: 15px; background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border); color: #fff; display: flex;
            align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; cursor: pointer;
        }
        .tool-btn:active { transform: scale(0.9); background: var(--glass); }
        .tool-btn.gift { color: var(--accent); }
        .tool-btn.mention { color: #3b82f6; }
        .tool-btn.block { color: #ef4444; }
        .tool-btn.mute { color: #f97316; }
        .tool-btn.delete { color: #dc2626; }

        /* الهدايا */
        .user-selector { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--glass-border); }
        .user-option { display: flex; flex-direction: column; align-items: center; opacity: 0.4; min-width: 50px; cursor: pointer; }
        .user-option.active { opacity: 1; font-weight: bold; color: var(--accent); }
        .user-option img { width: 40px; height: 40px; border-radius: 50%; margin-bottom: 4px; border: 2px solid transparent; object-fit: cover; }
        .user-option.active img { border-color: var(--accent); }

        .gifts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 250px; overflow-y: auto; }
        .gift-card {
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 5px;
            display: flex; flex-direction: column; align-items: center; border: 1px solid transparent; cursor: pointer; transition: 0.2s;
        }
        .gift-card.selected { background: rgba(245, 158, 11, 0.15); border-color: var(--accent); }
        .gift-card img { width: 40px; height: 40px; object-fit: contain; }

        .hidden { display: none !important; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes giftPop {
            0% { transform: scale(0) rotate(-20deg) translate(-50%, -50%); opacity: 0; }
            50% { transform: scale(1.8) rotate(10deg) translate(-50%, -50%); opacity: 1; }
            100% { transform: scale(1) translate(-50%, -400px); opacity: 0; }
        }
        .gift-fx {
            position: absolute; left: 50%; top: 50%; font-size: 80px;
            pointer-events: none; z-index: 3000; animation: giftPop 1.5s ease-out forwards;
        }

        /* إطار البروفايل */
        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.8);
            position: relative;
            z-index: 1;
        }
        .svga-avatar-frame {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .perfect-frame {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            object-fit: contain;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* مستويات الليفل */
        .levels-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        .level-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .level-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .level-label {
            font-size: 10px;
            color: #888;
        }

        /* زر المتابعة/طلب الصداقة */
        .btn-follow {
            width: 120px;
            height: 45px;
            border-radius: 15px;
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-follow:active { transform: scale(0.95); }
        .btn-follow.pending { background: #3b82f6; color: #fff; }
        .btn-follow.following { background: #22c55e; color: #fff; }

        /* رسالة الهدية */
        .gift-message {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.1));
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            align-self: center;
            max-width: 90%;
        }
        .gift-message img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .gift-message-text {
            font-size: 12px;
            color: var(--accent);
        }

        /* رسالة النظام */
        .system-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 16px;
            padding: 10px 15px;
            text-align: center;
            align-self: center;
            font-size: 12px;
            color: #ef4444;
        }

        /* إشعار */
        .notification {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 5000;
            animation: fadeInOut 3s ease forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            90% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* أزرار صاحب الغرفة */
        .owner-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        .owner-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .owner-btn.delete-chat { background: #dc2626; color: #fff; }
        .owner-btn:active { transform: scale(0.95); }

        /* مؤشر التقييد */
        .muted-indicator {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(249, 115, 22, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body onclick="handleGlobalClick(event)">

<div class="app-bg"></div>

<div class="app-container">
    <!-- الهيدر -->
    <header class="header">
        <div class="room-info" onclick="openProfileById(roomOwner.uid)">
            <img src="" class="owner-img" id="ownerImg">
            <div>
                <span style="font-size:9px; color:var(--accent)" id="ownerId">ID: ---</span>

        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn-group" onclick="toggleSheet('usersSheet', true)">

        </div>
    </header>

    <!-- الشات -->
    <div class="chat-area" id="chatArea"></div>

    <footer class="footer">
        <div class="input-box" onclick="event.stopPropagation()">
            <input type="text" id="chatInput" class="main-input" placeholder="اكتب شيئاً..." autocomplete="off">
        </div>
        <button id="giftBtn" class="btn-action" style="background:var(--accent)" onclick="toggleSheet('giftSheet', true)">
            <i class="fa-solid fa-gift"></i>
        </button>

            <i class="fa-solid fa-paper-plane"></i>

</div>

<!-- نافذة المستخدمين النشطين -->

            <h3 style="font-size:16px; font-weight:bold;">المستخدمون النشطون</h3>

<!-- نافذة البروفايل -->

            <div class="avatar-wrapper" id="profileAvatarWrapper">

                    <img id="p-wealth-img" src="" class="level-img">

            <div class="profile-tools" id="profileTools">

<!-- نافذة الهدايا -->
<div class="sheet-overlay" id="giftSheet">

    <div class="bottom-sheet">
        <div class="user-selector" id="giftUserSelector"></div>
        <div class="gifts-grid" id="giftsGrid"></div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:20px">
            <div style="font-size:12px">الرصيد: <span style="color:var(--accent)" id="userBalance">0</span> 🪙</div>
            <div style="display:flex; gap:10px">
                <input type="number" value="1" min="1" id="giftQty" style="width:50px; background:var(--glass); border:1px solid var(--glass-border); border-radius:8px; color:var(--accent); text-align:center; font-weight:bold">
                <button class="btn-send-gift" onclick="executeGift()" style="background:var(--accent); border:none; padding:8px 25px; border-radius:20px; font-weight:bold; color:#000; cursor:pointer">إرسال</button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs, arrayUnion, arrayRemove, increment, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
    authDomain: "rtx3090-28439.firebaseapp.com",
    databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com",
    projectId: "rtx3090-28439",
    storageBucket: "rtx3090-28439.firebasestorage.app",
    messagingSenderId: "178612030690",
    appId: "1:178612030690:web:883189ced2ed3a78e3e2bb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

// المتغيرات العامة
let currentUser = null;
let currentUserData = {};
let roomOwner = null;
let roomId = null;
let roomType = 'public';
let roomUsers = [];
let selectedRecipient = null;
let selectedGift = null;
let storeData = { items: {}, gifts: [], luckGifts: [], magicLevels: {}, wealthLevels: {} };
let chatUnsubscribe = null;
let isRoomOwner = false;
let isMuted = false;
let activeSvgaPlayers = {};

// الحصول على معرف الغرفة من URL
const urlParams = new URLSearchParams(window.location.search);
roomId = urlParams.get('id') || 'default';
roomType = urlParams.get('type') || 'public';

// تهيئة التطبيق
onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        await loadCurrentUserData();
        await loadStoreData();
        await loadRoomData();
        await loadRoomUsers();
        setupChatListener();
        renderGifts();
    } else {
        window.location.href = 'afnan_ai_white.html';
    }
});

// تحميل بيانات المستخدم الحالي
async function loadCurrentUserData() {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
        currentUserData = userDoc.data();
        currentUserData.uid = currentUser.uid;
        document.getElementById('userBalance').innerText = (currentUserData.balance || 0).toLocaleString();
    }
}

// تحميل بيانات المتجر
async function loadStoreData() {
    // تحميل العناصر
    const itemsSnap = await getDocs(collection(db, "storeItems"));
    itemsSnap.docs.forEach(d => {
        storeData.items[d.id] = { id: d.id, ...d.data() };
    });

    // تحميل الهدايا
    const giftsSnap = await getDocs(collection(db, "gifts"));
    storeData.gifts = giftsSnap.docs.map(d => ({ id: d.id, ...d.data(), type: 'wealth' }));

    // تحميل هدايا الحظ
    const luckSnap = await getDocs(collection(db, "luckGifts"));
    storeData.luckGifts = luckSnap.docs.map(d => ({ id: d.id, ...d.data(), type: 'magic' }));

    // تحميل مستويات السحر
    const magicSnap = await getDocs(collection(db, "magicLevels"));
    magicSnap.docs.forEach(d => {
        storeData.magicLevels[d.id] = d.data();
    });

    // تحميل مستويات الثروة
    const wealthSnap = await getDocs(collection(db, "wealthLevels"));
    wealthSnap.docs.forEach(d => {
        storeData.wealthLevels[d.id] = d.data();
    });
}

// تحميل بيانات الغرفة
async function loadRoomData() {
    let roomRef;
    if (roomType === 'private') {
        roomRef = doc(db, "privateRooms", roomId);
    } else {
        roomRef = doc(db, "rooms", roomId);
    }

    const roomSnap = await getDoc(roomRef);
    if (roomSnap.exists()) {
        const roomData = roomSnap.data();
        document.getElementById('roomName').innerText = roomData.name || 'روم النخبة 💎';
        
        // تحميل بيانات صاحب الغرفة
        const ownerSnap = await getDoc(doc(db, "users", roomData.owner));
        if (ownerSnap.exists()) {
            roomOwner = { uid: roomData.owner, ...ownerSnap.data() };
            document.getElementById('ownerImg').src = roomOwner.photoURL || 'https://via.placeholder.com/100';
            document.getElementById('ownerId').innerText = `ID: ${roomOwner.uid?.substring(0, 6) || '---'}`;
            
            // التحقق إذا كان المستخدم الحالي هو صاحب الغرفة
            isRoomOwner = currentUser.uid === roomData.owner;
        }
    }
}

// تحميل مستخدمي الغرفة
async function loadRoomUsers() {
    // في الواقع الفعلي، يجب الاستماع للمستخدمين المتصلين
    // هنا نستخدم قائمة الأصدقاء كمثال
    const friends = currentUserData.friends || [];
    roomUsers = [];

    // إضافة صاحب الغرفة
    if (roomOwner) {
        roomUsers.push(roomOwner);
    }

    // إضافة الأصدقاء
    for (const friendUid of friends) {
        const friendSnap = await getDoc(doc(db, "users", friendUid));
        if (friendSnap.exists()) {
            roomUsers.push({ uid: friendUid, ...friendSnap.data() });
        }
    }

    // تحديث العداد
    document.getElementById('onlineCount').innerText = roomUsers.length;
    document.getElementById('usersCount').innerText = roomUsers.length;

    renderUsersList();
    renderGiftUsers();
}

// عرض قائمة المستخدمين
function renderUsersList() {

                    ${magicLevel ? `<div class="level-badge"><img src="${magicLevel.image}" title="السحر Lv.${user.magicLevel || 1}"></div>` : ''}

// إعداد مستمع الشات
function setupChatListener() {
    const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
    
    // حذف الرسائل القديمة عند الدخول (للحفاظ على الخصوصية)
    // لا نعرض إلا الرسائل الجديدة
    
    chatUnsubscribe = onValue(chatRef, (snapshot) => {
        const messages = snapshot.val();
        if (!messages) return;

        const container = document.getElementById('chatArea');
        container.innerHTML = '';

        Object.values(messages)
            .sort((a, b) => a.timestamp - b.timestamp)
            .forEach(msg => {
                if (msg.type === 'gift') {
                    renderGiftMessage(msg);
                } else if (msg.type === 'system') {
                    renderSystemMessage(msg.text);
                } else {
                    renderMessage(msg);
                }
            });

        container.scrollTop = container.scrollHeight;
    });

    // التحقق من حالة التقييد
    checkMuteStatus();
}

// التحقق من حالة التقييد
async function checkMuteStatus() {
    const muteRef = ref(rtdb, `roomChats/${roomId}/mutedUsers/${currentUser.uid}`);
    onValue(muteRef, (snapshot) => {
        isMuted = snapshot.exists();
        const input = document.getElementById('chatInput');
        if (isMuted) {
            input.placeholder = 'تم تقييدك من الكتابة';
            input.disabled = true;
            showNotification('تم تقييدك من الكتابة في هذه الغرفة');
        } else {
            input.placeholder = 'اكتب شيئاً...';
            input.disabled = false;
        }
    });
}

// عرض رسالة
function renderMessage(msg) {
    const container = document.getElementById('chatArea');
    const isMe = msg.senderId === currentUser.uid;
    
    const div = document.createElement('div');
    div.className = `msg-bubble ${isMe ? '' : 'other'}`;
    div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';

    // شارات المستخدم
    let badgesHTML = '';
    if (msg.senderBadges && msg.senderBadges.length > 0) {
        badgesHTML = '<div class="user-badges">';
        msg.senderBadges.slice(0, 3).forEach(badgeId => {
            const badge = storeData.items[badgeId];
            if (badge) {
                badgesHTML += `<div class="user-badge"><img src="${badge.image}" title="${badge.name}"></div>`;
            }
        });
        badgesHTML += '</div>';
    }

    div.innerHTML = `
        <img src="${msg.senderPhoto}" class="msg-avatar" onclick="openProfileById('${msg.senderId}')">
        <div class="msg-content">
            <div class="msg-user">
                ${msg.senderName}
                ${badgesHTML}
                <span class="badge b-wealth">W.${msg.senderWealth || 1}</span>
                <span class="badge b-magic">M.${msg.senderMagic || 1}</span>
            </div>
            <div class="msg-text">${escapeHtml(msg.text)}</div>
        </div>
    `;

    container.appendChild(div);
}

// عرض رسالة هدية
function renderGiftMessage(msg) {
    const container = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'gift-message';
    div.innerHTML = `
        <img src="${msg.giftImage}" alt="${msg.giftName}">
        <div class="gift-message-text">
            <strong>${msg.senderName}</strong> أرسل هدية <strong>${msg.giftName}</strong> إلى <strong>${msg.recipientName}</strong>
            ${msg.quantity > 1 ? `(x${msg.quantity})` : ''}
        </div>
    `;
    container.appendChild(div);
}

// عرض رسالة نظام
function renderSystemMessage(text) {
    const container = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = 'system-message';
    div.innerText = text;
    container.appendChild(div);
}

// إرسال رسالة
window.sendMsg = async function() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    
    if (!text || isMuted) return;

    const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
    await push(chatRef, {
        senderId: currentUser.uid,
        senderName: currentUserData.displayName || 'مستخدم',
        senderPhoto: currentUserData.photoURL || 'https://via.placeholder.com/150',
        senderWealth: currentUserData.wealthLevel || 1,
        senderMagic: currentUserData.magicLevel || 1,
        senderBadges: currentUserData.activeBadges || [],
        text: text,
        type: 'text',
        timestamp: Date.now()
    });

    input.value = '';
};

// فتح بروفايل
window.openProfileById = async function(uid) {
    const userSnap = await getDoc(doc(db, "users", uid));
    if (!userSnap.exists()) return;

    const user = { uid, ...userSnap.data() };
    const isOwner = uid === roomOwner?.uid;
    const isSelf = uid === currentUser.uid;

    // تعيين البيانات
    document.getElementById('p-name').innerText = user.displayName || 'مستخدم';
    document.getElementById('p-id').innerText = `ID: ${uid?.substring(0, 8) || '---'}`;
    document.getElementById('p-img').src = user.photoURL || 'https://via.placeholder.com/150';

    // مستويات
    const magicLevel = storeData.magicLevels[user.magicLevel || 1];
    const wealthLevel = storeData.wealthLevels[user.wealthLevel || 1];
    document.getElementById('p-magic-img').src = magicLevel?.image || '';
    document.getElementById('p-wealth-img').src = wealthLevel?.image || '';

    // الإطار
    const avatarWrapper = document.getElementById('profileAvatarWrapper');
    const frameEl = document.getElementById('p-frame');
    const svgaContainer = document.getElementById('p-svga-frame');

    frameEl.classList.add('hidden');
    svgaContainer.classList.add('hidden');
    svgaContainer.innerHTML = '';

    if (user.activeFrame) {
        const frameItem = storeData.items[user.activeFrame];
        if (frameItem) {
            if (frameItem.itemType === 'svga') {
                svgaContainer.classList.remove('hidden');
                playSvga(frameItem.fileUrl, svgaContainer, { loops: 0, clearsAfterStop: false });
            } else {
                frameEl.src = frameItem.image;
                frameEl.classList.remove('hidden');
            }
        }
    }

    // أزرار التحكم
    const toolsContainer = document.getElementById('profileTools');
    const followBtn = document.getElementById('followBtn');
    const ownerActions = document.getElementById('ownerActions');

    toolsContainer.innerHTML = '';
    ownerActions.classList.add('hidden');

    if (isSelf) {
        // المستخدم نفسه
        followBtn.classList.add('hidden');
    } else {
        // مستخدم آخر
        followBtn.classList.remove('hidden');
        updateFollowButton(uid);

        // أزرار التفاعل
        toolsContainer.innerHTML = `
            <button class="tool-btn gift" onclick="handleProfileGift('${uid}')"><i class="fa-solid fa-gift"></i></button>
            <button class="tool-btn mention" onclick="handleProfileMention('${uid}')"><i class="fa-solid fa-at"></i></button>
        `;

        // أزرار صاحب الغرفة
        if (isRoomOwner) {
            toolsContainer.innerHTML += `
                <button class="tool-btn block" onclick="blockUser('${uid}')"><i class="fa-solid fa-ban"></i></button>
                <button class="tool-btn mute" onclick="muteUser('${uid}')"><i class="fa-solid fa-microphone-slash"></i></button>
            `;
            ownerActions.classList.remove('hidden');
        }
    }

    window.currentProfileUser = user;
    toggleSheet('profileSheet', true);
};

// تحديث زر المتابعة
async function updateFollowButton(uid) {
    const btn = document.getElementById('followBtn');
    const isFriend = currentUserData.friends?.includes(uid);
    const hasSentRequest = currentUserData.sentRequests?.includes(uid);
    const hasReceivedRequest = currentUserData.friendRequests?.includes(uid);

    btn.classList.remove('pending', 'following');

    if (isFriend) {
        btn.innerHTML = '<i class="fa-solid fa-user-check"></i><span>متابع</span>';
        btn.classList.add('following');
    } else if (hasSentRequest) {
        btn.innerHTML = '<i class="fa-solid fa-clock"></i><span>تم الإرسال</span>';
        btn.classList.add('pending');
    } else if (hasReceivedRequest) {
        btn.innerHTML = '<i class="fa-solid fa-user-check"></i><span>قبول</span>';
        btn.onclick = () => acceptFriendRequest(uid);
    } else {
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i><span>متابعة</span>';
        btn.onclick = () => sendFriendRequest(uid);
    }
}

// إرسال طلب صداقة
window.sendFriendRequest = async function(uid) {
    try {
        await updateDoc(doc(db, "users", currentUser.uid), {
            sentRequests: arrayUnion(uid)
        });
        await updateDoc(doc(db, "users", uid), {
            friendRequests: arrayUnion(currentUser.uid)
        });
        showNotification('تم إرسال طلب المتابعة');
        updateFollowButton(uid);
    } catch (error) {
        showNotification('فشل إرسال الطلب');
    }
};

// قبول طلب صداقة
window.acceptFriendRequest = async function(uid) {
    try {
        await updateDoc(doc(db, "users", currentUser.uid), {
            friendRequests: arrayRemove(uid),
            friends: arrayUnion(uid)
        });
        await updateDoc(doc(db, "users", uid), {
            sentRequests: arrayRemove(currentUser.uid),
            friends: arrayUnion(currentUser.uid)
        });
        showNotification('تم قبول طلب المتابعة');
        updateFollowButton(uid);
    } catch (error) {
        showNotification('فشل قبول الطلب');
    }
};

// حظر مستخدم
window.blockUser = async function(uid) {
    if (!confirm('هل تريد حظر هذا المستخدم وطرده من الغرفة؟')) return;

    try {
        // إضافة للمحظورين
        await set(ref(rtdb, `roomChats/${roomId}/blockedUsers/${uid}`), {
            blockedAt: Date.now(),
            blockedBy: currentUser.uid
        });

        // إرسال رسالة نظام
        const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
        const userSnap = await getDoc(doc(db, "users", uid));
        const userName = userSnap.exists() ? userSnap.data().displayName : 'مستخدم';
        
        await push(chatRef, {
            text: `تم حظر ${userName} من الغرفة`,
            type: 'system',
            timestamp: Date.now()
        });

        toggleSheet('profileSheet', false);
        showNotification('تم حظر المستخدم');
    } catch (error) {
        showNotification('فشل الحظر');
    }
};

// تقييد مستخدم
window.muteUser = async function(uid) {
    try {
        await set(ref(rtdb, `roomChats/${roomId}/mutedUsers/${uid}`), {
            mutedAt: Date.now(),
            mutedBy: currentUser.uid

        const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);

            text: `تم تقييد ${userName} من الكتابة`,
            type: 'system',
            timestamp: Date.now()
        });

        toggleSheet('profileSheet', false);
        showNotification('تم تقييد المستخدم');
    } catch (error) {
        showNotification('فشل التقييد');
    }
};

// حذف الشات
window.deleteAllChat = async function() {

// عرض الهدايا
function renderGifts() {
    const gifts = [...storeData.gifts, ...storeData.luckGifts];
    const grid = document.getElementById('giftsGrid');
    grid.innerHTML = '';

    gifts.forEach(gift => {
        const div = document.createElement('div');
        div.className = 'gift-card';
        div.onclick = () => {
            document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
            div.classList.add('selected');

        };

        div.innerHTML = `
            <img src="${gift.image}" alt="${gift.name}">
            <span style="font-size:10px; color:#888; margin-top:5px;">${gift.price || 0}</span>

// عرض مستخدمي الهدايا
function renderGiftUsers() {
    const container = document.getElementById('giftUserSelector');
    container.innerHTML = '';

    roomUsers.forEach(user => {
        const div = document.createElement('div');
        div.className = `user-option ${selectedRecipient?.uid === user.uid ? 'active' : ''}`;
        div.onclick = (e) => {
            e.stopPropagation();
            selectedRecipient = user;
            renderGiftUsers();
        };

        div.innerHTML = `
            <img src="${user.photoURL || 'https://via.placeholder.com/150'}">
            <span style="font-size:9px">${user.displayName || 'مستخدم'}</span>
        `;
        container.appendChild(div);
    });

    if (!selectedRecipient && roomUsers.length > 0) {
        selectedRecipient = roomUsers[0];
    }
}

// تنفيذ إرسال الهدية
window.executeGift = async function() {
    if (!selectedGift || !selectedRecipient) {
        showNotification('اختر الهدية والمستلم');
        return;
    }

    const qty = parseInt(document.getElementById('giftQty').value) || 1;
    const totalPrice = (selectedGift.price || 0) * qty;

    if ((currentUserData.balance || 0) < totalPrice) {
        showNotification('رصيدك غير كافٍ');
        return;
    }

    try {
        // خصم الرصيد
        await updateDoc(doc(db, "users", currentUser.uid), {
            balance: increment(-totalPrice)
        });

        // إضافة رسالة الهدية
        const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
        await push(chatRef, {
            senderId: currentUser.uid,
            senderName: currentUserData.displayName || 'مستخدم',
            recipientId: selectedRecipient.uid,
            recipientName: selectedRecipient.displayName || 'مستخدم',
            giftId: selectedGift.id,
            giftName: selectedGift.name,
            giftImage: selectedGift.image,
            quantity: qty,
            type: 'gift',
            timestamp: Date.now()
        });

        // تحديث رصيد المستلم
        const receiverRef = doc(db, "users", selectedRecipient.uid);
        if (selectedGift.type === 'magic') {
            await updateDoc(receiverRef, {
                jewels: increment(qty * 10),
                magicLevel: increment(Math.floor(qty / 10))
            });
        } else {
            await updateDoc(receiverRef, {
                wealthLevel: increment(qty),
                balance: increment(qty * (selectedGift.reward || 0))
            });
        }

        // تأثير الأنيميشن
        const fx = document.createElement('div');
        fx.className = 'gift-fx';
        fx.innerHTML = `<img src="${selectedGift.image}" style="width:80px; height:80px;">`;
        document.body.appendChild(fx);
        setTimeout(() => fx.remove(), 1500);

        // تحديث الرصيد المحلي
        currentUserData.balance = (currentUserData.balance || 0) - totalPrice;
        document.getElementById('userBalance').innerText = currentUserData.balance.toLocaleString();

        toggleSheet('giftSheet', false);
        showNotification('تم إرسال الهدية بنجاح');
    } catch (error) {
        showNotification('فشل إرسال الهدية');
    }
};

// التعامل مع الهدايا من البروفايل
window.handleProfileGift = function(uid) {
    const user = roomUsers.find(u => u.uid === uid);
    if (user) {
        selectedRecipient = user;
        toggleSheet('profileSheet', false);
        renderGiftUsers();
        toggleSheet('giftSheet', true);
    }
};

// التعامل مع المنشن
window.handleProfileMention = function(uid) {
    const user = roomUsers.find(u => u.uid === uid);
    if (user) {
        toggleSheet('profileSheet', false);
        const input = document.getElementById('chatInput');
        input.value = `@${user.displayName} `;

};

// التحكم بالنوافذ
window.toggleSheet = function(id, show) {
    document.getElementById(id).classList.toggle('show', show);
};

// النقر العام
window.handleGlobalClick = function(e) {
    const input = document.getElementById('chatInput');
    if (e.target !== input && !input.contains(e.target)) {
        input.blur();
        document.getElementById('giftBtn').classList.remove('hidden');
        document.getElementById('sendBtn').classList.add('hidden');
    }
};

// التركيز على الإدخال
document.getElementById('chatInput').addEventListener('focus', function() {
    document.getElementById('giftBtn').classList.add('hidden');
    document.getElementById('sendBtn').classList.remove('hidden');
});

// إرسال عند Enter
document.getElementById('chatInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMsg();
});

// تشغيل SVGA
function playSvga(url, container, options = {}) {
    try {
        container.innerHTML = '';
        const player = new SVGA.Player(container);
        const parser = new SVGA.Parser();
        parser.load(url, (videoItem) => {
            player.setVideoItem(videoItem);
            player.loops = options.loops || 0;
            player.clearsAfterStop = options.clearsAfterStop || false;
            player.startAnimation();
        });
    } catch (error) {
        console.error('SVGA Error:', error);
    }
}

// إظهار إشعار
function showNotification(message) {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();

    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.innerText = message;
    document.body.appendChild(notif);

    setTimeout(() => notif.remove(), 3000);
}

// تجنب HTML
function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
}
