<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Premium Live Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #8b5cf6; --accent: #f59e0b; --bg-black: #000000;
            --glass: rgba(255, 255, 255, 0.1); --glass-border: rgba(255, 255, 255, 0.15);
            --wealth: #facc15; --magic: #d946ef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif; background-color: var(--bg-black);
            color: #fff; height: 100dvh; overflow: hidden; display: flex; justify-content: center;
        }

        .app-bg { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, #1e1b4b 0%, #000000 50%); z-index: -1; }
        .app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative; }

        .header { 
            padding: 15px; display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; border-bottom: 1px solid var(--glass-border); 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        }
        
        .header-left { display: flex; align-items: center; gap: 10px; }
        .room-info { 
            display: flex; align-items: center; gap: 10px; background: var(--glass);
            padding: 5px 12px; border-radius: 30px; border: 1px solid var(--glass-border);
            cursor: pointer;
        }
        .owner-img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }

        .btn-control { 
            background: transparent; border: none; color: #fff; font-size: 18px; 
            width: 40px; height: 40px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; cursor: pointer; opacity: 0.8;
        }

        .chat-area { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; 
            flex-direction: column; gap: 12px; scroll-behavior: smooth;
        }
        
        .msg-bubble {
            background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 18px; border-bottom-right-radius: 2px;
            backdrop-filter: blur(10px); display: flex; align-items: flex-start; 
            gap: 10px; max-width: 85%; animation: slideIn 0.3s ease;
        }
        
        .msg-avatar-wrapper { position: relative; width: 35px; height: 35px; flex-shrink: 0; }
        .msg-avatar { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; position: relative; z-index: 1; }
        .msg-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 48px; height: 48px; z-index: 2; pointer-events: none; }
        
        .msg-user { font-size: 11px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
        .msg-text { font-size: 13px; line-height: 1.5; color: #eee; word-break: break-word; }
        
        .badge { font-size: 8px; padding: 1px 6px; border-radius: 10px; font-weight: bold; }
        .b-wealth { background: var(--wealth); color: #000; }
        .b-magic { background: var(--magic); color: #fff; }

        .footer { 
            padding: 10px 15px 25px; display: flex; align-items: center; gap: 10px; 
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        
        .input-box {
            flex: 1; background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 25px; height: 46px; padding: 0 15px; display: flex; align-items: center;
        }
        
        .main-input { background: transparent; border: none; color: #fff; width: 100%; font-size: 14px; font-family: inherit; }
        
        .btn-action {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; color: white; transition: 0.2s; font-size: 18px;
        }

        /* Bottom Sheets */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            background: rgba(20, 20, 25, 0.98); backdrop-filter: blur(40px);
            width: 100%; border-radius: 30px 30px 0 0; border-top: 1px solid var(--glass-border);
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 20px; max-height: 85vh; overflow-y: auto;
        }
        .sheet-overlay.show .bottom-sheet { transform: translateY(0); }

        .section-title { font-size: 14px; margin: 15px 0 10px; color: #888; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }

        .gifts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .gift-card {
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 5px;
            display: flex; flex-direction: column; align-items: center; border: 1px solid transparent; 
            cursor: pointer; transition: 0.2s;
        }
        .gift-card.selected { background: rgba(245, 158, 11, 0.15); border-color: var(--accent); }
        .gift-icon { font-size: 24px; margin-bottom: 5px; }

        .receivers-list { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; scrollbar-width: none; }
        .receivers-list::-webkit-scrollbar { display: none; }
        .receiver-card { 
            flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; 
            padding: 5px; border-radius: 10px; transition: 0.2s; border: 1px solid transparent; width: 65px;
        }
        .receiver-card.selected { background: rgba(139, 92, 246, 0.2); border-color: var(--primary); }
        .receiver-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }

        .active-users-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .active-user-card { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
        .active-user-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--glass-border); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .gift-fx {
            position: fixed; left: 50%; top: 50%; font-size: 80px;
            z-index: 5000; pointer-events: none; animation: giftPop 1.5s forwards;
        }
        @keyframes giftPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -200%) scale(1); opacity: 0; }
        }

        .notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 10px 20px; border-radius: 20px;
            border: 1px solid var(--accent); z-index: 9999; font-size: 13px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-bg"></div>

<div class="app-container">
    <header class="header">
        <div class="header-left">
            <div class="room-info" onclick="openRoomOwnerProfile()">
                <img src="" class="owner-img" id="roomOwnerImg" onerror="this.src='https://ui-avatars.com/api/?name=R'">
                <div>
                    <span style="font-size:9px; color:var(--accent)" id="roomOwnerId">ID: ---</span>
                    <div style="font-size:12px; font-weight:bold" id="roomName">تحميل...</div>
                </div>
            </div>
            <button class="btn-control" onclick="toggleSheet('activeUsersSheet', true)">
                <i class="fa-solid fa-users"></i>
            </button>
        </div>
        <div style="display:flex; gap:8px">
            <button class="btn-control" onclick="window.location.reload()"><i class="fa-solid fa-rotate"></i></button>
            <button class="btn-control" onclick="leaveRoom()"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </header>

    <div class="chat-area" id="chatArea"></div>

    <footer class="footer">
        <div class="input-box">
            <input type="text" id="chatInput" class="main-input" placeholder="اكتب شيئاً..." autocomplete="off">
        </div>
        <button id="giftBtn" class="btn-action" style="background:var(--accent)" onclick="toggleSheet('giftSheet', true)">
            <i class="fa-solid fa-gift"></i>
        </button>
        <button id="sendBtn" class="btn-action hidden" style="background:var(--primary)" onclick="sendMsg()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </footer>
</div>

<!-- Sheet: Profile -->
<div class="sheet-overlay" id="profileSheet">
    <div style="flex:1" onclick="toggleSheet('profileSheet', false)"></div>
    <div class="bottom-sheet">
        <div style="text-align:center">
            <div style="position:relative; width:90px; height:90px; margin:0 auto" id="profileAvatarContainer">
                <!-- Avatar & Frame (SVG supported) -->
            </div>
            <h3 id="p-name" style="margin-top:15px">---</h3>
            <p id="p-id" style="color:#888; font-size:12px">ID: ---</p>
            
            <div style="display:flex; justify-content:center; gap:20px; margin:15px 0">
                <div style="text-align:center"><div class="badge b-magic" style="font-size:12px">M.<span id="p-magic-lvl">1</span></div></div>
                <div style="text-align:center"><div class="badge b-wealth" style="font-size:12px">W.<span id="p-wealth-lvl">1</span></div></div>
            </div>

            <div style="display:flex; justify-content:center; gap:10px">
                <button class="btn-action" style="background:var(--accent)" onclick="handleProfileGift()"><i class="fa-solid fa-gift"></i></button>
                <button class="btn-action" style="background:var(--primary)" onclick="handleProfileMention()"><i class="fa-solid fa-at"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- Sheet: Gifts -->
<div class="sheet-overlay" id="giftSheet">
    <div style="flex:1" onclick="toggleSheet('giftSheet', false)"></div>
    <div class="bottom-sheet">
        <div class="section-title">اختر الهدية</div>
        <div id="giftsGrid" class="gifts-grid"></div>

        <div class="section-title">اختر المستلم</div>
        <div id="receiversList" class="receivers-list"></div>

        <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px solid var(--glass-border); padding-top: 15px;">
            <div style="font-size:12px">رصيدك: <span id="myBalance" style="color:var(--accent)">0</span> 🪙</div>
            <button onclick="sendGift()" style="background:var(--accent); border:none; padding:12px 35px; border-radius:25px; color:white; font-weight:bold; cursor:pointer">إرسال الهدية</button>
        </div>
    </div>
</div>

<!-- Sheet: Active Users -->
<div class="sheet-overlay" id="activeUsersSheet">
    <div style="flex:1" onclick="toggleSheet('activeUsersSheet', false)"></div>
    <div class="bottom-sheet">
        <h3 style="margin-bottom:20px">المتواجدون حالياً</h3>
        <div id="activeUsersList" class="active-users-grid"></div>
    </div>
</div>

<script>
    // Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
        authDomain: "rtx3090-28439.firebaseapp.com",
        databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com",
        projectId: "rtx3090-28439",
        storageBucket: "rtx3090-28439.firebasestorage.app",
        messagingSenderId: "178612030690",
        appId: "1:178612030690:web:883189ced2ed3a78e3e2bb"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const rtdb = firebase.database();

    let user = null, userData = null, room = null, roomId = null;
    let storeData = { gifts: [], frames: {} };
    let activeUsers = {}, selectedGift = null, selectedReceiverId = null;
    let joinTime = Date.now(); // الوقت الذي دخل فيه المستخدم الغرفة حالياً

    const urlParams = new URLSearchParams(window.location.search);
    roomId = urlParams.get('id') || 'default_room';

    window.onload = async () => {
        // تخزين وقت الدخول الجديد لمسح الرسائل القديمة في الواجهة فقط
        localStorage.setItem(`joinTime_${roomId}`, Date.now());
        joinTime = parseInt(localStorage.getItem(`joinTime_${roomId}`));

        await loadStore();
        auth.onAuthStateChanged(async (u) => {
            if (u) {
                user = u;
                await syncUser();
                await joinRoom();
            } else {
                window.location.href = "index.html";
            }
        });
    };

    async function loadStore() {
        const [g, f] = await Promise.all([
            db.collection('gifts').get(),
            db.collection('storeItems').where('type', '==', 'frame').get()
        ]);
        g.forEach(d => storeData.gifts.push({id: d.id, ...d.data()}));
        f.forEach(d => storeData.frames[d.id] = d.data());
    }

    async function syncUser() {
        const doc = await db.collection('users').doc(user.uid).get();
        userData = doc.data();
        if (!userData) return;
        document.getElementById('myBalance').textContent = userData.balance || 0;
    }

    async function joinRoom() {
        const rDoc = await db.collection('rooms').doc(roomId).get();
        if (!rDoc.exists) return;
        room = rDoc.data();
        
        document.getElementById('roomName').textContent = room.name;
        document.getElementById('roomOwnerId').textContent = `ID: ${room.owner}`;
        
        const oDoc = await db.collection('users').doc(room.owner).get();
        if(oDoc.exists) document.getElementById('roomOwnerImg').src = oDoc.data().photoURL;

        // الحضور في RTDB
        const pRef = rtdb.ref(`rooms/${roomId}/users/${user.uid}`);
        pRef.set({
            uid: user.uid,
            name: userData.displayName,
            photo: userData.photoURL,
            frame: userData.activeFrame || null,
            lvlM: userData.magicLevel || 1,
            lvlW: userData.wealthLevel || 1
        });
        pRef.onDisconnect().remove();

        listenChat();
        listenUsers();
    }

    function listenChat() {
        const chatRef = rtdb.ref(`rooms/${roomId}/messages`);
        // نستمع فقط للرسائل التي أرسلت بعد لحظة دخولنا
        chatRef.orderByChild('time').startAt(joinTime).on('child_added', (snap) => {
            renderMsg(snap.val());
        });
    }

    function listenUsers() {
        rtdb.ref(`rooms/${roomId}/users`).on('value', (snap) => {
            activeUsers = snap.val() || {};
            updateActiveUsersList();
            updateReceiversList();
        });
    }

    function updateActiveUsersList() {
        const list = document.getElementById('activeUsersList');
        list.innerHTML = "";
        Object.values(activeUsers).forEach(u => {
            const div = document.createElement('div');
            div.className = 'active-user-card';
            div.onclick = () => openProfile(u.uid);
            div.innerHTML = `<img src="${u.photo}" class="active-user-avatar"><span>${u.name}</span>`;
            list.appendChild(div);
        });
    }

    function updateReceiversList() {
        const list = document.getElementById('receiversList');
        list.innerHTML = "";
        Object.values(activeUsers).forEach(u => {
            const div = document.createElement('div');
            div.className = 'receiver-card';
            div.id = `recv_${u.uid}`;
            div.onclick = () => selectReceiver(u.uid);
            div.innerHTML = `<img src="${u.photo}" class="receiver-avatar"><span style="font-size:9px; text-align:center; overflow:hidden; width:100%">${u.name}</span>`;
            list.appendChild(div);
        });
    }

    function selectReceiver(uid) {
        selectedReceiverId = uid;
        document.querySelectorAll('.receiver-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`recv_${uid}`).classList.add('selected');
    }

    function renderMsg(msg) {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-bubble';
        
        if (msg.type === 'gift') {
            const g = storeData.gifts.find(x => x.id === msg.giftId);
            div.style.background = "rgba(139, 92, 246, 0.15)";
            div.innerHTML = `<div class="msg-text">🎁 <b style="color:var(--accent)">${msg.senderName}</b> أرسل <b>${g?.name || 'هدية'}</b> إلى <b>${msg.toName}</b></div>`;
        } else {
            const frameHtml = msg.frame ? `<img src="${storeData.frames[msg.frame]?.image}" class="msg-frame">` : '';
            div.innerHTML = `
                <div class="msg-avatar-wrapper">
                    <img src="${msg.photo}" class="msg-avatar" onclick="openProfile('${msg.senderId}')">
                    ${frameHtml}
                </div>
                <div style="flex:1">
                    <div class="msg-user">
                        ${msg.senderName}
                        <span class="badge b-wealth">W.${msg.lvlW}</span>
                        <span class="badge b-magic">M.${msg.lvlM}</span>
                    </div>
                    <div class="msg-text">${msg.text}</div>
                </div>
            `;
        }
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    async function sendMsg() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        rtdb.ref(`rooms/${roomId}/messages`).push({
            senderId: user.uid,
            senderName: userData.displayName,
            photo: userData.photoURL,
            frame: userData.activeFrame || null,
            text: text,
            lvlM: userData.magicLevel || 1,
            lvlW: userData.wealthLevel || 1,
            type: 'text',
            time: Date.now()
        });
        input.value = "";
    }

    async function openProfile(uid) {
        const d = await db.collection('users').doc(uid).get();
        const p = d.data();
        
        document.getElementById('p-name').textContent = p.displayName;
        document.getElementById('p-id').textContent = `ID: ${uid}`;
        document.getElementById('p-magic-lvl').textContent = p.magicLevel || 1;
        document.getElementById('p-wealth-lvl').textContent = p.wealthLevel || 1;
        
        // بناء الأفاتار مع الإطار (SVG أو Image)
        const container = document.getElementById('profileAvatarContainer');
        const frameUrl = p.activeFrame ? storeData.frames[p.activeFrame]?.image : null;
        
        container.innerHTML = `
            <img src="${p.photoURL}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid var(--accent)">
            ${frameUrl ? `<img src="${frameUrl}" style="position:absolute; inset:-12px; width:114px; height:114px; pointer-events:none; z-index:2">` : ''}
        `;

        toggleSheet('profileSheet', true);
        selectedReceiverId = uid; // افتراضياً الشخص الذي تفتح بروفايله هو المستلم
    }

    function renderGiftsList() {
        const grid = document.getElementById('giftsGrid');
        grid.innerHTML = "";
        storeData.gifts.forEach(g => {
            const card = document.createElement('div');
            card.className = 'gift-card';
            card.id = `gift_${g.id}`;
            card.onclick = () => {
                selectedGift = g;
                document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
            };
            card.innerHTML = `<div class="gift-icon">${g.icon}</div><div style="font-size:10px">${g.name}</div><div style="font-size:9px;color:var(--accent)">${g.price} 🪙</div>`;
            grid.appendChild(card);
        });
    }

    async function sendGift() {
        if(!selectedGift) return showNotify("اختر هدية أولاً");
        if(!selectedReceiverId) return showNotify("اختر المستلم من القائمة");
        if(userData.balance < selectedGift.price) return showNotify("رصيدك غير كافٍ");

        const targetRef = db.collection('users').doc(selectedReceiverId);
        const myRef = db.collection('users').doc(user.uid);

        try {
            await db.runTransaction(async (t) => {
                const targetDoc = await t.get(targetRef);
                const targetData = targetDoc.data();
                
                t.update(myRef, { balance: firebase.firestore.FieldValue.increment(-selectedGift.price) });
                
                let update = {};
                if(selectedGift.type === 'magic') update.magicLevel = firebase.firestore.FieldValue.increment(1);
                else update.wealthLevel = firebase.firestore.FieldValue.increment(1);
                
                t.update(targetRef, update);

                // إرسال رسالة الهدية لـ RTDB
                rtdb.ref(`rooms/${roomId}/messages`).push({
                    type: 'gift',
                    giftId: selectedGift.id,
                    senderName: userData.displayName,
                    toName: targetData.displayName,
                    time: Date.now()
                });
            });

            showGiftFx(selectedGift.icon);
            showNotify("تم إرسال الهدية بنجاح!");
            toggleSheet('giftSheet', false);
            syncUser();
        } catch (e) {
            showNotify("فشل الإرسال، حاول لاحقاً");
        }
    }

    function showNotify(msg) {
        const n = document.createElement('div');
        n.className = 'notification';
        n.textContent = msg;
        document.body.appendChild(n);
        setTimeout(() => n.remove(), 2500);
    }

    function showGiftFx(icon) {
        const f = document.createElement('div');
        f.className = 'gift-fx';
        f.textContent = icon;
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 1500);
    }

    function toggleSheet(id, show) {
        document.querySelectorAll('.sheet-overlay').forEach(s => { if(s.id !== id) s.classList.remove('show') });
        const el = document.getElementById(id);
        el.classList.toggle('show', show);
        if(id === 'giftSheet' && show) renderGiftsList();
    }

    // Controls Logic
    document.getElementById('chatInput').oninput = (e) => {
        const hasText = e.target.value.trim().length > 0;
        document.getElementById('giftBtn').classList.toggle('hidden', hasText);
        document.getElementById('sendBtn').classList.toggle('hidden', !hasText);
    };

    function handleProfileGift() {
        toggleSheet('profileSheet', false);
        toggleSheet('giftSheet', true);
    }

    function handleProfileMention() {
        const name = document.getElementById('p-name').textContent;
        document.getElementById('chatInput').value = `@${name} `;
        toggleSheet('profileSheet', false);
        document.getElementById('chatInput').focus();
    }

    function leaveRoom() {
        rtdb.ref(`rooms/${roomId}/users/${user.uid}`).remove();
        window.location.href = "index.html";
    }
</script>
</body>
</html>
