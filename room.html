<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Afnan AI - Room</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #8b5cf6; --accent: #f59e0b; --bg-black: #000000; --glass: rgba(255, 255, 255, 0.1); --glass-border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-black); color: #fff; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        #roomBg { position: fixed; inset: 0; background-size: cover; background-position: center; z-index: -1; }
        .app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative; }
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 8px 12px; border-radius: 15px; display: flex; align-items: flex-start; gap: 10px; max-width: 85%; animation: slideIn 0.3s ease; }
        .avatar-wrapper { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .frame-img { position: absolute; inset: -5px; width: 50px; height: 50px; pointer-events: none; z-index: 2; }
        .footer { padding: 10px 15px 25px; display: flex; align-items: center; gap: 10px; }
        .input-box { flex: 1; background: var(--glass); border-radius: 25px; height: 46px; padding: 0 15px; display: flex; align-items: center; }
        .main-input { background: transparent; border: none; color: #fff; width: 100%; font-size: 14px; }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; pointer-events: none; transition: 0.3s; }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }
        .bottom-sheet { background: rgba(20, 20, 25, 0.98); width: 100%; border-radius: 30px 30px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .btn-action { padding: 12px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .hidden { display: none !important; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div id="roomBg"></div>
<div class="app-container">
    <header class="header">
        <div style="display:flex; align-items:center; gap:10px">
            <button onclick="leaveRoom()" style="background:none; border:none; color:#fff; font-size:20px"><i class="fa-solid fa-chevron-right"></i></button>
            <div>
                <h4 id="roomName">تحميل...</h4>
                <p id="roomUserCount" style="font-size:10px; color:var(--accent)">0 متصل</p>
            </div>
        </div>
        <button id="btnSettings" class="hidden" onclick="toggleSheet('settingsSheet', true)"><i class="fa-solid fa-gear"></i></button>
    </header>
    <div class="chat-area" id="chatArea"></div>
    <footer class="footer">
        <div class="input-box"><input type="text" id="chatInput" class="main-input" placeholder="اكتب شيئاً..."></div>
        <button onclick="sendMsg()" style="background:var(--accent); width:44px; height:44px; border-radius:50%; border:none; color:#fff"><i class="fa-solid fa-paper-plane"></i></button>
    </footer>
</div>

<!-- Settings Sheet -->
<div id="settingsSheet" class="sheet-overlay" onclick="toggleSheet('settingsSheet', false)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <h3>إعدادات الغرفة</h3>
        <div style="margin-top:15px">
            <label>اسم الغرفة</label>
            <input type="text" id="setRoomName" style="width:100%; padding:10px; margin-top:5px; border-radius:10px; background:rgba(255,255,255,0.1); border:none; color:#fff">
        </div>
        <div style="margin-top:15px">
            <label>تغيير الخلفية (Supabase)</label>
            <input type="file" id="setRoomBg" accept="image/*" style="width:100%; margin-top:5px">
        </div>
        <button id="saveSettingsBtn" class="btn-action" style="background:var(--primary); color:#fff" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    const firebaseConfig = { apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY", authDomain: "rtx3090-28439.firebaseapp.com", projectId: "rtx3090-28439", storageBucket: "rtx3090-28439.firebasestorage.app", messagingSenderId: "178612030690", appId: "1:178612030690:web:883189ced2ed3a78e3e2bb", databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const rtdb = firebase.database();
    
    const supabaseUrl = 'https://uxfpjwuvvfkxwasatddo.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4ZnBqd3V2dmZreHdhc2F0ZGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MzMyMjcsImV4cCI6MjA4NTQwOTIyN30.1x9Y7QVIzXOUSFT74nOZ2e1WAVdudOfnoE-E8ol-J5g';
    const supabase = window.supabase?.createClient(supabaseUrl, supabaseKey);

    let user, userData, room, storeData = { frames: {} };

    firebase.auth().onAuthStateChanged(async (u) => {
        if (!u) return window.location.href = "login.html";
        user = u;
        const snap = await db.collection('users').doc(u.uid).get();
        userData = snap.data();
        await loadStore();
        await loadRoom();
        joinRoom();
    });

    async function loadStore() {
        const sSnap = await db.collection('storeItems').where('type', '==', 'frame').get();
        sSnap.forEach(doc => storeData.frames[doc.id] = doc.data());
    }

    async function loadRoom() {
        const rSnap = await db.collection('rooms').doc(roomId).get();
        room = rSnap.data();
        document.getElementById('roomName').textContent = room.name;
        document.getElementById('setRoomName').value = room.name;
        if (room.background) document.getElementById('roomBg').style.backgroundImage = `url(${room.background})`;
        if (room.owner === user.uid) document.getElementById('btnSettings').classList.remove('hidden');
    }

    function joinRoom() {
        const pRef = rtdb.ref(`rooms/${roomId}/users/${user.uid}`);
        pRef.set({ uid: user.uid, name: userData.displayName, photo: userData.photoURL });
        pRef.onDisconnect().remove();
        
        rtdb.ref(`rooms/${roomId}/users`).on('value', (s) => {
            document.getElementById('roomUserCount').textContent = `${s.numChildren()} متصل`;
        });

        // عرض الرسائل السابقة (آخر 50 رسالة)
        rtdb.ref(`rooms/${roomId}/messages`).limitToLast(50).once('value', (s) => {
            s.forEach(m => renderMsg(m.val()));
        });

        // الاستماع للرسائل الجديدة
        rtdb.ref(`rooms/${roomId}/messages`).limitToLast(1).on('child_added', (s) => {
            const msg = s.val();
            if (msg.time > Date.now() - 5000) renderMsg(msg);
        });
    }

    async function renderMsg(msg) {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-bubble';
        const msgId = 'msg_' + Math.random().toString(36).substr(2, 9);
        
        div.innerHTML = `
            <div class="avatar-wrapper">
                <img src="${msg.photo}" class="avatar-img">
                <div id="frame_${msgId}" class="frame-img"></div>
            </div>
            <div>
                <p style="font-size:11px; font-weight:bold; color:var(--accent)">${msg.senderName}</p>
                <p style="font-size:13px">${msg.text}</p>
            </div>`;
        area.appendChild(div);
        
        const uSnap = await db.collection('users').doc(msg.senderId).get();
        const u = uSnap.data();
        if (u && u.last_active_frame) {
            const f = storeData.frames[u.last_active_frame];
            if (f) {
                const fCont = document.getElementById(`frame_${msgId}`);
                if (f.itemType === 'svga') playSvga(f.fileUrl, fCont);
                else fCont.innerHTML = `<img src="${f.image}" style="width:100%; height:100%">`;
            }
        }
        area.scrollTop = area.scrollHeight;
    }

    function sendMsg() {
        const inp = document.getElementById('chatInput');
        if (!inp.value.trim()) return;
        rtdb.ref(`rooms/${roomId}/messages`).push({ senderId: user.uid, senderName: userData.displayName, photo: userData.photoURL, text: inp.value, time: Date.now() });
        inp.value = '';
    }

    async function saveSettings() {
        const btn = document.getElementById('saveSettingsBtn');
        btn.disabled = true; btn.innerText = "جاري الحفظ...";
        const newName = document.getElementById('setRoomName').value;
        const bgFile = document.getElementById('setRoomBg').files[0];
        let background = room.background;
        
        if (bgFile && supabase) {
            const ext = bgFile.name.split('.').pop();
            const fileName = `${Date.now()}.${ext}`;
            const { data } = await supabase.storage.from('uploads').upload(`rooms/${fileName}`, bgFile);
            if (data) {
                const { data: urlData } = supabase.storage.from('uploads').getPublicUrl(`rooms/${fileName}`);
                background = urlData.publicUrl;
            }
        }
        
        await db.collection('rooms').doc(roomId).update({ name: newName, background });
        location.reload();
    }

    function playSvga(url, container) {
        const player = new SVGA.Player(container);
        const parser = new SVGA.Parser();
        parser.load(url, (videoItem) => { player.setVideoItem(videoItem); player.startAnimation(); });
    }

    function toggleSheet(id, s) { document.getElementById(id).classList.toggle('show', s); }
    function leaveRoom() { window.location.href = "afnan_ai_white.html"; }
</script>
</body>
</html>
