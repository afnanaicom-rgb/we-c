<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Premium Live Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>
    <style>
        :root { --primary: #8b5cf6; --accent: #f59e0b; --bg-black: #000000; --glass: rgba(255, 255, 255, 0.1); --glass-border: rgba(255, 255, 255, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-black); color: #fff; height: 100dvh; overflow: hidden; display: flex; justify-content: center; }
        .app-bg { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, #1e1b4b 0%, #000000 50%); z-index: -1; }
        .app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative; }
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .room-info { display: flex; align-items: center; gap: 10px; background: var(--glass); padding: 5px 12px; border-radius: 30px; border: 1px solid var(--glass-border); cursor: pointer; }
        .owner-img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .btn-control { background: transparent; border: none; color: #fff; font-size: 18px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.8; }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg-bubble { background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); padding: 10px; border-radius: 18px; border-bottom-right-radius: 2px; backdrop-filter: blur(10px); display: flex; align-items: flex-start; gap: 10px; max-width: 85%; animation: slideIn 0.3s ease; }
        .msg-avatar-wrapper { position: relative; width: 45px; height: 45px; flex-shrink: 0; }
        .msg-avatar { width: 100%; height: 100%; border-radius: 50%; cursor: pointer; position: relative; z-index: 1; object-fit: cover; }
        .msg-frame-container { position: absolute; inset: -5px; width: 55px; height: 55px; pointer-events: none; z-index: 2; }
        .msg-user { font-size: 11px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
        .msg-text { font-size: 13px; line-height: 1.5; color: #eee; word-break: break-word; }
        .badge-container { display: inline-flex; align-items: center; gap: 2px; }
        .lvl-badge { width: 20px; height: 20px; object-fit: contain; }
        .footer { padding: 10px 15px 25px; display: flex; align-items: center; gap: 10px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .input-box { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 25px; height: 46px; padding: 0 15px; display: flex; align-items: center; }
        .main-input { background: transparent; border: none; color: #fff; width: 100%; font-size: 14px; font-family: inherit; }
        .btn-action { width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: 0.2s; font-size: 18px; }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; pointer-events: none; transition: 0.3s; }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }
        .bottom-sheet { background: rgba(20, 20, 25, 0.98); backdrop-filter: blur(40px); width: 100%; border-radius: 30px 30px 0 0; border-top: 1px solid var(--glass-border); transform: translateY(100%); transition: 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); padding: 20px; max-height: 85vh; overflow-y: auto; }
        .sheet-overlay.show .bottom-sheet { transform: translateY(0); }
        .profile-avatar-wrapper { position: relative; width: 100px; height: 100px; margin: 0 auto 15px; }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); }
        .profile-frame { position: absolute; inset: -10px; width: 120px; height: 120px; z-index: 2; pointer-events: none; }
        .profile-badges { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
        .action-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .action-btn { flex: 1; padding: 12px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-follow { background: var(--accent); color: #000; }
        .btn-msg { background: var(--primary); color: #fff; }
        .btn-gift { background: #ef4444; color: #fff; }
        .btn-mention { background: #3b82f6; color: #fff; }
        .gifts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .gift-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; border: 1px solid transparent; cursor: pointer; }
        .gift-card.selected { background: rgba(245, 158, 11, 0.15); border-color: var(--accent); }
        .gift-icon { width: 40px; height: 40px; object-fit: contain; }
        .hidden { display: none !important; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="app-bg"></div>
<div class="app-container">
    <header class="header">
        <div class="header-left">
            <div class="room-info" onclick="openProfile(room.owner)">
                <img src="" class="owner-img" id="roomOwnerImg">
                <div>
                    <span style="font-size:9px; color:var(--accent)" id="roomOwnerId">ID: ---</span>
                    <div style="font-size:12px; font-weight:bold" id="roomName">تحميل...</div>
                </div>
            </div>
        </div>
        <div style="display:flex; gap:8px">
            <button class="btn-control" onclick="window.location.reload()"><i class="fa-solid fa-rotate"></i></button>
            <button class="btn-control" onclick="leaveRoom()"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </header>
    <div class="chat-area" id="chatArea"></div>
    <footer class="footer">
        <div class="input-box">
            <input type="text" id="chatInput" class="main-input" placeholder="اكتب شيئاً..." oninput="toggleSendBtn()">
        </div>
        <button id="giftBtn" class="btn-action" style="background:var(--primary)" onclick="toggleSheet('giftSheet', true)"><i class="fa-solid fa-gift"></i></button>
        <button id="sendBtn" class="btn-action hidden" style="background:var(--accent)" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </footer>
</div>

<!-- Profile Sheet -->
<div id="profileSheet" class="sheet-overlay" onclick="toggleSheet('profileSheet', false)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="profile-avatar-wrapper" id="p-avatar-container">
            <img src="" class="profile-avatar" id="p-img">
            <div id="p-frame" class="profile-frame"></div>
        </div>
        <h2 id="p-name" style="text-align:center; font-size:20px">---</h2>
        <p id="p-id" style="text-align:center; font-size:12px; color:#888; margin-bottom:15px">ID: ---</p>
        
        <div style="display:flex; justify-content:center; gap:15px; margin-bottom:15px">
            <div style="text-align:center"><img id="p-magic-img" src="" class="lvl-badge"><p style="font-size:10px">Magic: <span id="p-magic-lvl">1</span></p></div>
            <div style="text-align:center"><img id="p-wealth-img" src="" class="lvl-badge"><p style="font-size:10px">Wealth: <span id="p-wealth-lvl">1</span></p></div>
        </div>

        <div id="p-badges" class="profile-badges"></div>

        <div class="action-btns">
            <button id="btn-add-friend" class="action-btn btn-follow" onclick="addFriend()"><i class="fa-solid fa-user-plus"></i> إضافة صديق</button>
            <button id="btn-private-msg" class="action-btn btn-msg hidden" onclick="openPrivateChat()"><i class="fa-solid fa-envelope"></i> رسالة</button>
            <button class="action-btn btn-gift" onclick="toggleSheet('giftSheet', true); toggleSheet('profileSheet', false)"><i class="fa-solid fa-gift"></i> هدايا</button>
            <button class="action-btn btn-mention" onclick="mentionUser()"><i class="fa-solid fa-at"></i> @</button>
        </div>
    </div>
</div>

<!-- Gift Sheet -->
<div id="giftSheet" class="sheet-overlay" onclick="toggleSheet('giftSheet', false)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <h3 style="margin-bottom:15px">إرسال هدية</h3>
        <div id="giftsGrid" class="gifts-grid"></div>
        <button class="action-btn btn-gift" style="width:100%; margin-top:20px" onclick="sendGift()">إرسال</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    const firebaseConfig = { apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY", authDomain: "rtx3090-28439.firebaseapp.com", projectId: "rtx3090-28439", storageBucket: "rtx3090-28439.firebasestorage.app", messagingSenderId: "178612030690", appId: "1:178612030690:web:883189ced2ed3a78e3e2bb", databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const rtdb = firebase.database();
    let user, userData, room, selectedUserId, storeData = { frames: {}, badges: {}, gifts: [] };
    let joinTime = Date.now();

    firebase.auth().onAuthStateChanged(async (u) => {
        if (!u) return window.location.href = "login.html";
        user = u;
        const snap = await db.collection('users').doc(u.uid).get();
        userData = snap.data();
        await loadStore();
        await loadRoom();
        joinRoom();
    });

    async function loadStore() {
        const sSnap = await db.collection('storeItems').get();
        sSnap.forEach(doc => {
            const d = doc.data();
            if(d.type === 'frame') storeData.frames[doc.id] = d;
            if(d.type === 'badge') storeData.badges[doc.id] = d;
        });
        const gSnap = await db.collection('gifts').get();
        storeData.gifts = gSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function loadRoom() {
        const rSnap = await db.collection('rooms').doc(roomId).get();
        room = rSnap.data();
        document.getElementById('roomName').textContent = room.name;
        document.getElementById('roomOwnerId').textContent = `ID: ${room.owner}`;
        const oSnap = await db.collection('users').doc(room.owner).get();
        if(oSnap.exists) document.getElementById('roomOwnerImg').src = oSnap.data().photoURL;
    }

    function joinRoom() {
        const pRef = rtdb.ref(`rooms/${roomId}/users/${user.uid}`);
        pRef.set({ uid: user.uid, name: userData.displayName, photo: userData.photoURL });
        pRef.onDisconnect().remove();
        listenChat();
    }

    function listenChat() {
        // الاستماع للرسائل الجديدة فقط التي أرسلت بعد وقت الانضمام
        rtdb.ref(`rooms/${roomId}/messages`).orderByChild('time').startAt(joinTime).on('child_added', (snap) => {
            renderMsg(snap.val(), snap.key);
        });
    }

    function toggleSendBtn() {
        const inp = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const giftBtn = document.getElementById('giftBtn');
        if(inp.value.trim().length > 0) {
            sendBtn.classList.remove('hidden');
            giftBtn.classList.add('hidden');
        } else {
            sendBtn.classList.add('hidden');
            giftBtn.classList.remove('hidden');
        }
    }

    async function renderMsg(msg, msgId) {
        const area = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-bubble';
        div.innerHTML = `
            <div class="msg-avatar-wrapper">
                <img src="${msg.photo}" class="msg-avatar" onclick="openProfile('${msg.senderId}')">
                <div id="frame_${msgId}" class="msg-frame-container"></div>
            </div>
            <div style="flex:1">
                <div class="msg-user">${msg.senderName} <div id="badges_${msgId}" class="badge-container"></div></div>
                <div class="msg-text">${msg.text}</div>
            </div>`;
        area.appendChild(div);
        
        const uSnap = await db.collection('users').doc(msg.senderId).get();
        const u = uSnap.data();
        if(u && u.activeFrame) {
            const f = storeData.frames[u.activeFrame];
            if(f) {
                const fCont = document.getElementById(`frame_${msgId}`);
                if(f.itemType === 'svga') playSvga(f.fileUrl, fCont);
                else fCont.innerHTML = `<img src="${f.image}" style="width:100%; height:100%">`;
            }
        }
        area.scrollTop = area.scrollHeight;
    }

    async function openProfile(uid) {
        selectedUserId = uid;
        const snap = await db.collection('users').doc(uid).get();
        const p = snap.data();
        document.getElementById('p-name').textContent = p.displayName;
        document.getElementById('p-id').textContent = `ID: ${uid}`;
        document.getElementById('p-img').src = p.photoURL;
        document.getElementById('p-magic-lvl').textContent = p.magicLevel || 1;
        document.getElementById('p-wealth-lvl').textContent = p.wealthLevel || 1;
        
        const fCont = document.getElementById('p-frame');
        fCont.innerHTML = '';
        if(p.activeFrame) {
            const f = storeData.frames[p.activeFrame];
            if(f) {
                if(f.itemType === 'svga') playSvga(f.fileUrl, fCont);
                else fCont.innerHTML = `<img src="${f.image}" style="width:100%; height:100%">`;
            }
        }

        const bCont = document.getElementById('p-badges');
        bCont.innerHTML = '';
        if(p.activeBadges) {
            p.activeBadges.forEach(bid => {
                const b = storeData.badges[bid];
                if(b) bCont.innerHTML += `<img src="${b.image}" class="lvl-badge">`;
            });
        }

        const isFriend = userData.friends?.includes(uid);
        document.getElementById('btn-add-friend').classList.toggle('hidden', isFriend || uid === user.uid);
        document.getElementById('btn-private-msg').classList.toggle('hidden', !isFriend || uid === user.uid);
        
        toggleSheet('profileSheet', true);
    }

    function sendMsg() {
        const inp = document.getElementById('chatInput');
        if(!inp.value.trim()) return;
        rtdb.ref(`rooms/${roomId}/messages`).push({
            senderId: user.uid, senderName: userData.displayName, photo: userData.photoURL, text: inp.value, time: Date.now()
        });
        inp.value = '';
        toggleSendBtn();
    }

    function playSvga(url, container) {
        container.innerHTML = '';
        const player = new SVGA.Player(container);
        const parser = new SVGA.Parser();
        parser.load(url, (videoItem) => { player.setVideoItem(videoItem); player.startAnimation(); });
    }

    function toggleSheet(id, show) {
        document.getElementById(id).classList.toggle('show', show);
        if(id === 'giftSheet' && show) {
            const grid = document.getElementById('giftsGrid');
            grid.innerHTML = '';
            storeData.gifts.forEach(g => {
                grid.innerHTML += `<div class="gift-card" onclick="selectGift('${g.id}')" id="g_${g.id}"><img src="${g.image}" class="gift-icon"><p style="font-size:10px">${g.name}</p><p style="font-size:9px;color:var(--accent)">${g.price} 🪙</p></div>`;
            });
        }
    }

    let selectedGiftId;
    function selectGift(id) {
        selectedGiftId = id;
        document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`g_${id}`).classList.add('selected');
    }

    async function sendGift() {
        if(!selectedGiftId) return;
        const gift = storeData.gifts.find(g => g.id === selectedGiftId);
        if(userData.balance < gift.price) return alert("رصيدك غير كافٍ");
        
        // تحديث رصيد المرسل ومستوى ثراء المستلم في Firestore
        await db.collection('users').doc(user.uid).update({ balance: firebase.firestore.FieldValue.increment(-gift.price) });
        await db.collection('users').doc(selectedUserId).update({ wealthLevel: firebase.firestore.FieldValue.increment(gift.price) });
        
        rtdb.ref(`rooms/${roomId}/messages`).push({ type: 'gift', giftId: gift.id, senderName: userData.displayName, senderId: user.uid, photo: userData.photoURL, text: `أرسل هدية ${gift.name}`, time: Date.now() });
        toggleSheet('giftSheet', false);
    }

    function mentionUser() {
        const name = document.getElementById('p-name').textContent;
        document.getElementById('chatInput').value = `@${name} `;
        toggleSheet('profileSheet', false);
        document.getElementById('chatInput').focus();
        toggleSendBtn();
    }

    async function addFriend() {
        await db.collection('users').doc(selectedUserId).update({ friendRequests: firebase.firestore.FieldValue.arrayUnion(user.uid) });
        alert("تم إرسال طلب الصداقة");
    }

    function openPrivateChat() {
        window.location.href = `chat.html?target=${selectedUserId}`;
    }

    function leaveRoom() {
        rtdb.ref(`rooms/${roomId}/users/${user.uid}`).remove();
        window.location.href = "afnan_ai_white.html";
    }
</script>
</body>
</html>
