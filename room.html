<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Room - Afnan AI</title>
    
    <!-- مكتبات خارجية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مشغل SVGA للرسوم المتحركة (السيارات والهدايا) -->
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>

    <style>
        :root {
            --primary: #7c3aed;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh; /* استخدام dvh للموبايل */
            height: 100dvh;
        }

        /* خلفية متدرجة فخمة */
        .premium-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 10%, #2e1065 0%, #020617 80%);
        }

        /* حاوية مرنة تملأ الشاشة */
        .layout-container {
            display: flex; flex-direction: column;
            width: 100%; height: 100%;
            max-width: 100%; /* تصميم حر */
            margin: 0 auto;
            position: relative;
        }

        /* --- تحسينات التمرير --- */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- أنماط الشات والبروفايل --- */
        .chat-bubble {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
        }
        
        /* إطار الصورة (Avatar Frame) */
        .avatar-container {
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        .user-avatar {
            border-radius: 50%; object-fit: cover;
            border: 2px solid transparent;
        }
        .frame-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 135%; height: 135%; /* الإطار دائماً أكبر من الصورة */
            pointer-events: none;
            z-index: 2;
            object-fit: contain;
        }

        /* مستويات وشارات */
        .level-badge {
            display: inline-flex; align-items: center; gap: 2px;
            padding: 1px 6px; border-radius: 10px;
            font-size: 9px; font-weight: bold;
            background: rgba(255,255,255,0.1);
        }
        .badge-icon { width: 14px; height: 14px; object-fit: contain; }

        /* --- طبقة الأنيميشن (دخول السيارات) --- */
        #animationLayer {
            position: fixed; inset: 0; z-index: 9999;
            pointer-events: none; /* يسمح بالضغط من خلاله */
            display: flex; align-items: center; justify-content: center;
        }
        .svga-canvas {
            width: 100%; height: 100%;
            max-width: 600px; /* حجم السيارة */
        }
        
        /* رسالة الترحيب عند الدخول */
        .entry-banner {
            position: absolute; top: 20%; left: 0; right: 0;
            text-align: center;
            animation: slideInLeft 1s ease-out;
            z-index: 10000;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* القوائم السفلية (Sheets) */
        .bottom-sheet {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: #1e1b4b;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            transform: translateY(110%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            max-width: 600px; margin: 0 auto; /* تقييد العرض في الشاشات الكبيرة */
        }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }

    </style>
</head>
<body>

    <!-- الخلفية -->
    <div class="premium-bg"></div>
    <!-- طبقة الرسوم المتحركة (SVGA) -->
    <div id="animationLayer"></div>

    <div class="layout-container">
        
        <!-- Header -->
        <header class="flex items-center justify-between p-4 z-20 bg-gradient-to-b from-black/60 to-transparent">
            <!-- Room Info -->
            <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10" onclick="showRoomProfile()">
                <div class="avatar-container w-9 h-9">
                    <img id="roomOwnerImg" src="https://via.placeholder.com/100" class="user-avatar w-full h-full">
                    <!-- إطار المالك إذا وجد -->
                    <img id="roomOwnerFrame" src="" class="frame-overlay hidden">
                </div>
                <div class="flex flex-col">
                    <span id="roomName" class="text-xs font-bold text-white truncate max-w-[100px]">...</span>
                    <span id="roomID" class="text-[9px] text-gray-300 font-mono">ID: ...</span>
                </div>
            </div>

            <!-- Header Users (Online) -->
            <div class="flex-1 mx-3 overflow-hidden">
                <div id="topUsersList" class="flex gap-2 overflow-x-auto hide-scrollbar items-center">
                    <!-- سيتم ملؤها عبر JS -->
                </div>
            </div>

            <!-- Controls -->
            <button onclick="exitRoom()" class="w-8 h-8 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center border border-red-500/30">
                <i class="fa-solid fa-power-off text-sm"></i>
            </button>
        </header>

        <!-- Main Chat Area -->
        <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3 relative z-10 hide-scrollbar scroll-smooth">
            <div class="text-center py-4 text-white/30 text-xs">مرحباً بك في غرفة البث المباشر</div>
        </main>

        <!-- Footer -->
        <footer class="p-3 pb-5 z-20 bg-gradient-to-t from-black via-black/80 to-transparent">
            <div class="flex items-center gap-2 max-w-4xl mx-auto">
                <div class="flex-1 bg-white/10 backdrop-blur rounded-full h-11 flex items-center px-4 border border-white/10">
                    <input type="text" id="msgInput" placeholder="قل شيئاً..." class="bg-transparent border-none outline-none text-white text-sm w-full placeholder-gray-400 font-cairo">
                </div>
                
                <button onclick="toggleGiftSheet()" class="w-11 h-11 rounded-full bg-gradient-to-r from-amber-400 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 active:scale-95 transition">
                    <i class="fa-solid fa-gift text-white text-lg animate-pulse"></i>
                </button>
                
                <button id="sendBtn" onclick="sendMessage()" class="w-11 h-11 rounded-full bg-indigo-600 flex items-center justify-center shadow-lg active:scale-95 transition hidden">
                    <i class="fa-solid fa-paper-plane text-white text-sm"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- User Profile Sheet -->
    <div id="profileOverlay" class="sheet-overlay" onclick="closeSheets()"></div>
    <div id="profileSheet" class="bottom-sheet p-6 text-center">
        <div class="avatar-container w-24 h-24 mx-auto mb-3">
            <img id="p-avatar" src="" class="user-avatar w-full h-full border-2 border-indigo-500">
            <img id="p-frame" src="" class="frame-overlay hidden">
        </div>
        
        <h2 id="p-name" class="text-xl font-bold mb-1">User Name</h2>
        <p id="p-id" class="text-xs text-gray-400 mb-4 font-mono">ID: 123456</p>

        <!-- المستويات -->
        <div class="flex justify-center gap-4 mb-6">
            <div class="bg-white/5 p-2 rounded-xl min-w-[80px]">
                <div class="flex items-center justify-center gap-1 text-amber-400 text-xs mb-1">
                    <img id="p-wealth-icon" src="" class="w-4 h-4 object-contain"> ثروة
                </div>
                <span id="p-wealth-val" class="text-lg font-bold">0</span>
            </div>
            <div class="bg-white/5 p-2 rounded-xl min-w-[80px]">
                <div class="flex items-center justify-center gap-1 text-purple-400 text-xs mb-1">
                    <img id="p-magic-icon" src="" class="w-4 h-4 object-contain"> سحر
                </div>
                <span id="p-magic-val" class="text-lg font-bold">0</span>
            </div>
        </div>

        <!-- الشارات -->
        <div id="p-badges" class="flex flex-wrap justify-center gap-2 mb-6"></div>

        <div class="flex gap-3">
            <button class="flex-1 py-3 bg-white/10 rounded-xl font-bold" onclick="alert('قريباً')">متابعة</button>
            <button class="flex-1 py-3 bg-indigo-600 rounded-xl font-bold" onclick="prepareGift()">إرسال هدية</button>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, onSnapshot, updateDoc, increment, addDoc, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getDatabase, ref, push, onChildAdded, set, onDisconnect, serverTimestamp as rtdbTimestamp, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // --- تكوين Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
            authDomain: "rtx3090-28439.firebaseapp.com",
            projectId: "rtx3090-28439",
            storageBucket: "rtx3090-28439.firebasestorage.app",
            messagingSenderId: "178612030690",
            appId: "1:178612030690:web:883189ced2ed3a78e3e2bb",
            databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        // --- المتغيرات العامة (Caches) ---
        let currentUser = null;
        let currentRoomId = new URLSearchParams(window.location.search).get('id');
        let appData = {
            wealthLevels: {},
            magicLevels: {},
            badges: {},
            storeItems: {} // للإطارات والسيارات
        };
        let usersCache = {};
        let activeProfileUser = null;

        // --- 1. التهيئة وتحميل البيانات الوصفية (Metadata) ---
        async function initApp() {
            // تحميل المستويات والشارات والإطارات مرة واحدة عند الفتح
            try {
                // مستويات الثروة
                const wealthSnap = await getDocs(collection(db, "wealthLevels"));
                wealthSnap.forEach(d => appData.wealthLevels[d.id] = d.data());

                // مستويات السحر
                const magicSnap = await getDocs(collection(db, "magicLevels"));
                magicSnap.forEach(d => appData.magicLevels[d.id] = d.data());

                // الشارات
                const badgesSnap = await getDocs(collection(db, "badges"));
                badgesSnap.forEach(d => appData.badges[d.id] = d.data());

                // عناصر المتجر (الإطارات + السيارات)
                const storeSnap = await getDocs(collection(db, "storeItems"));
                storeSnap.forEach(d => appData.storeItems[d.id] = d.data());

                console.log("Metadata Loaded:", appData);
            } catch (e) {
                console.error("Error loading metadata:", e);
            }
        }

        // --- 2. إدارة المصادقة والدخول ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await initApp();
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    currentUser = { uid: user.uid, ...userDoc.data() };
                    
                    // تسجيل الدخول في الـ Realtime Database للحضور
                    setupPresence();
                    
                    // بدء الاستماع للشات
                    startChatListener();
                    
                    // تحميل معلومات الغرفة
                    loadRoomInfo();
                }
            } else {
                window.location.href = "login.html"; // توجيه للخروج
            }
        });

        // --- 3. نظام الحضور والدخول (Entrance System) ---
        function setupPresence() {
            const userStatusRef = ref(rtdb, `roomUsers/${currentRoomId}/${currentUser.uid}`);
            
            // بياناتي التي سيراها الآخرون
            const myPresenceData = {
                uid: currentUser.uid,
                name: currentUser.displayName,
                photo: currentUser.photoURL || "",
                activeEntry: currentUser.activeEntry || null, // معرف السيارة
                timestamp: rtdbTimestamp()
            };

            set(userStatusRef, myPresenceData);
            onDisconnect(userStatusRef).remove();

            // الاستماع للمستخدمين الجدد (تأثير الدخول)
            const roomUsersRef = ref(rtdb, `roomUsers/${currentRoomId}`);
            let initialLoad = true;

            onChildAdded(roomUsersRef, (snapshot) => {
                const userData = snapshot.val();
                
                // إضافة للشريط العلوي
                addHeaderUser(userData);

                // تأثير الدخول (فقط للمستخدمين الجدد، ليس عند تحميل الصفحة)
                if (!initialLoad && userData.uid !== currentUser.uid) {
                    playEntryEffect(userData);
                }
            });

            // بعد ثانية نعتبر التحميل الأولي انتهى
            setTimeout(() => { initialLoad = false; }, 2000);
        }

        // --- 4. تشغيل تأثير الدخول (السيارة) ---
        function playEntryEffect(user) {
            if (!user.activeEntry) return; // ليس لديه سيارة

            const entryItem = appData.storeItems[user.activeEntry];
            if (!entryItem || !entryItem.fileUrl) return;

            // إظهار بانر الاسم
            const animationLayer = document.getElementById('animationLayer');
            const banner = document.createElement('div');
            banner.className = 'entry-banner';
            banner.innerHTML = `
                <div class="inline-block bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg border border-white/20">
                    ✨ دخل ${user.name} ✨
                </div>
            `;
            animationLayer.appendChild(banner);

            // تشغيل SVGA
            const playerDiv = document.createElement('div');
            playerDiv.id = `entry-${Date.now()}`;
            playerDiv.className = 'svga-canvas absolute inset-0 m-auto';
            animationLayer.appendChild(playerDiv);

            const player = new SVGA.Player(playerDiv);
            const parser = new SVGA.Parser();

            parser.load(entryItem.fileUrl, (videoItem) => {
                player.setVideoItem(videoItem);
                player.loops = 1;
                player.clearsAfterStop = true;
                player.startAnimation();
                
                player.onFinished(() => {
                    playerDiv.remove();
                    banner.remove();
                });
            }, (err) => console.log("SVGA Error", err));
        }

        // --- 5. الشات والعرض ---
        function startChatListener() {
            const chatRef = ref(rtdb, `roomChats/${currentRoomId}/messages`);
            // في الواقع نستخدم onChildAdded للرسائل الجديدة لتقليل الحمل
            // هنا للتبسيط onChildAdded
            onChildAdded(chatRef, async (snapshot) => {
                const msg = snapshot.val();
                await renderMessage(msg);
            });
        }

        async function renderMessage(msg) {
            // نحتاج بيانات المستخدم الحالية (للحصول على الليفل والإطار المحدث)
            // لذا قد نجلبها من الكاش أو Firestore إذا لم تكن موجودة
            let userData = usersCache[msg.senderId];
            if (!userData) {
                const snap = await getDoc(doc(db, "users", msg.senderId));
                if (snap.exists()) {
                    userData = snap.data();
                    usersCache[msg.senderId] = userData;
                } else {
                    userData = { displayName: msg.senderName, photoURL: 'default.png' };
                }
            }

            // تجهيز الأصول (Assets)
            const frameUrl = userData.activeFrame && appData.storeItems[userData.activeFrame] ? appData.storeItems[userData.activeFrame].image : null;
            const wealthIcon = appData.wealthLevels[userData.wealthLevel]?.image || '';
            const magicIcon = appData.magicLevels[userData.magicLevel]?.image || '';
            
            // الشارات
            let badgesHtml = '';
            if (userData.badges && Array.isArray(userData.badges)) {
                userData.badges.forEach(bid => {
                    if (appData.badges[bid]) {
                        badgesHtml += `<img src="${appData.badges[bid].image}" class="w-4 h-4 object-contain" title="${appData.badges[bid].name}">`;
                    }
                });
            }

            const container = document.getElementById('chatContainer');
            const isMe = msg.senderId === currentUser.uid;

            const html = `
                <div class="flex items-start gap-3 ${isMe ? 'flex-row-reverse' : ''} animate-fade-in mb-4">
                    <!-- الصورة + الإطار -->
                    <div class="avatar-container w-10 h-10 flex-shrink-0 cursor-pointer" onclick="openProfile('${msg.senderId}')">
                        <img src="${userData.photoURL}" class="user-avatar w-full h-full">
                        ${frameUrl ? `<img src="${frameUrl}" class="frame-overlay">` : ''}
                    </div>

                    <div class="flex flex-col max-w-[80%] ${isMe ? 'items-end' : 'items-start'}">
                        <!-- الاسم + المستويات + الشارات -->
                        <div class="flex items-center gap-2 mb-1 flex-wrap ${isMe ? 'flex-row-reverse' : ''}">
                            <span class="text-gray-300 text-xs font-bold">${userData.displayName}</span>
                            
                            <!-- ليفل الثروة -->
                            ${wealthIcon ? `
                                <div class="level-badge bg-amber-500/20 text-amber-500 border border-amber-500/30">
                                    <img src="${wealthIcon}" class="badge-icon"> ${userData.wealthLevel || 0}
                                </div>
                            ` : ''}
                            
                            <!-- ليفل السحر -->
                            ${magicIcon ? `
                                <div class="level-badge bg-purple-500/20 text-purple-400 border border-purple-500/30">
                                    <img src="${magicIcon}" class="badge-icon"> ${userData.magicLevel || 0}
                                </div>
                            ` : ''}

                            <!-- الشارات -->
                            <div class="flex gap-1">${badgesHtml}</div>
                        </div>

                        <!-- نص الرسالة -->
                        <div class="chat-bubble px-4 py-2 rounded-2xl ${isMe ? 'rounded-tr-sm bg-indigo-600/50 border-indigo-500/30' : 'rounded-tl-sm'}">
                            <p class="text-sm text-white leading-relaxed">${msg.text}</p>
                        </div>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', html);
            container.scrollTop = container.scrollHeight;
        }

        // --- 6. البروفايل (النافذة المنبثقة) ---
        window.openProfile = async (uid) => {
            const docSnap = await getDoc(doc(db, "users", uid));
            if (!docSnap.exists()) return;
            
            const data = docSnap.data();
            activeProfileUser = { uid: uid, ...data };

            document.getElementById('p-name').innerText = data.displayName;
            document.getElementById('p-id').innerText = "ID: " + data.uid;
            document.getElementById('p-avatar').src = data.photoURL;

            // الإطار في البروفايل
            const frameEl = document.getElementById('p-frame');
            if (data.activeFrame && appData.storeItems[data.activeFrame]) {
                frameEl.src = appData.storeItems[data.activeFrame].image;
                frameEl.classList.remove('hidden');
            } else {
                frameEl.classList.add('hidden');
            }

            // المستويات
            document.getElementById('p-wealth-val').innerText = data.wealthLevel || 0;
            if(appData.wealthLevels[data.wealthLevel]) {
                document.getElementById('p-wealth-icon').src = appData.wealthLevels[data.wealthLevel].image;
            }

            document.getElementById('p-magic-val').innerText = data.magicLevel || 0;
            if(appData.magicLevels[data.magicLevel]) {
                document.getElementById('p-magic-icon').src = appData.magicLevels[data.magicLevel].image;
            }

            // الشارات
            const badgesContainer = document.getElementById('p-badges');
            badgesContainer.innerHTML = '';
            if (data.badges) {
                data.badges.forEach(bid => {
                    if (appData.badges[bid]) {
                        badgesContainer.innerHTML += `
                            <div class="bg-white/10 px-2 py-1 rounded flex items-center gap-1 border border-white/5">
                                <img src="${appData.badges[bid].image}" class="w-4 h-4">
                                <span class="text-[10px]">${appData.badges[bid].name}</span>
                            </div>
                        `;
                    }
                });
            }

            document.getElementById('profileOverlay').classList.add('active');
            document.getElementById('profileSheet').classList.add('active');
        };

        // --- دوال مساعدة ---
        window.sendMessage = async () => {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if (!txt) return;

            const chatRef = ref(rtdb, `roomChats/${currentRoomId}/messages`);
            await push(chatRef, {
                senderId: currentUser.uid,
                senderName: currentUser.displayName,
                text: txt,
                timestamp: rtdbTimestamp()
            });
            input.value = '';
        };

        // إظهار زر الإرسال عند الكتابة
        document.getElementById('msgInput').addEventListener('input', (e) => {
            const btn = document.getElementById('sendBtn');
            if(e.target.value.trim().length > 0) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        });

        // إضافة مستخدم للشريط العلوي
        function addHeaderUser(user) {
            const list = document.getElementById('topUsersList');
            // تجنب التكرار
            if (document.getElementById(`u-head-${user.uid}`)) return;

            const div = document.createElement('div');
            div.id = `u-head-${user.uid}`;
            div.className = 'flex flex-col items-center min-w-[45px] cursor-pointer animate-fade-in';
            div.onclick = () => openProfile(user.uid);

            const userFrame = usersCache[user.uid]?.activeFrame || null; // محاولة جلب الإطار
            // ملاحظة: للشريط العلوي ليكون سريعاً قد لا نحمل الإطارات فوراً، أو نعتمد على أن البيانات مخزنة في usersCache

            div.innerHTML = `
                <div class="avatar-container w-9 h-9 mb-1">
                    <img src="${user.photo || 'default.png'}" class="user-avatar w-full h-full border border-white/30">
                </div>
            `;
            list.prepend(div);
        }

        async function loadRoomInfo() {
            // تحميل معلومات مالك الغرفة للهيدر
            const ownerSnap = await getDoc(doc(db, "users", currentRoomId));
            if(ownerSnap.exists()){
                const d = ownerSnap.data();
                document.getElementById('roomName').innerText = d.displayName;
                document.getElementById('roomID').innerText = "ID: " + d.uid;
                document.getElementById('roomOwnerImg').src = d.photoURL;
                
                // إطار المالك
                if(d.activeFrame && appData.storeItems[d.activeFrame]) {
                    const f = document.getElementById('roomOwnerFrame');
                    f.src = appData.storeItems[d.activeFrame].image;
                    f.classList.remove('hidden');
                }
            }
        }

        window.closeSheets = () => {
            document.querySelectorAll('.sheet-overlay, .bottom-sheet').forEach(el => el.classList.remove('active'));
        };

        window.exitRoom = () => {
             // تنظيف الحضور
            const userStatusRef = ref(rtdb, `roomUsers/${currentRoomId}/${currentUser.uid}`);
            set(userStatusRef, null).then(() => window.history.back());
        };

        // تصدير الدوال للـ HTML
        window.openProfile = window.openProfile;
        window.closeSheets = window.closeSheets;
        window.sendMessage = window.sendMessage;
        window.exitRoom = window.exitRoom;

    </script>
</body>
</html>
