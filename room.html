<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الغرفة</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/advanced-effects.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Noto Sans Arabic', sans-serif; touch-action: manipulation; user-select: none; }
        
        body { 
            background: radial-gradient(circle at 50% 30%, #2d4f38 0%, #102918 60%, #05140a 100%);
            color: #fff; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease;
        }

        .glass { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(20, 30, 25, 0.95); backdrop-filter: blur(20px); border-radius: 20px 20px 0 0; border-top: 1px solid rgba(255,255,255,0.1); }

        header { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 10px 15px; z-index: 100;
            display: flex; justify-content: space-between; align-items: flex-start; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); 
            pointer-events: none;
        }
        header > * { pointer-events: auto; }

        .chat-container {
            flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;
            padding-top: 70px; padding-bottom: 90px;
        }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 10px 15px; scrollbar-width: none;
        }
        .chat-messages::-webkit-scrollbar { display: none; }
        
        .msg-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; animation: fadeIn 0.3s ease; }
        
        /* توحيد تنسيق الإطار مع الصفحة الرئيسية */
        .avatar-wrapper { position: relative; width: 50px; height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: visible; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; z-index: 1; }
        .svga-avatar-frame { position: absolute; pointer-events: none; z-index: 2; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: frameFloat 3s ease-in-out infinite; overflow: visible; width: calc(100% + 12px); height: calc(100% + 12px); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .svga-avatar-frame canvas { border-radius: 50%; object-fit: contain; width: 100%!important; height: 100%!important; position: absolute!important; top: 50%!important; left: 50%!important; transform: translate(-50%, -50%)!important; z-index: 2; }
        .perfect-frame { position: absolute; pointer-events: none; z-index: 2; object-fit: contain; border-radius: 50%; animation: frameFloat 3s ease-in-out infinite; width: calc(100% + 12px); height: calc(100% + 12px); top: 50%; left: 50%; transform: translate(-50%, -50%); }
        @keyframes frameFloat { 0%, 100% { transform: translate(-50%, -50%) scale(1) } 50% { transform: translate(-50%, -50%) scale(1.05) } }

        .msg-body { max-width: 80%; }
        .msg-info { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; flex-wrap: wrap; }
        .msg-name { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .level-badge { font-size: 8px; padding: 1px 4px; border-radius: 4px; font-weight: bold; color: white; }
        .magic-level { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .wealth-level { background: linear-gradient(135deg, #f59e0b, #d97706); }

        .msg-content { 
            background: rgba(0,0,0,0.5); 
            padding: 6px 12px; 
            border-radius: 12px; 
            border-top-right-radius: 2px; 
            font-size: 13px; 
            color: #fff; 
            word-break: break-word; 
            line-height: 1.5; 
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .msg-content:hover {
            background: rgba(0,0,0,0.7);
            border-color: rgba(255,255,255,0.1);
        }
        
        .footer-dock {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 50;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, transparent);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .footer-dock.hidden-dock { transform: translateY(150%); }

        .dock-group { display: flex; align-items: center; gap: 15px; }
        .dock-icon { 
            width: 45px; height: 45px; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transform-style: preserve-3d;
        }
        .dock-icon:hover { 
            transform: scale(1.1) translateY(-5px);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
        }

        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 2000;
            display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            background: rgba(20, 30, 25, 0.95); backdrop-filter: blur(40px); width: 100%;
            border-radius: 30px 30px 0 0; border-top: 1px solid rgba(255,255,255,0.15);
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 25px; max-height: 80vh; overflow-y: auto;
        }
        .sheet-overlay.show .bottom-sheet { transform: translateY(0); }

        .tool-btn {
            width: 45px; height: 45px; border-radius: 15px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15); color: #fff; display: flex;
            align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; cursor: pointer;
        }
        .tool-btn:active { transform: scale(0.9); }
        .tool-btn.gift { color: #f59e0b; }
        .tool-btn.admin { color: #fbbf24; }
        .tool-btn.ban { color: #ef4444; }

        .gifts-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            max-height: 250px; overflow-y: auto; padding: 10px 0;
        }
        .gift-card {
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 5px;
            display: flex; flex-direction: column; align-items: center; border: 1px solid transparent;
            cursor: pointer; transition: 0.2s;
        }
        .gift-card.selected { background: rgba(245, 158, 11, 0.15); border-color: #f59e0b; }
        .gift-icon { font-size: 25px; margin-bottom: 5px; }
        .gift-price { font-size: 10px; color: #f59e0b; }

        .user-option {
            display: flex; flex-direction: column; align-items: center; opacity: 0.4;
            min-width: 55px; cursor: pointer;
        }
        .user-option.active { opacity: 1; font-weight: bold; color: #f59e0b; }

        .list-section { margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px; }
        .list-section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .list-item {
            display: flex; align-items: center; gap: 10px; padding: 10px;
            background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 8px;
        }
        .list-item img { width: 40px; height: 40px; border-radius: 50%; }
        .list-item-info { flex: 1; }
        .list-item-name { font-size: 13px; font-weight: bold; }
        .list-item-action {
            background: rgba(239, 68, 68, 0.2); border: none; color: #ef4444;
            padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer;
        }

        .notification {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 12px 24px;
            border-radius: 25px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
            z-index: 3000; animation: slideUp 0.3s ease; display: flex; align-items: center;
            gap: 10px; max-width: 90%;
        }
        @keyframes slideUp { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }

        .input-box {
            flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px; height: 46px; padding: 0 15px; display: flex; align-items: center;
        }
        .main-input {
            background: transparent; border: none; color: #fff; width: 100%;
            font-size: 14px; font-family: 'Noto Sans Arabic', sans-serif;
        }
        .main-input::placeholder { color: rgba(255,255,255,0.4); }

        .btn-action {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: white; transition: 0.2s; font-size: 18px;
        }
        .btn-action:active { transform: scale(0.9); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="glass px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="relative w-10 h-10 cursor-pointer" onclick="openRoomOwnerProfile()">
                <img id="roomOwnerImg" src="" class="w-9 h-9 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[1] object-cover">
                <img id="roomOwnerFrame" src="" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[46px] h-[46px] z-[2] hidden">
            </div>
            <div>
                <span id="roomOwnerId" class="text-[10px] text-amber-400">ID: ---</span>
                <div id="roomName" class="text-sm font-bold">جاري التحميل...</div>
            </div>
        </div>
        <div class="flex gap-2">
            <button class="w-9 h-9 rounded-full glass flex items-center justify-center" onclick="toggleSheet('activeUsersSheet', true)"><i data-lucide="users" class="w-4 h-4"></i></button>
            <button id="roomSettingsBtn" class="w-9 h-9 rounded-full glass flex items-center justify-center hidden" onclick="toggleSheet('roomSettingsSheet', true)"><i data-lucide="settings" class="w-4 h-4 text-amber-400"></i></button>
            <button class="w-9 h-9 rounded-full glass flex items-center justify-center" onclick="leaveRoom()"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
    </header>

    <div class="chat-container">
        <div id="chatMessages" class="chat-messages"></div>
    </div>

    <!-- Footer with input -->
    <footer class="glass px-4 py-3 flex items-center gap-3">
        <div class="input-box">
            <input id="chatInput" type="text" class="main-input" placeholder="اكتب رسالة...">
        </div>
        <button id="giftBtn" class="btn-action" onclick="toggleSheet('giftSheet', true)">🎁</button>
        <button id="sendBtn" class="btn-action hidden" onclick="sendMsg()">➤</button>
    </footer>

    <!-- Gift Sheet -->
    <div id="giftSheet" class="sheet-overlay">
        <div class="bottom-sheet">
            <h3 class="text-lg font-bold mb-4">إرسال هدية</h3>
            <div class="mb-4">
                <p class="text-sm mb-2">اختر المستقبل:</p>
                <div id="giftUserSelector" class="flex gap-2 overflow-x-auto pb-2"></div>
            </div>
            <div class="mb-4">
                <p class="text-sm mb-2">اختر الهدية:</p>
                <div id="giftsGrid" class="gifts-grid"></div>
            </div>
            <div class="mb-4">
                <p class="text-sm mb-2">الكمية:</p>
                <input type="number" id="giftQty" class="w-full bg-white/10 border border-white/15 rounded-lg px-3 py-2 text-white" value="1" min="1">
            </div>
            <div class="text-sm mb-4">رصيدك: <span id="giftBalance">0</span> 🪙</div>
            <button class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2 rounded-lg" onclick="executeGift()">إرسال الهدية</button>
        </div>
    </div>

    <!-- Room Settings Sheet -->
    <div id="roomSettingsSheet" class="sheet-overlay">
        <div class="bottom-sheet">
            <h3 class="text-lg font-bold mb-4">إعدادات الغرفة</h3>
            
            <div class="mb-4">
                <label class="text-sm mb-2 block">اسم الغرفة</label>
                <input type="text" id="roomSettingsName" class="w-full bg-white/10 border border-white/15 rounded-lg px-3 py-2 text-white" placeholder="اسم الغرفة">
            </div>

            <div class="mb-4">
                <label class="text-sm mb-2 block">صورة الغرفة</label>
                <input type="text" id="roomSettingsImage" class="w-full bg-white/10 border border-white/15 rounded-lg px-3 py-2 text-white" placeholder="رابط الصورة">
            </div>

            <div class="list-section">
                <div class="list-section-title">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                    <span>المشرفون (<span id="adminsCount">0</span>)</span>
                </div>
                <div id="adminsList"></div>
                <div class="mt-3">
                    <input type="text" id="newAdminId" class="w-full bg-white/10 border border-white/15 rounded-lg px-3 py-2 text-white mb-2" placeholder="أدخل ID المستخدم">
                    <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 rounded-lg text-sm" onclick="addAdmin()">إضافة مشرف</button>
                </div>
            </div>

            <div class="list-section">
                <div class="list-section-title">
                    <i data-lucide="ban" class="w-4 h-4 text-red-500"></i>
                    <span>المحظورون (<span id="bannedCount">0</span>)</span>
                </div>
                <div id="bannedList"></div>
            </div>

            <button class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 rounded-lg mt-4" onclick="saveRoomSettings()">حفظ الإعدادات</button>
        </div>
    </div>

    <!-- Active Users Sheet -->
    <div id="activeUsersSheet" class="sheet-overlay">
        <div class="bottom-sheet">
            <h3 class="text-lg font-bold mb-4">المستخدمون النشطون</h3>
            <div id="activeUsersList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        // متغيرات عامة
        let currentUser = null;
        let currentUserData = {};
        let roomId = null;
        let roomType = 'public';
        let roomData = {};
        let roomAdmins = [];
        let bannedUsers = [];
        let isRoomOwner = false;
        let activeUsers = {};
        let selectedGift = null;
        let selectedRecipient = null;
        let messagesUnsub = null;
        let activeUsersUnsub = null;

        // بيانات المتجر
        const storeData = {
            gifts: [
                { id: 'rose', name: 'وردة', icon: '🌹', price: 100, type: 'gift', reward: 50 },
                { id: 'heart', name: 'قلب', icon: '❤️', price: 150, type: 'gift', reward: 75 },
                { id: 'diamond', name: 'ماس', icon: '💎', price: 500, type: 'gift', reward: 250 },
                { id: 'crown', name: 'تاج', icon: '👑', price: 1000, type: 'gift', reward: 500 }
            ],
            itemsById: {}
        };

        // تهيئة البيانات
        storeData.gifts.forEach(g => storeData.itemsById[g.id] = g);

        // تحميل الغرفة
        async function loadRoom() {
            const params = new URLSearchParams(window.location.search);
            roomId = params.get('roomId');
            roomType = params.get('type') || 'public';

            if (!roomId) {
                alert('معرف الغرفة غير صحيح');
                window.location.href = 'afnan_ai_white.html';
                return;
            }

            // تحميل بيانات وهمية للاختبار
            roomData = {
                id: roomId,
                name: 'غرفة الدردشة',
                owner: 'owner123',
                image: 'https://via.placeholder.com/50'
            };

            currentUser = { uid: 'user123' };
            currentUserData = {
                displayName: 'المستخدم',
                photoURL: 'https://i.pravatar.cc/100',
                balance: 5000,
                magicLevel: 5,
                wealthLevel: 3
            };

            isRoomOwner = true;
            roomAdmins = [];
            bannedUsers = [];

            document.getElementById('roomName').textContent = roomData.name;
            document.getElementById('roomOwnerId').textContent = 'ID: owner123';
            document.getElementById('roomSettingsBtn').classList.toggle('hidden', !isRoomOwner);

            renderActiveUsers();
            loadMessages();
        }

        // تحميل الرسائل
        function loadMessages() {
            const chatArea = document.getElementById('chatMessages');
            chatArea.innerHTML = `
                <div class="msg-row">
                    <div class="avatar-wrapper">
                        <img class="avatar-img" src="https://i.pravatar.cc/100">
                    </div>
                    <div class="msg-body">
                        <div class="msg-info">
                            <span class="msg-name">المستخدم</span>
                            <span class="level-badge magic-level">سحر: 5</span>
                            <span class="level-badge wealth-level">ثراء: 3</span>
                        </div>
                        <div class="msg-content">مرحباً بك في الغرفة!</div>
                    </div>
                </div>
            `;
        }

        // إرسال رسالة
        window.sendMsg = () => {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const chatArea = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-row';
            msgDiv.innerHTML = `
                <div class="avatar-wrapper">
                    <img class="avatar-img" src="${currentUserData.photoURL}">
                </div>
                <div class="msg-body">
                    <div class="msg-info">
                        <span class="msg-name">${currentUserData.displayName}</span>
                        <span class="level-badge magic-level">سحر: ${currentUserData.magicLevel}</span>
                        <span class="level-badge wealth-level">ثراء: ${currentUserData.wealthLevel}</span>
                    </div>
                    <div class="msg-content">${msg}</div>
                </div>
            `;
            chatArea.appendChild(msgDiv);
            input.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;
        };

        // عرض المستخدمين النشطين
        function renderActiveUsers() {
            const container = document.getElementById('activeUsersList');
            container.innerHTML = `
                <div class="flex items-center gap-3 p-3 bg-white/5 rounded-lg">
                    <img src="https://i.pravatar.cc/100" class="w-10 h-10 rounded-full">
                    <div class="flex-1">
                        <div class="font-bold text-sm">المستخدم</div>
                        <div class="text-xs text-gray-400">نشط الآن</div>
                    </div>
                </div>
            `;
        }

        // إرسال الهدية
        window.executeGift = () => {
            if (!selectedGift || !selectedRecipient) {
                showNotification('اختر هدية ومستقبلاً');
                return;
            }
            const qty = parseInt(document.getElementById('giftQty').value) || 1;
            const cost = selectedGift.price * qty;
            if ((currentUserData.balance || 0) < cost) {
                showNotification('رصيدك غير كافٍ');
                return;
            }
            currentUserData.balance -= cost;
            toggleSheet('giftSheet', false);
            showNotification(`تم إرسال ${selectedGift.name} إلى المستقبل`);
        };

        // اختيار الهدية
        window.selectGift = (id) => {
            selectedGift = storeData.gifts.find(g => g.id === id);
            renderGifts();
        };

        // عرض الهدايا
        window.renderGifts = () => {
            document.getElementById('giftsGrid').innerHTML = storeData.gifts.map(g => `
                <div class="gift-card ${selectedGift?.id === g.id ? 'selected' : ''}" onclick="selectGift('${g.id}')">
                    <div class="gift-icon">${g.icon}</div>
                    <span class="text-[10px] text-center">${g.name}</span>
                    <span class="gift-price">${g.price} 🪙</span>
                </div>
            `).join('');
            document.getElementById('giftBalance').textContent = currentUserData.balance || 0;
        };

        // إضافة مشرف
        window.addAdmin = () => {
            const id = document.getElementById('newAdminId').value.trim();
            if (!id) {
                showNotification('أدخل ID المستخدم');
                return;
            }
            roomAdmins.push(id);
            document.getElementById('newAdminId').value = '';
            updateSettingsLists();
            showNotification('تم إضافة المشرف');
        };

        // حذف مشرف
        window.removeAdmin = (id) => {
            roomAdmins = roomAdmins.filter(a => a !== id);
            updateSettingsLists();
            showNotification('تم إلغاء الأدمنية');
        };

        // حظر مستخدم
        window.banUser = (id) => {
            if (!bannedUsers.includes(id)) {
                bannedUsers.push(id);
                updateSettingsLists();
                showNotification('تم حظر المستخدم');
            }
        };

        // إلغاء الحظر
        window.unbanUser = (id) => {
            bannedUsers = bannedUsers.filter(b => b !== id);
            updateSettingsLists();
            showNotification('تم إلغاء الحظر');
        };

        // تحديث قوائم الإعدادات
        async function updateSettingsLists() {
            const adminsList = document.getElementById('adminsList');
            const bannedList = document.getElementById('bannedList');
            
            document.getElementById('adminsCount').textContent = roomAdmins.length;
            document.getElementById('bannedCount').textContent = bannedUsers.length;
            
            adminsList.innerHTML = roomAdmins.map(id => `
                <div class="list-item">
                    <img src="https://i.pravatar.cc/100">
                    <div class="list-item-info">
                        <div class="list-item-name">${id}</div>
                    </div>
                    <button class="list-item-action" onclick="removeAdmin('${id}')">إلغاء</button>
                </div>
            `).join('');

            bannedList.innerHTML = bannedUsers.map(id => `
                <div class="list-item">
                    <img src="https://i.pravatar.cc/100">
                    <div class="list-item-info">
                        <div class="list-item-name">${id}</div>
                    </div>
                    <button class="list-item-action" onclick="unbanUser('${id}')">إلغاء الحظر</button>
                </div>
            `).join('');
        }

        // حفظ إعدادات الغرفة
        window.saveRoomSettings = () => {
            const name = document.getElementById('roomSettingsName').value.trim();
            if (!name) {
                showNotification('أدخل اسم الغرفة');
                return;
            }
            roomData.name = name;
            document.getElementById('roomName').textContent = name;
            showNotification('تم حفظ الإعدادات');
            toggleSheet('roomSettingsSheet', false);
        };

        // تبديل الـ Sheet
        window.toggleSheet = (id, show) => {
            const sheet = document.getElementById(id);
            if (show) {
                sheet.classList.add('show');
                if (id === 'giftSheet') {
                    renderGifts();
                    selectedGift = storeData.gifts[0];
                }
                if (id === 'roomSettingsSheet' && isRoomOwner) {
                    document.getElementById('roomSettingsName').value = roomData.name || '';
                    updateSettingsLists();
                }
            } else {
                sheet.classList.remove('show');
            }
        };

        // مغادرة الغرفة
        window.leaveRoom = () => {
            if (confirm('هل تريد مغادرة الغرفة؟')) {
                window.location.href = 'afnan_ai_white.html';
            }
        };

        // فتح ملف المستخدم
        window.openRoomOwnerProfile = () => {
            showNotification('ملف صاحب الغرفة');
        };

        // عرض الإشعار
        function showNotification(msg) {
            const div = document.createElement('div');
            div.className = 'notification';
            div.innerHTML = `<span>${msg.includes('✓') || msg.includes('تم') ? '✓' : '💬'}</span><span>${msg}</span>`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // معالجات الإدخال
        document.getElementById('chatInput').addEventListener('focus', () => {
            document.getElementById('giftBtn').classList.add('hidden');
            document.getElementById('sendBtn').classList.remove('hidden');
        });

        document.getElementById('chatInput').addEventListener('blur', () => {
            setTimeout(() => {
                document.getElementById('giftBtn').classList.remove('hidden');
                document.getElementById('sendBtn').classList.add('hidden');
            }, 200);
        });

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMsg();
        });

        // تهيئة التطبيق
        document.addEventListener('DOMContentLoaded', () => {
            loadRoom();
            lucide.createIcons();
        });
    </script>
</body>
</html>
