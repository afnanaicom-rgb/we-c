<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Room Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <!-- SVGA Player -->
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>

    <style>
        :root {
            --primary: #8b5cf6;
            --accent: #f59e0b;
            --bg-black: #09090b;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans Arabic', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: #fff;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .app-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #000000 70%);
            z-index: -1;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Header --- */
        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 4px 12px 4px 6px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .owner-img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            position: relative;
        }

        .owner-img-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% + 10px);
            height: calc(100% + 10px);
            z-index: 2;
            pointer-events: none;
            animation: frameFloat 3s ease-in-out infinite;
        }

        .owner-img-frame canvas, 
        .owner-img-frame img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        .btn-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* --- Chat Area --- */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            width: 100%;
            margin-bottom: 5px;
        }
        .msg-row.sent { justify-content: flex-start; }
        .msg-row.received { justify-content: flex-end; }

        .msg-bubble {
            background: rgba(30, 30, 40, 0.6);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 18px;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 85%;
            position: relative;
        }

        .msg-row.sent .msg-bubble { 
            border-bottom-left-radius: 2px; 
            flex-direction: row;
            background: rgba(139, 92, 246, 0.15);
        }
        
        .msg-row.received .msg-bubble { 
            border-bottom-right-radius: 2px;
            flex-direction: row-reverse;
        }

        /* Chat Avatar System */
        .msg-avatar-wrapper {
            position: relative;
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .msg-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            z-index: 1;
        }

        .msg-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            z-index: 2;
            pointer-events: none;
            animation: smallFrameFloat 3s ease-in-out infinite;
        }
        .msg-frame canvas, .msg-frame img { 
            width: 100%!important; 
            height: 100%!important; 
            object-fit: contain; 
        }

        .msg-content { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .msg-row.received .msg-content { align-items: flex-end; }
        .msg-user { font-size: 12px; font-weight: 700; color: #a1a1aa; display: flex; align-items: center; gap: 5px; }
        .msg-text { font-size: 13px; color: #fff; line-height: 1.5; }
        
        /* Badges in Chat */
        .badge-container { display: inline-flex; align-items: center; gap: 2px; }
        .chat-badge { width: 16px; height: 16px; object-fit: contain; }

        /* --- Footer --- */
        .footer {
            padding: 10px 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        }

        .input-box {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            height: 44px;
            padding: 0 15px;
            display: flex;
            align-items: center;
        }

        .main-input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            font-size: 14px;
        }

        .btn-action {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* --- Sheets & Modals --- */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            background: #121215;
            border-top: 1px solid var(--glass-border);
            border-radius: 30px 30px 0 0;
            padding: 25px 20px;
            width: 100%;
            transform: translateY(100%);
            transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            max-height: 85vh;
            overflow-y: auto;
        }
        .sheet-overlay.show .bottom-sheet { transform: translateY(0); }

        /* --- PROFILE AVATAR WITH FRAME (WHITE EDITION STYLE) --- */
        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            overflow: visible;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .perfect-frame {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: frameFloat 3s ease-in-out infinite;
            overflow: visible;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .perfect-frame canvas, 
        .perfect-frame img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        @keyframes frameFloat { 
            0%, 100% { transform: translate(-50%, -50%) scale(1); } 
            50% { transform: translate(-50%, -50%) scale(1.05); } 
        }

        @keyframes smallFrameFloat { 
            0%, 100% { transform: translate(-50%, -50%) scale(1); } 
            50% { transform: translate(-50%, -50%) scale(1.03); } 
        }

        /* ---------------------------------------------------- */

        /* Gifts & Users Grid */
        .users-scroll { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            padding-bottom: 10px; 
            scrollbar-width: none; 
        }
        
        .user-card { 
            flex-shrink: 0; 
            width: 60px; 
            text-align: center; 
            cursor: pointer; 
            opacity: 0.6; 
            transition: 0.2s;
            position: relative;
        }
        
        .user-card.selected { 
            opacity: 1; 
            transform: scale(1.05); 
        }
        
        .user-card-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            position: relative;
            margin: 0 auto;
        }
        
        .user-card.selected .user-card-avatar { 
            border-color: var(--accent); 
        }
        
        .user-card-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            z-index: 2;
            pointer-events: none;
            animation: smallFrameFloat 3s ease-in-out infinite;
        }
        
        .user-card-frame canvas,
        .user-card-frame img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
        
        .user-name { 
            font-size: 10px; 
            margin-top: 4px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }

        .gifts-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
        }
        
        .gift-item { 
            background: rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 10px; 
            text-align: center; 
            border: 1px solid transparent; 
            cursor: pointer; 
        }
        
        .gift-item.selected { 
            background: rgba(245, 158, 11, 0.15); 
            border-color: var(--accent); 
        }
        
        .gift-img { 
            width: 40px; 
            height: 40px; 
            object-fit: contain; 
            margin-bottom: 5px; 
        }

        /* Utilities */
        #svga-fullscreen { 
            position: fixed; 
            inset: 0; 
            pointer-events: none; 
            z-index: 3000; 
        }
        
        .hidden { 
            display: none !important; 
        }

        /* Toast */
        #entry-toast {
            position: absolute;
            top: 15%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); 
            padding: 8px 16px; 
            border-radius: 50px;
            display: flex; 
            align-items: center; 
            gap: 10px; 
            z-index: 1000;
            border: 1px solid var(--accent); 
            opacity: 0; 
            transition: 0.3s; 
            pointer-events: none;
        }
        
        #entry-toast.show { 
            opacity: 1; 
            transform: translate(-50%, 0); 
        }
        
        /* Level Badges */
        .level-badge {
            width: 16px;
            height: 16px;
            object-fit: contain;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="app-bg"></div>
<div id="svga-fullscreen"></div>

<!-- Entry Toast -->
<div id="entry-toast">
    <div style="position:relative; width:28px; height:28px;">
        <img id="toast-img" src="" style="width:100%; height:100%; border-radius:50%; object-fit:cover">
        <div id="toast-frame" class="owner-img-frame"></div>
    </div>
    <span id="toast-text" style="font-size:12px; font-weight:bold"></span>
</div>

<div class="app-container">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="room-info" onclick="openProfile(room.owner)">
                <div style="position:relative; width:34px; height:34px;">
                    <img src="" class="owner-img" id="roomOwnerImg">
                    <div id="roomOwnerFrame" class="owner-img-frame"></div>
                </div>
                <div>
                    <div style="font-size:9px; color:var(--accent); font-weight:bold" id="roomOwnerId">ID: --</div>
                    <div style="font-size:11px; font-weight:bold" id="roomName">...</div>
                </div>
            </div>
        </div>
        <div style="display:flex; gap:8px">
            <button class="btn-control" onclick="toggleSheet('onlineSheet', true)"><i class="fa-solid fa-users"></i></button>
            <button class="btn-control" onclick="leaveRoom()"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </header>

    <!-- Chat -->
    <div class="chat-area" id="chatArea"></div>

    <!-- Footer -->
    <footer class="footer">
        <div class="input-box">
            <input type="text" id="chatInput" class="main-input" placeholder="اكتب هنا..." oninput="checkInput()">
        </div>
        <button id="giftBtn" class="btn-action" style="background:var(--primary)" onclick="toggleSheet('giftSheet', true)"><i class="fa-solid fa-gift"></i></button>
        <button id="sendBtn" class="btn-action hidden" style="background:var(--accent)" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </footer>
</div>

<!-- Online Sheet -->
<div id="onlineSheet" class="sheet-overlay" onclick="toggleSheet('onlineSheet', false)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <h3 style="text-align:center; font-weight:bold; margin-bottom:15px">المتواجدون (<span id="onlineCount">0</span>)</h3>
        <div id="onlineList" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:15px"></div>
    </div>
</div>

<!-- Gift Sheet -->
<div id="giftSheet" class="sheet-overlay" onclick="toggleSheet('giftSheet', false)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <h3 style="font-size:13px; font-weight:bold; margin-bottom:10px; color:#aaa">إرسال إلى:</h3>
        <div id="giftTargets" class="users-scroll"></div>
        <div style="height:1px; background:var(--glass-border); margin:15px 0"></div>
        <div id="giftsContainer" class="gifts-grid"></div>
        <button onclick="sendGift()" style="width:100%; margin-top:15px; background:#ef4444; color:#fff; border:none; padding:12px; border-radius:15px; font-weight:bold; font-size:16px">إرسال</button>
    </div>
</div>

<!-- Profile Sheet -->
<div id="profileSheet" class="sheet-overlay" onclick="toggleSheet('profileSheet', false)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        
        <!-- Avatar Wrapper with Frame -->
        <div class="avatar-wrapper">
            <img id="p-img" class="avatar-img" src="">
            <div id="p-frame" class="perfect-frame"></div>
        </div>

        <h2 id="p-name" style="text-align:center; font-size:20px; font-weight:800; margin-bottom:2px">--</h2>
        <p id="p-id" style="text-align:center; font-size:12px; color:#888; margin-bottom:20px">ID: --</p>

        <!-- Stats / Levels -->
        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px">
            <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; text-align:center; min-width:80px">
                <img id="p-magic-img" src="" style="width:40px; height:40px; margin:0 auto">
                <div style="font-size:10px; margin-top:5px; color:#aaa">Magic: <span id="p-magic-lvl" style="color:#fff; font-weight:bold">0</span></div>
            </div>
            <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; text-align:center; min-width:80px">
                <img id="p-wealth-img" src="" style="width:40px; height:40px; margin:0 auto">
                <div style="font-size:10px; margin-top:5px; color:#aaa">Wealth: <span id="p-wealth-lvl" style="color:#fff; font-weight:bold">0</span></div>
            </div>
        </div>

        <!-- Badges -->
        <div id="p-badges" style="display:flex; justify-content:center; flex-wrap:wrap; gap:5px; margin-bottom:25px"></div>

        <!-- Actions -->
        <div style="display:flex; gap:10px">
            <button id="friendBtn" onclick="handleFriend()" style="flex:1; padding:12px; border-radius:12px; border:none; background:var(--glass); color:#fff; font-weight:bold">...</button>
            <button onclick="openGiftForUser()" style="flex:1; padding:12px; border-radius:12px; border:none; background:var(--accent); color:#000; font-weight:bold">إرسال هدية</button>
        </div>
        <button onclick="mentionUser()" style="width:100%; margin-top:10px; padding:10px; background:transparent; border:1px solid var(--glass-border); color:#888; border-radius:12px">@ إشارة</button>

    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    const firebaseConfig = { 
        apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY", 
        authDomain: "rtx3090-28439.firebaseapp.com", 
        projectId: "rtx3090-28439", 
        storageBucket: "rtx3090-28439.firebasestorage.app", 
        messagingSenderId: "178612030690", 
        appId: "1:178612030690:web:883189ced2ed3a78e3e2bb", 
        databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const rtdb = firebase.database();
    const auth = firebase.auth();

    let user, userData, room;
    let storeData = { frames: {}, badges: {}, gifts: {}, magicLevels: {}, wealthLevels: {}, chatBubbles: {} };
    let onlineUsers = {};
    let selectedUserId = null;
    let selectedGiftId = null;
    let joinTime = Date.now();
    
    // Player instances for frame animations
    let framePlayers = {};

    // Helper: Calculate Levels - SAME AS WHITE EDITION
    function getLevelInfo(totalPoints) {
        let level = 1;
        let remaining = totalPoints;
        const getThreshold = (lvl) => {
            if (lvl === 1) return 50000;
            if (lvl === 2) return 100000;
            if (lvl === 3) return 150000;
            if (lvl === 4) return 225000;
            return Math.floor(225000 * Math.pow(1.5, lvl - 4));
        };
        while (level < 100) {
            let threshold = getThreshold(level);
            if (remaining >= threshold) { 
                remaining -= threshold; 
                level++; 
            } else break;
        }
        return { level };
    }

    // Initialize
    auth.onAuthStateChanged(async (u) => {
        if(!u) return window.location.href = "login.html";
        user = u;
        
        db.collection('users').doc(u.uid).onSnapshot(async (s) => {
            userData = s.data();
            if(userData && userData.activeFrame) {
                // Load owner frame for header
                await loadUserFrame(u.uid, 'roomOwnerFrame');
            }
        });
        
        await loadData();
        await loadRoom();
        initPresence();
    });

    async function loadData() {
        // Load all store assets in parallel
        const [sSnap, gSnap, mSnap, wSnap, cSnap] = await Promise.all([
            db.collection('storeItems').get(),
            db.collection('gifts').get(),
            db.collection('magicLevels').get(),
            db.collection('wealthLevels').get(),
            db.collection('chatBubbles').get()
        ]);

        sSnap.forEach(d => {
            const val = d.data();
            if(val.type === 'frame') storeData.frames[d.id] = val;
            if(val.type === 'badge') storeData.badges[d.id] = val;
        });
        gSnap.forEach(d => storeData.gifts[d.id] = { id: d.id, ...d.data() });
        mSnap.forEach(d => storeData.magicLevels[d.id] = d.data().image);
        wSnap.forEach(d => storeData.wealthLevels[d.id] = d.data().image);
        cSnap.forEach(d => storeData.chatBubbles[d.id] = { id: d.id, ...d.data() });
    }

    async function loadRoom() {
        if(!roomId) return;
        const snap = await db.collection('rooms').doc(roomId).get();
        if(!snap.exists) return alert("الغرفة غير موجودة");
        room = snap.data();
        document.getElementById('roomName').textContent = room.name;
        document.getElementById('roomOwnerId').textContent = "ID: " + room.owner;
        const oSnap = await db.collection('users').doc(room.owner).get();
        if(oSnap.exists) {
            const ownerData = oSnap.data();
            document.getElementById('roomOwnerImg').src = ownerData.photoURL;
            await loadUserFrame(room.owner, 'roomOwnerFrame');
        }
    }

    async function loadUserFrame(uid, containerId) {
        try {
            const userDoc = await db.collection('users').doc(uid).get();
            if(!userDoc.exists) return;
            
            const userData = userDoc.data();
            if(userData.activeFrame) {
                const frame = storeData.frames[userData.activeFrame];
                if(frame) {
                    const container = document.getElementById(containerId);
                    if(container) {
                        container.innerHTML = '';
                        if(frame.itemType === 'svga') {
                            playSvga(frame.fileUrl, container);
                        } else {
                            container.innerHTML = `<img src="${frame.image}">`;
                        }
                    }
                }
            }
        } catch(e) {
            console.error("Error loading user frame:", e);
        }
    }

    function initPresence() {
        const ref = rtdb.ref(`rooms/${roomId}/users/${user.uid}`);
        ref.set({ 
            uid: user.uid, 
            name: userData.displayName, 
            photo: userData.photoURL, 
            joinTime: firebase.database.ServerValue.TIMESTAMP 
        });
        ref.onDisconnect().remove();

        // Listen for users
        rtdb.ref(`rooms/${roomId}/users`).on('value', s => {
            onlineUsers = s.val() || {};
            document.getElementById('onlineCount').textContent = Object.keys(onlineUsers).length;
            renderOnlineUsers();
        });

        // Listen for entries (Toast)
        rtdb.ref(`rooms/${roomId}/users`).on('child_added', s => {
            const u = s.val();
            if(u.joinTime > joinTime && u.uid !== user.uid) showEntryToast(u);
        });

        // Chat
        rtdb.ref(`rooms/${roomId}/messages`).orderByChild('time').startAt(joinTime).on('child_added', s => renderMsg(s.val(), s.key));
    }

    async function renderOnlineUsers() {
        const list = document.getElementById('onlineList');
        const targets = document.getElementById('giftTargets');
        list.innerHTML = ''; 
        targets.innerHTML = '';
        
        for (const u of Object.values(onlineUsers)) {
            // Get user frame data
            let userFrame = null;
            try {
                const userDoc = await db.collection('users').doc(u.uid).get();
                if(userDoc.exists) {
                    const userData = userDoc.data();
                    userFrame = userData.activeFrame;
                }
            } catch(e) {}
            
            // Frame HTML
            let frameHtml = '';
            if(userFrame) {
                const frame = storeData.frames[userFrame];
                if(frame) {
                    if(frame.itemType === 'svga') {
                        frameHtml = `<div class="user-card-frame" id="frame_online_${u.uid}"></div>`;
                    } else {
                        frameHtml = `<img src="${frame.image}" class="user-card-frame">`;
                    }
                }
            }
            
            // Main List
            list.innerHTML += `
                <div class="user-card" onclick="openProfile('${u.uid}')" id="user_${u.uid}">
                    <div style="position:relative; width:45px; height:45px; margin:0 auto">
                        <img src="${u.photo}" class="user-card-avatar">
                        ${frameHtml}
                    </div>
                    <div class="user-name">${u.name}</div>
                </div>`;
            
            // Gift Targets
            const sel = selectedUserId === u.uid ? 'selected' : '';
            targets.innerHTML += `
                <div class="user-card ${sel}" onclick="selectUser('${u.uid}')" id="tgt_${u.uid}">
                    <div style="position:relative; width:45px; height:45px; margin:0 auto">
                        <img src="${u.photo}" class="user-card-avatar">
                        ${frameHtml}
                    </div>
                    <div class="user-name">${u.name}</div>
                </div>`;
            
            // Load SVGA frame if needed
            if(userFrame) {
                const frame = storeData.frames[userFrame];
                if(frame && frame.itemType === 'svga') {
                    setTimeout(() => {
                        const container = document.getElementById(`frame_online_${u.uid}`);
                        if(container) playSvga(frame.fileUrl, container);
                    }, 100);
                }
            }
        }
    }

    function selectUser(uid) {
        selectedUserId = uid;
        renderOnlineUsers(); // Refresh selection UI
    }

    async function showEntryToast(u) {
        const toast = document.getElementById('entry-toast');
        
        // Load user frame for toast
        let userFrame = null;
        try {
            const userDoc = await db.collection('users').doc(u.uid).get();
            if(userDoc.exists) {
                const userData = userDoc.data();
                userFrame = userData.activeFrame;
                
                // Load frame in toast
                const toastFrame = document.getElementById('toast-frame');
                toastFrame.innerHTML = '';
                if(userFrame) {
                    const frame = storeData.frames[userFrame];
                    if(frame) {
                        if(frame.itemType === 'svga') {
                            playSvga(frame.fileUrl, toastFrame);
                        } else {
                            toastFrame.innerHTML = `<img src="${frame.image}">`;
                        }
                    }
                }
            }
        } catch(e) {}
        
        document.getElementById('toast-img').src = u.photo;
        document.getElementById('toast-text').textContent = u.name + " انضم";
        toast.classList.add('show');

        // Check for entry effect
        try {
            const snap = await db.collection('users').doc(u.uid).get();
            if(snap.exists && snap.data().activeSvga) {
                const item = await db.collection('storeItems').doc(snap.data().activeSvga).get();
                if(item.exists) playSvgaFull(item.data().fileUrl);
            }
        } catch(e){}
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // --- Chat System ---
    async function renderMsg(msg, key) {
        const area = document.getElementById('chatArea');
        const isMe = msg.senderId === user.uid;
        const row = document.createElement('div');
        row.className = `msg-row ${isMe ? 'sent' : 'received'}`;
        
        let sData = isMe ? userData : null;
        if(!sData) {
            const snap = await db.collection('users').doc(msg.senderId).get();
            sData = snap.data();
        }

        // Bubbles
        let bubbleCss = "";
        let txtCol = "#fff";
        if(sData?.activeChatBubble) {
            const cb = storeData.chatBubbles[sData.activeChatBubble];
            if(cb) {
                bubbleCss = `background-image:url('${cb.image}'); background-size:100% 100%; border:none; padding:12px 16px;`;
                if(cb.textColor) txtCol = cb.textColor;
            }
        }

        // Frame for this user
        let frameHtml = '';
        if(sData?.activeFrame) {
            const frame = storeData.frames[sData.activeFrame];
            if(frame) {
                if(frame.itemType === 'svga') {
                    frameHtml = `<div class="msg-frame" id="msg_frame_${key}"></div>`;
                } else {
                    frameHtml = `<img src="${frame.image}" class="msg-frame">`;
                }
            }
        }

        // Avatar Construction
        const avatarHtml = `
            <div class="msg-avatar-wrapper" onclick="openProfile('${msg.senderId}')">
                <img src="${msg.photo}" class="msg-avatar">
                ${frameHtml}
            </div>
        `;

        row.innerHTML = `
            <div class="msg-bubble" style="${bubbleCss}">
                ${!isMe ? avatarHtml : ''}
                <div class="msg-content">
                    <div class="msg-user">
                        ${msg.senderName}
                        <div class="badge-container" id="badges_${key}"></div>
                    </div>
                    <div class="msg-text" style="color:${txtCol}">${msg.text}</div>
                </div>
                ${isMe ? avatarHtml : ''}
            </div>
        `;

        area.appendChild(row);
        area.scrollTop = area.scrollHeight;

        // Async Load Assets
        if(sData) {
            // Frame
            if(sData.activeFrame) {
                const f = storeData.frames[sData.activeFrame];
                if(f && f.itemType === 'svga') {
                    const fc = document.getElementById(`msg_frame_${key}`);
                    if(fc) playSvga(f.fileUrl, fc);
                }
            }
            
            // Badges (SAME AS WHITE EDITION)
            const bc = document.getElementById(`badges_${key}`);
            if(bc) {
                const m = getLevelInfo(sData.magicPoints||0).level;
                const w = getLevelInfo(sData.wealthPoints||0).level;
                if(storeData.magicLevels[m]) bc.innerHTML += `<img src="${storeData.magicLevels[m]}" class="level-badge">`;
                if(storeData.wealthLevels[w]) bc.innerHTML += `<img src="${storeData.wealthLevels[w]}" class="level-badge">`;
                if(sData.activeBadges) {
                    sData.activeBadges.forEach(b => {
                        if(storeData.badges[b]) bc.innerHTML += `<img src="${storeData.badges[b].image}" class="chat-badge">`;
                    });
                }
            }
        }
        
        if(msg.type === 'gift' && msg.svga) playSvgaFull(msg.svga);
    }

    // --- Profile & Friend System ---
    async function openProfile(uid) {
        selectedUserId = uid;
        const snap = await db.collection('users').doc(uid).get();
        if(!snap.exists) return;
        const p = snap.data();

        document.getElementById('p-name').textContent = p.displayName;
        document.getElementById('p-id').textContent = "ID: " + uid;
        document.getElementById('p-img').src = p.photoURL;

        // Frame Logic (White Edition Style)
        const frameCont = document.getElementById('p-frame');
        frameCont.innerHTML = '';
        if(p.activeFrame) {
            const f = storeData.frames[p.activeFrame];
            if(f) {
                if(f.itemType === 'svga') {
                    playSvga(f.fileUrl, frameCont);
                } else {
                    frameCont.innerHTML = `<img src="${f.image}">`;
                }
            }
        }

        // Levels (SAME AS WHITE EDITION)
        const m = getLevelInfo(p.magicPoints||0).level;
        const w = getLevelInfo(p.wealthPoints||0).level;
        document.getElementById('p-magic-lvl').textContent = m;
        document.getElementById('p-wealth-lvl').textContent = w;
        document.getElementById('p-magic-img').src = storeData.magicLevels[m] || '';
        document.getElementById('p-wealth-img').src = storeData.wealthLevels[w] || '';

        // Badges
        const bgDiv = document.getElementById('p-badges');
        bgDiv.innerHTML = '';
        if(p.activeBadges) {
            p.activeBadges.forEach(b => {
                if(storeData.badges[b]) bgDiv.innerHTML += `<img src="${storeData.badges[b].image}" style="width:30px;height:30px">`;
            });
        }

        // Friend Button
        const btn = document.getElementById('friendBtn');
        if(uid === user.uid) {
            btn.style.display = 'none';
        } else {
            btn.style.display = 'block';
            btn.innerText = '...';
            btn.onclick = () => handleFriend(uid);
            // Check friendship status
            try {
                const f = await db.collection('users').doc(user.uid).collection('friends').doc(uid).get();
                if(f.exists) {
                    btn.innerText = '💬 رسالة';
                    btn.onclick = () => alert('قريبا');
                } else {
                    btn.innerText = '➕ صداقة';
                    btn.onclick = async () => { 
                        await db.collection('users').doc(user.uid).collection('friends').doc(uid).set({});
                        btn.innerText = 'تم الارسال'; 
                    };
                }
            } catch(e) { 
                btn.innerText = 'خطأ'; 
            }
        }

        toggleSheet('profileSheet', true);
    }

    function openGiftForUser() {
        toggleSheet('profileSheet', false);
        toggleSheet('giftSheet', true);
        selectUser(selectedUserId);
    }

    function mentionUser() {
        const n = document.getElementById('p-name').textContent;
        document.getElementById('chatInput').value = `@${n} `;
        toggleSheet('profileSheet', false);
    }

    function handleFriend(uid) {
        // Implementation of friend request logic
        alert('طلب صداقة تم إرساله');
    }

    // --- Gifting ---
    function toggleSheet(id, show) {
        document.getElementById(id).classList.toggle('show', show);
        if(id === 'giftSheet' && show && document.getElementById('giftsContainer').innerHTML === '') {
            const c = document.getElementById('giftsContainer');
            Object.values(storeData.gifts).forEach(g => {
                c.innerHTML += `
                    <div class="gift-item" onclick="pickGift('${g.id}', this)">
                        <img src="${g.image}" class="gift-img">
                        <div style="font-size:10px">${g.name}</div>
                        <div style="font-size:9px;color:var(--accent)">${g.price}</div>
                    </div>`;
            });
        }
    }

    function pickGift(gid, el) {
        selectedGiftId = gid;
        document.querySelectorAll('.gift-item').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
    }

    async function sendGift() {
        if(!selectedGiftId || !selectedUserId) return alert("اختر هدية ومستخدم");
        const g = storeData.gifts[selectedGiftId];
        if(userData.balance < g.price) return alert("الرصيد لا يكفي");

        toggleSheet('giftSheet', false);
        
        // Update DB
        const b = db.batch();
        b.update(db.collection('users').doc(user.uid), { 
            balance: firebase.firestore.FieldValue.increment(-g.price),
            wealthPoints: firebase.firestore.FieldValue.increment(g.price)
        });
        b.update(db.collection('users').doc(selectedUserId), { 
            magicPoints: firebase.firestore.FieldValue.increment(g.price) 
        });
        await b.commit();

        const tUser = onlineUsers[selectedUserId];
        rtdb.ref(`rooms/${roomId}/messages`).push({
            type: 'gift', 
            svga: g.svgaUrl || null,
            senderId: user.uid, 
            senderName: userData.displayName, 
            photo: userData.photoURL,
            text: `أرسل ${g.name} إلى ${tUser ? tUser.name : 'مستخدم'}`,
            time: firebase.database.ServerValue.TIMESTAMP
        });
    }

    // --- Utils ---
    function sendMsg() {
        const inp = document.getElementById('chatInput');
        if(!inp.value.trim()) return;
        rtdb.ref(`rooms/${roomId}/messages`).push({
            senderId: user.uid, 
            senderName: userData.displayName, 
            photo: userData.photoURL,
            text: inp.value, 
            time: firebase.database.ServerValue.TIMESTAMP
        });
        inp.value = ''; 
        checkInput();
    }
    
    function checkInput() {
        const v = document.getElementById('chatInput').value.trim();
        document.getElementById('sendBtn').classList.toggle('hidden', !v);
        document.getElementById('giftBtn').classList.toggle('hidden', !!v);
    }
    
    function leaveRoom() {
        rtdb.ref(`rooms/${roomId}/users/${user.uid}`).remove();
        window.history.back();
    }

    // --- SVGA Player Functions ---
    function playSvga(url, el) {
        if(!el) return;
        el.innerHTML = '';
        const p = new SVGA.Player(el);
        const parser = new SVGA.Parser();
        parser.load(url, (v) => { 
            p.setVideoItem(v); 
            p.loops = 0; // Infinite loop for frames
            p.startAnimation(); 
        });
    }
    
    function playSvgaFull(url) {
        const el = document.getElementById('svga-fullscreen');
        el.innerHTML = '';
        const p = new SVGA.Player(el);
        const parser = new SVGA.Parser();
        p.loops = 1; 
        p.clearsAfterStop = true;
        parser.load(url, (v) => { 
            p.setVideoItem(v); 
            p.startAnimation(); 
        });
    }
</script>
