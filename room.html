<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Premium Live Room - Afnan AI</title>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --accent: #f59e0b; /* ذهبي */
            --bg-black: #050505;
            --glass: rgba(30, 30, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --wealth: #fbbf24;
            --magic: #d946ef;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-black);
            color: #fff; 
            height: 100vh; 
            overflow: hidden;
            display: flex; 
            justify-content: center;
        }

        /* خلفية التطبيق */
        .app-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #000000 70%);
            z-index: -1;
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            background: rgba(0,0,0,0.2);
        }

        /* --- الهيدر --- */
        .header { 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 100;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        .room-info {
            display: flex; align-items: center; gap: 10px; 
            background: rgba(255,255,255,0.1);
            padding: 5px 12px 5px 5px; 
            border-radius: 30px; 
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            max-width: 50%;
        }
        
        .owner-img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        
        .header-controls { display: flex; gap: 8px; }
        
        .btn-control {
            width: 38px; height: 38px; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .btn-control:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .btn-control.exit { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

        /* --- شريط المستخدمين العلوي (بديل الميكات) --- */
        .users-bar {
            padding: 10px 15px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            min-height: 85px;
        }
        .users-bar::-webkit-scrollbar { display: none; }

        .user-head {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            min-width: 55px; cursor: pointer;
        }
        .user-head-img-wrapper {
            position: relative;
            width: 50px; height: 50px;
        }
        .user-head img {
            width: 100%; height: 100%; 
            border-radius: 50%; 
            object-fit: cover;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .user-head.online img { border-color: #10b981; }
        .user-head span {
            font-size: 10px; color: #ccc;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 55px; text-align: center;
        }

        /* --- منطقة الشات --- */
        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            /* Scrollbar styling */
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        .msg-bubble {
            background: rgba(40, 40, 45, 0.6); 
            border: 1px solid var(--glass-border);
            padding: 10px; 
            border-radius: 18px; 
            border-bottom-right-radius: 2px;
            backdrop-filter: blur(5px); 
            display: flex; align-items: flex-start; gap: 10px;
            max-width: 85%; 
            animation: slideIn 0.3s ease;
            align-self: flex-start;
        }
        
        .msg-bubble.me {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.1));
            border-color: rgba(139, 92, 246, 0.3);
            border-radius: 18px; 
            border-bottom-left-radius: 2px;
            flex-direction: row-reverse;
            align-self: flex-end;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; object-fit: cover; }
        
        .msg-content { display: flex; flex-direction: column; gap: 2px; }
        .msg-bubble.me .msg-content { align-items: flex-end; }
        
        .msg-user { font-size: 11px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 5px; }
        .msg-bubble.me .msg-user { flex-direction: row-reverse; }

        .msg-text { font-size: 13px; line-height: 1.4; color: #f3f4f6; }
        
        .badge { font-size: 8px; padding: 2px 6px; border-radius: 8px; font-weight: bold; display: inline-flex; align-items: center; gap: 2px; }
        .b-wealth { background: linear-gradient(45deg, #f59e0b, #d97706); color: #fff; }
        .b-magic { background: linear-gradient(45deg, #d946ef, #a21caf); color: #fff; }
        .b-owner { background: linear-gradient(45deg, #6366f1, #4338ca); color: #fff; }

        /* --- الفوتر --- */
        .footer { 
            padding: 10px 15px 20px; 
            display: flex; align-items: center; gap: 10px; 
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 500; 
        }
        
        .input-box {
            flex: 1; 
            background: rgba(255,255,255,0.08); 
            border: 1px solid var(--glass-border);
            border-radius: 25px; 
            height: 46px; 
            padding: 0 15px; 
            display: flex; align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .main-input { 
            background: transparent; border: none; color: #fff; width: 100%; font-size: 14px; 
            font-family: 'Cairo', sans-serif;
        }
        .main-input::placeholder { color: rgba(255,255,255,0.4); }

        .btn-action {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.9); }
        .btn-gift { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-send { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }

        /* --- النوافذ المنبثقة (Sheets) --- */
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            background: #141418;
            width: 100%; border-radius: 30px 30px 0 0; 
            border-top: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 25px; position: relative;
            max-height: 80vh; overflow-y: auto;
        }
        .sheet-overlay.show .bottom-sheet { transform: translateY(0); }

        /* --- تصميم البروفايل --- */
        .profile-header { text-align: center; margin-bottom: 20px; }
        .profile-img-lg { 
            width: 100px; height: 100px; border-radius: 50%; 
            border: 3px solid var(--accent); 
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
            margin-bottom: 10px;
            object-fit: cover;
        }
        .profile-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .profile-id { color: #888; font-size: 12px; font-family: monospace; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 6px; }

        .stats-row { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .stat-box { 
            background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; min-width: 80px;
        }
        .stat-val { font-weight: bold; font-size: 16px; }
        .stat-label { font-size: 10px; color: #aaa; margin-top: 2px; }
        .stat-box.wealth .stat-val { color: var(--wealth); }
        .stat-box.magic .stat-val { color: var(--magic); }

        .profile-tools { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .tool-btn {
            width: 50px; height: 50px; border-radius: 18px; 
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--glass-border); color: #fff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; transition: 0.2s;
        }
        .tool-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
        .tool-btn.gift { color: var(--accent); border-color: rgba(245, 158, 11, 0.3); }
        .tool-btn.follow { 
            width: auto; padding: 0 30px; font-size: 14px; font-weight: bold;
            background: var(--primary); border: none;
        }

        /* --- تصميم الهدايا --- */
        .gifts-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; 
            max-height: 250px; overflow-y: auto; padding-bottom: 10px;
        }
        .gift-card {
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 5px;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            border: 1px solid transparent; cursor: pointer; transition: 0.2s;
        }
        .gift-card:active { transform: scale(0.95); }
        .gift-card.selected { background: rgba(245, 158, 11, 0.15); border-color: var(--accent); }
        .gift-img { width: 45px; height: 45px; object-fit: contain; }
        .gift-price { font-size: 10px; color: var(--wealth); font-weight: bold; }

        .hidden { display: none !important; }

        /* أنيميشن الهدايا */
        .gift-fx-container {
            position: fixed; inset: 0; pointer-events: none; z-index: 3000;
            display: flex; align-items: center; justify-content: center;
        }
        .gift-fx-item {
            width: 150px; height: 150px;
            animation: giftPop 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
        @keyframes giftPop {
            0% { transform: scale(0) translateY(100px); opacity: 0; }
            20% { transform: scale(1.2) translateY(0); opacity: 1; }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5) translateY(-50px); }
        }

        /* حالة التحميل */
        .loader {
            width: 20px; height: 20px; border: 2px solid #fff; 
            border-bottom-color: transparent; border-radius: 50%; 
            display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body onclick="handleGlobalClick(event)">

<div class="app-bg"></div>

<div class="app-container">
    <!-- الهيدر -->
    <header class="header">

    <div style="flex:1" onclick="toggleSheet('giftSheet', false)"></div>
    <div class="bottom-sheet">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
            <span style="font-weight:bold; font-size:14px;">إرسال هدية إلى: <span id="giftTargetName" style="color:var(--accent)">المالك</span></span>
            <span style="font-size:12px; color:#888">رصيدك: <span id="myBalance" style="color:var(--wealth); font-weight:bold">0</span> 💰</span>
        </div>
        
        <div class="gifts-grid" id="giftsGrid"></div>
        
        <div style="display:flex; align-items:center; justify-content:flex-end; margin-top:15px; gap:10px;">
            <button class="btn-send" onclick="sendSelectedGift()" style="width:100%; border-radius:12px; height:40px; font-weight:bold; border:none;">إرسال</button>

<!-- Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, getDocs, increment, query, orderBy, limit, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getDatabase, ref, push, onValue, set, onDisconnect, serverTimestamp as rtdbTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 1. إعدادات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
        authDomain: "rtx3090-28439.firebaseapp.com",
        projectId: "rtx3090-28439",
        storageBucket: "rtx3090-28439.firebasestorage.app",
        messagingSenderId: "178612030690",
        appId: "1:178612030690:web:883189ced2ed3a78e3e2bb",
        databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);

    // 2. المتغيرات العامة
    let currentUser = null;
    let currentRoomOwnerId = null;
    let currentProfileUser = null; // المستخدم المعروض في البروفايل
    let giftTargetUser = null; // المستخدم الذي سترسل له هدية
    let selectedGiftId = null;
    let allUsersCache = {}; // تخزين مؤقت لبيانات المستخدمين
    let storeGifts = [];
    
    // الحصول على ID الغرفة من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    const roomType = urlParams.get('type') || 'private';

    // 3. التهيئة والتحقق
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // جلب بياناتي
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if(userSnap.exists()){
                currentUser = { uid: userSnap.id, ...userSnap.data() };
                document.getElementById('myBalance').innerText = (currentUser.balance || 0).toLocaleString();
                
                initRoom();
            }
        } else {
            window.location.href = "login.html";
        }
    });

    // 4. منطق الغرفة
    async function initRoom() {
        // تحديد المالك
        currentRoomOwnerId = roomId; 
        
        // تحميل بيانات المالك في الهيدر
        loadRoomHeader();
        
        // تحميل الهدايا
        loadGifts();

        // الاستماع للشات
        setupChatListener();

        // الاستماع للمتواجدين (نستخدم allUsers من الكود الأصلي كقائمة متواجدين)
        loadUsersBar();
    }

    async function loadRoomHeader() {
        if(roomType === 'private') {
            const ownerDoc = await getDoc(doc(db, "users", currentRoomOwnerId));
            if(ownerDoc.exists()) {
                const data = ownerDoc.data();
                document.getElementById('headerOwnerImg').src = data.photoURL || 'https://via.placeholder.com/150';
                document.getElementById('headerRoomName').innerText = `غرفة ${data.displayName}`;
                document.getElementById('headerOwnerId').innerText = `ID: ${data.uid.substring(0,6)}`;
                giftTargetUser = { uid: data.uid, name: data.displayName }; // الافتراضي للهدايا
            }
        } else {
            // منطق الغرف العامة
            document.getElementById('headerRoomName').innerText = "غرفة عامة";
        }
    }

    // شريط المستخدمين العلوي
    async function loadUsersBar() {
        const usersSnap = await getDocs(collection(db, "users"));
        const bar = document.getElementById('usersBar');
        bar.innerHTML = '';

        // إضافة المالك أولاً إذا كان موجوداً
        if (roomType === 'private') {
             // (تم تحميله في الهيدر، لكن يمكن إضافته هنا أيضاً بتمييز)
        }

        usersSnap.forEach(doc => {
            const u = doc.data();
            allUsersCache[doc.id] = u; // تخزين للكاش
            
            // عدم عرض نفسي في الشريط (اختياري)
            // if(doc.id === currentUser.uid) return;

            const div = document.createElement('div');
            div.className = 'user-head';
            div.onclick = () => openProfile(doc.id); // فتح البروفايل عند الضغط
            
            // التحقق من حالة الاتصال (بسيط)
            const isOnline = u.lastSeen && (Date.now() - u.lastSeen.toDate().getTime()) < 300000;
            
            div.innerHTML = `
                <div class="user-head-img-wrapper">
                    <img src="${u.photoURL || 'https://via.placeholder.com/150'}" style="border-color: ${isOnline ? '#10b981' : 'transparent'}">
                </div>
                <span>${u.displayName.split(' ')[0]}</span>
            `;
            bar.appendChild(div);
        });
    }

    // الشات
    function setupChatListener() {
        const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
        onValue(chatRef, (snapshot) => {
            const messages = snapshot.val();
            const area = document.getElementById('chatArea');
            area.innerHTML = '';
            
            if (messages) {
                const sortedMsgs = Object.values(messages).sort((a, b) => a.timestamp - b.timestamp);
                sortedMsgs.forEach(msg => {
                    const isMe = msg.senderId === currentUser.uid;
                    // الحصول على بيانات المرسل من الكاش أو الرسالة
                    const senderData = allUsersCache[msg.senderId] || { magicLevel: 1, wealthLevel: 1, photoURL: 'https://via.placeholder.com/150' };
                    
                    const div = document.createElement('div');
                    div.className = `msg-bubble ${isMe ? 'me' : ''}`;
                    
                    // محتوى الرسالة
                    let contentHTML = '';
                    if(msg.type === 'gift') {
                        contentHTML = `<div style="color:var(--accent); font-weight:bold;">أرسل هدية ${msg.giftName} 🎁</div>`;
                    } else {
                        contentHTML = `<div class="msg-text">${msg.text}</div>`;
                    }

                    div.innerHTML = `
                        <img src="${senderData.photoURL || 'https://via.placeholder.com/150'}" class="msg-avatar" onclick="window.openProfile('${msg.senderId}')">
                        <div class="msg-content">
                            <div class="msg-user">
                                ${msg.senderName}
                                ${!isMe ? `
                                <span class="badge b-wealth"><i class="fa-solid fa-gem" style="font-size:6px"></i> ${senderData.wealthLevel || 1}</span>
                                <span class="badge b-magic"><i class="fa-solid fa-star" style="font-size:6px"></i> ${senderData.magicLevel || 1}</span>
                                ` : ''}
                            </div>
                            ${contentHTML}
                        </div>
                    `;
                    area.appendChild(div);
                });
                area.scrollTop = area.scrollHeight;
            }
        });
    }

    // إرسال رسالة
    window.sendMessage = async () => {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;

        const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
        await push(chatRef, {
            senderId: currentUser.uid,
            senderName: currentUser.displayName,
            text: text,
            timestamp: rtdbTimestamp(),
            type: 'text'
        });
        input.value = '';
        input.focus();
    };

    // 5. منطق البروفايل (الأهم)
    window.openProfile = async (uid) => {
        toggleSheet('profileSheet', true);
        document.getElementById('profileContent').classList.add('hidden');
        document.getElementById('profileLoading').classList.remove('hidden');

        try {
            // جلب بيانات حية من فير بيز
            const docRef = doc(db, "users", uid);
            const docSnap = await getDoc(docRef);
            
            if(docSnap.exists()) {
                const data = docSnap.data();
                currentProfileUser = { uid: docSnap.id, ...data };
                
                document.getElementById('p-img').src = data.photoURL || 'https://via.placeholder.com/150';
                document.getElementById('p-name').innerText = data.displayName;
                document.getElementById('p-id').innerText = `ID: ${data.uid}`;
                document.getElementById('p-wealth').innerText = data.wealthLevel || 1;
                document.getElementById('p-magic').innerText = data.magicLevel || 1;
                document.getElementById('p-level').innerText = Math.floor(((data.wealthLevel||0) + (data.magicLevel||0))/2) || 1;

                document.getElementById('profileLoading').classList.add('hidden');
                document.getElementById('profileContent').classList.remove('hidden');
            }
        } catch (e) {
            console.error(e);
            alert("تعذر تحميل البيانات");
            toggleSheet('profileSheet', false);
        }
    };
    
    // ربط الدالة بالنافذة لتكون متاحة من HTML
    window.window.openProfile = window.openProfile;

    window.handleProfileMention = () => {
        toggleSheet('profileSheet', false);
        const input = document.getElementById('chatInput');
        input.value = `@${currentProfileUser.displayName} `;
        input.focus();
    };

    window.handleProfileGift = () => {
        giftTargetUser = currentProfileUser; // تحديد الهدف
        toggleSheet('profileSheet', false);
        openGiftSheet();
    };

    // 6. منطق الهدايا
    async function loadGifts() {
        // تحميل من فير بيز (محاكاة هنا للكود، لكن استخدمنا الكود الأصلي)
        try {
             const gSnap = await getDocs(collection(db, "gifts"));
             storeGifts = gSnap.docs.map(d => ({id: d.id, ...d.data()}));
             renderGiftsGrid();
        } catch(e) { console.log("Gifts load error", e); }
    }

    function renderGiftsGrid() {
        const grid = document.getElementById('giftsGrid');
        grid.innerHTML = '';
        if(storeGifts.length === 0) {
            grid.innerHTML = '<div style="color:#888; grid-column:span 4; text-align:center">لا توجد هدايا</div>';
            return;
        }

        storeGifts.forEach(gift => {
            const div = document.createElement('div');
            div.className = 'gift-card';
            div.onclick = () => {
                document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
                div.classList.add('selected');
                selectedGiftId = gift.id;
            };
            div.innerHTML = `
                <img src="${gift.image}" class="gift-img">
                <span style="font-size:10px; font-weight:bold">${gift.name}</span>
                <span class="gift-price">${gift.price} 💰</span>
            `;
            grid.appendChild(div);
        });
    }

    window.openGiftSheet = () => {
        if(!giftTargetUser) giftTargetUser = { uid: currentRoomOwnerId, name: "المالك" };
        document.getElementById('giftTargetName').innerText = giftTargetUser.name;
        toggleSheet('giftSheet', true);
    };

    window.sendSelectedGift = async () => {
        if(!selectedGiftId) return alert("اختر هدية أولاً");
        const gift = storeGifts.find(g => g.id === selectedGiftId);
        
        if(currentUser.balance < gift.price) {
            alert("رصيدك غير كافٍ!");
            return;
        }

        toggleSheet('giftSheet', false);

        // 1. خصم الرصيد
        await updateDoc(doc(db, "users", currentUser.uid), {
            balance: increment(-gift.price)
        });
        currentUser.balance -= gift.price;
        document.getElementById('myBalance').innerText = currentUser.balance.toLocaleString();

        // 2. تحديث المستلم (إضافة نقاط/ثروة)
        // (يمكنك إضافة منطق زيادة الثروة هنا كما في الكود الأصلي)

        // 3. إرسال رسالة بالشات
        const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
        await push(chatRef, {
            senderId: currentUser.uid,
            senderName: currentUser.displayName,
            text: `أرسل ${gift.name} إلى ${giftTargetUser.name}`,
            giftName: gift.name,
            timestamp: rtdbTimestamp(),
            type: 'gift'
        });

        // 4. تشغيل الأنيميشن
        showGiftAnimation(gift.image);
    };

    function showGiftAnimation(imgSrc) {
        const div = document.createElement('div');
        div.className = 'gift-fx-container';
        div.innerHTML = `<img src="${imgSrc}" class="gift-fx-item">`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2500);
    }

    // 7. أدوات الواجهة
    window.toggleSheet = (id, show) => {
        const el = document.getElementById(id);
        if(show) el.classList.add('show');
        else el.classList.remove('show');
    };

    window.handleGlobalClick = (e) => {
        const input = document.getElementById('chatInput');
        const giftBtn = document.getElementById('giftBtn');
        const sendBtn = document.getElementById('sendBtn');
        
        if (e.target !== input) {
            // input.blur(); // اختياري
        }
    };

    document.getElementById('chatInput').addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if(val.length > 0) {
            document.getElementById('giftBtn').classList.add('hidden');
            document.getElementById('sendBtn').classList.remove('hidden');
        } else {
            document.getElementById('giftBtn').classList.remove('hidden');
            document.getElementById('sendBtn').classList.add('hidden');
        }
    });

    window.exitRoom = () => {
        if(confirm("هل تود المغادرة؟")) {
            window.history.back();
        }
    };
    
    // جعل الدوال متاحة للـ HTML
    window.exitRoom = window.exitRoom;
    window.handleGlobalClick = window.handleGlobalClick;
    window.sendMessage = window.sendMessage;
    window.openGiftSheet = window.openGiftSheet;
    window.sendSelectedGift = window.sendSelectedGift;
    window.toggleSheet = window.toggleSheet;
    window.handleProfileMention = window.handleProfileMention;
    window.handleProfileGift = window.handleProfileGift;

</script>

</body>
</html>
