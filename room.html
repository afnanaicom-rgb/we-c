<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Premium Live Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --accent: #f59e0b;
            --bg-black: #000000;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
            --wealth: #facc15;
            --magic: #d946ef;
            --owner-green: #22c55e;
            --admin-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-black);
            color: #fff; height: 100vh; overflow: hidden;
            display: flex; justify-content: center;
        }

        .app-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 10%, #1e1b4b 0%, #000000 50%);
            z-index: -1;
        }

        .app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; position: relative; }

        /* شريط دخول المستخدم */
        .join-notification {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.9), rgba(217, 70, 239, 0.9));
            padding: 10px 25px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 1500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.5s ease, fadeOut 0.5s ease 2.5s forwards;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }
        
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; pointer-events: none; }
        }
        
        .join-notification img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
        }
        
        .join-notification span {
            font-size: 13px;
            font-weight: 600;
        }

        /* الهيدر */
        .header { 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 100; 
            border-bottom: 1px solid var(--glass-border); 
            background: rgba(0,0,0,0.2); 
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .room-info {
            display: flex; align-items: center; gap: 10px; background: var(--glass);
            padding: 5px 12px; border-radius: 30px; border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px); cursor: pointer;
        }
        
        .owner-img-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
        }
        
        .owner-img { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        .owner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            z-index: 2;
            pointer-events: none;
        }

        .btn-control { 
            background: transparent; 
            border: none; 
            color: #fff; 
            font-size: 18px; 
            padding: 5px; 
            opacity: 0.7;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .btn-control.active {
            background: var(--glass);
            opacity: 1;
        }
        
        .btn-control.settings {
            color: var(--accent);
        }

        /* الشات */
        .chat-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            scroll-behavior: smooth;
        }
        
        .chat-area::-webkit-scrollbar {
            width: 5px;
        }
        
        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-area::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }
        
        .msg-bubble {
            background: rgba(255,255,255,0.08); 
            border: 1px solid var(--glass-border);
            padding: 10px; 
            border-radius: 18px; 
            border-bottom-right-radius: 2px;
            backdrop-filter: blur(10px); 
            display: flex; 
            align-items: flex-start; 
            gap: 10px;
            max-width: 85%; 
            animation: slideIn 0.3s ease;
        }
        
        .msg-avatar-wrapper {
            position: relative;
            width: 45px;
            height: 45px;
            flex-shrink: 0;
        }
        
        .msg-avatar { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            cursor: pointer; 
            transition: 0.2s; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        .msg-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            z-index: 2;
            pointer-events: none;
        }
        
        .msg-avatar:active { transform: translate(-50%, -50%) scale(0.9); }
        
        .msg-user { 
            font-size: 11px; 
            font-weight: bold; 
            color: var(--accent); 
            display: flex; 
            align-items: center; 
            gap: 5px;
            margin-bottom: 3px;
            flex-wrap: wrap;
        }
        
        .msg-text { font-size: 13px; line-height: 1.5; color: #eee; }
        
        .badge { 
            font-size: 8px; 
            padding: 1px 6px; 
            border-radius: 10px; 
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .b-wealth { background: var(--wealth); color: #000; }
        .b-magic { background: var(--magic); color: #fff; }
        
        .owner-icon {
            color: var(--owner-green);
            font-size: 12px;
        }
        
        .admin-icon {
            color: var(--admin-gold);
            font-size: 12px;
        }
        
        .active-badges {
            display: flex;
            gap: 2px;
            margin-right: 5px;
        }
        
        .active-badge {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .active-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* الفوتر */
        .footer { 
            padding: 10px 15px 25px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            z-index: 500; 
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            position: relative;
        }
        
        .input-box {
            flex: 1; 
            background: var(--glass); 
            border: 1px solid var(--glass-border);
            border-radius: 25px; 
            height: 46px; 
            padding: 0 15px; 
            display: flex; 
            align-items: center;
        }
        
        .main-input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            width: 100%; 
            font-size: 14px; 
            font-family: 'Cairo', sans-serif;
        }
        
        .btn-action {
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: none;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: white; 
            transition: 0.2s;
            font-size: 18px;
        }
        
        .btn-action:active { transform: scale(0.9); }

        /* النوافذ (Sheets) */
        .sheet-overlay {
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(5px);
            z-index: 2000; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end;
            opacity: 0; 
            pointer-events: none; 
            transition: 0.3s;
        }
        
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            background: rgba(20, 20, 25, 0.95); 
            backdrop-filter: blur(40px);
            width: 100%; 
            border-radius: 30px 30px 0 0; 
            border-top: 1px solid var(--glass-border);
            transform: translateY(100%); 
            transition: 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 25px; 
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .sheet-overlay.show .bottom-sheet { transform: translateY(0); }

        /* أزرار البروفايل */
        .profile-tools { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin: 20px 0; 
            flex-wrap: wrap;
        }
        
        .tool-btn {
            width: 45px; 
            height: 45px; 
            border-radius: 15px; 
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border); 
            color: #fff; 
            display: flex;
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            transition: 0.2s; 
            cursor: pointer;
        }
        
        .tool-btn:active { transform: scale(0.9); background: var(--glass); }
        .tool-btn.gift { color: var(--accent); }
        .tool-btn.mention { color: #3b82f6; }
        .tool-btn.ban { color: #ef4444; }
        .tool-btn.mute { color: #f59e0b; }
        .tool-btn.kick { color: #f97316; }
        .tool-btn.admin { color: var(--admin-gold); }
        .tool-btn.wider { width: auto; padding: 0 20px; font-size: 14px; font-weight: bold; }

        /* الهدايا */
        .user-selector { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            padding-bottom: 15px; 
            margin-bottom: 15px; 
            border-bottom: 1px solid var(--glass-border); 
        }
        
        .user-option { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            opacity: 0.4; 
            min-width: 50px; 
            cursor: pointer;
        }
        
        .user-option.active { opacity: 1; font-weight: bold; color: var(--accent); }
        
        .user-option-avatar-wrapper {
            position: relative;
            width: 45px;
            height: 45px;
        }
        
        .user-option img { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        .user-option-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            z-index: 2;
            pointer-events: none;
        }
        
        .user-option.active img { border-color: var(--accent); }

        .gifts-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            max-height: 250px; 
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .gift-card {
            background: rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 12px 5px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            border: 1px solid transparent; 
            cursor: pointer; 
            transition: 0.2s;
        }
        
        .gift-card.selected { background: rgba(245, 158, 11, 0.15); border-color: var(--accent); }
        
        .gift-icon {
            font-size: 25px;
            margin-bottom: 5px;
        }
        
        .gift-price {
            font-size: 10px;
            color: var(--accent);
        }

        .hidden { display: none !important; }

        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes giftPop {
            0% { transform: scale(0) rotate(-20deg) translate(-50%, -50%); opacity: 0; }
            50% { transform: scale(1.8) rotate(10deg) translate(-50%, -50%); opacity: 1; }
            100% { transform: scale(1) translate(-50%, -400px); opacity: 0; }
        }
        
        .gift-fx {
            position: absolute; 
            left: 50%; 
            top: 50%; 
            font-size: 80px;
            pointer-events: none; 
            z-index: 3000; 
            animation: giftPop 1.5s ease-out forwards;
        }
        
        /* نافذة المستخدمين النشطين */
        .active-users-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 10px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .active-user-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }
        
        .active-user-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--glass-border);
        }
        
        .active-user-avatar-wrapper {
            position: relative;
            width: 65px;
            height: 65px;
            margin-bottom: 5px;
        }
        
        .active-user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        .active-user-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            z-index: 2;
            pointer-events: none;
        }
        
        .active-user-badges {
            display: flex;
            gap: 2px;
            justify-content: center;
            margin-top: 5px;
        }
        
        .active-user-badge {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .active-user-name {
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            margin-top: 5px;
            color: #fff;
        }
        
        .active-user-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            position: absolute;
            bottom: 2px;
            right: 2px;
            border: 2px solid #000;
            z-index: 3;
        }
        
        .owner-badge, .admin-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            margin-top: 3px;
        }
        
        .owner-badge {
            background: rgba(34, 197, 94, 0.2);
            color: var(--owner-green);
        }
        
        .admin-badge {
            background: rgba(251, 191, 36, 0.2);
            color: var(--admin-gold);
        }
        
        /* نافذة الشارات */
        .badges-sheet {
            max-height: 60vh;
        }
        
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px 0;
        }
        
        .badge-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .badge-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255,255,255,0.1);
        }
        
        .badge-name {
            font-size: 10px;
            text-align: center;
            color: #ccc;
        }
        
        /* إشعارات */
        .notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            z-index: 3000;
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90%;
        }
        
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        .notification-icon {
            font-size: 18px;
        }
        
        /* مستوى الثروة والسحر */
        .level-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin: 10px 0;
        }
        
        .level-icon {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        
        .level-text {
            font-size: 12px;
            color: #888;
        }
        
        /* زر حذف الشات للمالك */
        .delete-chat-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
            z-index: 100;
        }
        
        .delete-chat-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        /* قوائم المحظورين والأدمن */
        .list-section {
            margin: 20px 0;
            border-top: 1px solid var(--glass-border);
            padding-top: 15px;
        }
        
        .list-section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 8px;
        }
        
        .list-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        
        .list-item-info {
            flex: 1;
        }
        
        .list-item-name {
            font-size: 13px;
            font-weight: bold;
        }
        
        .list-item-action {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }
        
        /* إعدادات الغرفة */
        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .settings-input {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 15px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }
        
        .settings-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .settings-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .settings-btn:hover {
            opacity: 0.9;
        }
        
        .settings-image-preview {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--glass-border);
        }
    </style>
</head>
<body onclick="handleGlobalClick(event)">

<div class="app-bg"></div>

<!-- حاوية إشعارات الدخول -->
<div id="joinNotifications"></div>

<div class="app-container">
    <!-- الهيدر -->
    <header class="header">
        <div class="header-left">
            <div class="room-info" onclick="openRoomOwnerProfile()">
                <div class="owner-img-wrapper" id="roomOwnerAvatarWrapper">
                    <img src="" class="owner-img" id="roomOwnerImg">
                    <img src="" class="owner-frame hidden" id="roomOwnerFrame">
                </div>
                <div>
                    <span style="font-size:9px; color:var(--accent)" id="roomOwnerId">ID: ---</span>
                    <div style="font-size:12px; font-weight:bold" id="roomName">جاري التحميل...</div>
                </div>
            </div>
            <button class="btn-control active" id="activeUsersBtn" onclick="toggleSheet('activeUsersSheet', true)">
                <i class="fa-solid fa-users"></i>
            </button>
            <button class="btn-control settings hidden" id="roomSettingsBtn" onclick="toggleSheet('roomSettingsSheet', true)">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
        <div style="display:flex; gap:8px">
            <button class="btn-control"><i class="fa-solid fa-expand"></i></button>
            <button class="btn-control" onclick="leaveRoom()"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </header>

    <!-- زر حذف الشات للمالك -->
    <div id="deleteChatBtn" class="delete-chat-btn hidden" onclick="confirmDeleteChat()">
        <i class="fa-solid fa-trash"></i>
        حذف الشات
    </div>

    <!-- الشات -->
    <div class="chat-area" id="chatArea"></div>

    <footer class="footer">
        <div class="input-box" onclick="event.stopPropagation()">
            <input type="text" id="chatInput" class="main-input" placeholder="اكتب شيئاً..." autocomplete="off" 
                   oninput="checkIfMuted()" disabled>
        </div>
        <button id="giftBtn" class="btn-action" style="background:var(--accent)" onclick="toggleSheet('giftSheet', true)">
            <i class="fa-solid fa-gift"></i>
        </button>
        <button id="sendBtn" class="btn-action hidden" style="background:var(--primary)" onclick="sendMsg()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </footer>
</div>

<!-- نافذة البروفايل -->
<div class="sheet-overlay" id="profileSheet">
    <div style="flex:1" onclick="toggleSheet('profileSheet', false)"></div>
    <div class="bottom-sheet">

<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
        authDomain: "rtx3090-28439.firebaseapp.com",
        databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com",
        projectId: "rtx3090-28439",
        storageBucket: "rtx3090-28439.firebasestorage.app",
        messagingSenderId: "178612030690",
        appId: "1:178612030690:web:883189ced2ed3a78e3e2bb",
        measurementId: "G-PTKK9Y8HK5"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const rtdb = firebase.database();

    // متغيرات عامة
    let currentUser = null;
    let currentUserData = null;
    let roomData = null;
    let roomId = null;
    let roomType = null;
    let isRoomOwner = false;
    let isRoomAdmin = false;
    let storeData = {
        itemsById: {},
        magicLevels: {},
        wealthLevels: {},
        gifts: [],
        badges: []
    };
    
    let selectedRecipient = null;
    let selectedGift = null;
    let activeUsers = {};
    let messagesListener = null;
    let activeUsersListener = null;
    let roomListener = null;
    let currentProfileUser = null;
    let bannedUsers = [];
    let mutedUsers = [];
    let roomAdmins = [];
    let joinedUsers = new Set();

    // الحصول على بارامترات URL
    const urlParams = new URLSearchParams(window.location.search);
    roomId = urlParams.get('id');
    roomType = urlParams.get('type') || 'public';

    // تهيئة التطبيق
    window.onload = async () => {
        await initializeApp();
    };

    async function initializeApp() {
        await loadStoreData();
        setupAuthListener();
    }

    function setupAuthListener() {
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await loadUserData(user.uid);
                await loadRoomData();
                setupRoomListeners();
            } else {
                window.location.href = 'afnan_ai_white.html';
            }
        });
    }

    async function loadUserData(uid) {
        try {
            const userDoc = await db.collection('users').doc(uid).get();
            if (userDoc.exists) {
                currentUserData = { uid, ...userDoc.data() };
                console.log('بيانات المستخدم المحملة:', currentUserData);
            }
        } catch (error) {
            console.error('خطأ في تحميل بيانات المستخدم:', error);
        }
    }

    async function loadRoomData() {
        try {
            let roomDoc;
            if (roomType === 'private') {
                roomDoc = await db.collection('privateRooms').doc(roomId).get();
            } else {
                roomDoc = await db.collection('rooms').doc(roomId).get();
            }
            
            if (roomDoc.exists) {
                roomData = { id: roomDoc.id, ...roomDoc.data() };
                document.getElementById('roomName').textContent = roomData.name || 'روم النخبة 💎';
                
                // تحميل بيانات مالك الغرفة
                if (roomData.owner) {
                    await loadRoomOwnerData(roomData.owner);
                }
                
                // التحقق من صلاحيات المستخدم
                isRoomOwner = currentUser.uid === roomData.owner;
                roomAdmins = roomData.admins || [];
                isRoomAdmin = roomAdmins.includes(currentUser.uid);
                
                // إظهار أزرار المالك
                if (isRoomOwner) {
                    document.getElementById('deleteChatBtn').classList.remove('hidden');
                    document.getElementById('roomSettingsBtn').classList.remove('hidden');
                }
                
                bannedUsers = roomData.bannedUsers || [];
                mutedUsers = roomData.mutedUsers || [];
                
                // التحقق إذا كان المستخدم محظور
                if (bannedUsers.includes(currentUser.uid)) {
                    showNotification('⚠️ تم حظرك من هذه الغرفة');
                    setTimeout(() => {
                        window.location.href = 'afnan_ai_white.html';
                    }, 3000);
                    return;
                }
                
                checkIfMuted();
                await joinRoom();
            } else {
                showNotification('⚠️ الغرفة غير موجودة');
                setTimeout(() => {
                    window.location.href = 'afnan_ai_white.html';
                }, 2000);
            }
        } catch (error) {
            console.error('خطأ في تحميل بيانات الغرفة:', error);
        }
    }

    async function loadRoomOwnerData(ownerId) {
        try {
            const ownerDoc = await db.collection('users').doc(ownerId).get();
            if (ownerDoc.exists) {
                const ownerData = ownerDoc.data();
                document.getElementById('roomOwnerImg').src = ownerData.photoURL || 'https://i.pravatar.cc/100?u=admin';
                document.getElementById('roomOwnerId').textContent = `ID: ${ownerId}`;
                
                // عرض إطار المالك
                if (ownerData.activeFrame && storeData.itemsById[ownerData.activeFrame]) {
                    const frameElement = document.getElementById('roomOwnerFrame');
                    frameElement.src = storeData.itemsById[ownerData.activeFrame].image;
                    frameElement.classList.remove('hidden');
                }
            }
        } catch (error) {
            console.error('خطأ في تحميل بيانات المالك:', error);
        }
    }

    async function loadStoreData() {
        try {
            const magicLevelsSnapshot = await db.collection('magicLevels').get();
            magicLevelsSnapshot.forEach(doc => {
                storeData.magicLevels[doc.id] = doc.data();
            });

            const wealthLevelsSnapshot = await db.collection('wealthLevels').get();
            wealthLevelsSnapshot.forEach(doc => {
                storeData.wealthLevels[doc.id] = doc.data();
            });

            const giftsSnapshot = await db.collection('gifts').get();
            storeData.gifts = giftsSnapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));

            const itemsSnapshot = await db.collection('storeItems').get();
            itemsSnapshot.forEach(doc => {
                storeData.itemsById[doc.id] = { id: doc.id, ...doc.data() };
                if (doc.data().type === 'badge') {
                    storeData.badges.push({ id: doc.id, ...doc.data() });
                }
            });

            console.log('بيانات المتجر المحملة:', storeData);
        } catch (error) {
            console.error('خطأ في تحميل بيانات المتجر:', error);
        }
    }

    function setupRoomListeners() {
        setupMessagesListener();
        setupActiveUsersListener();
        setupRoomUpdatesListener();
    }

    function setupMessagesListener() {
        if (messagesListener) {
            messagesListener();
        }
        
        const messagesRef = rtdb.ref(`roomMessages/${roomId}`);
        messagesRef.remove();
        
        messagesListener = messagesRef.on('child_added', (snapshot) => {
            const message = snapshot.val();
            displayMessage(message);
        });
    }

    function setupActiveUsersListener() {
        const activeUsersRef = rtdb.ref(`activeUsers/${roomId}`);
        
        activeUsersRef.child(currentUser.uid).set({
            uid: currentUser.uid,
            displayName: currentUserData.displayName,
            photoURL: currentUserData.photoURL,
            activeFrame: currentUserData.activeFrame,
            activeBadges: currentUserData.activeBadges || [],
            magicLevel: currentUserData.magicLevel || 1,
            wealthLevel: currentUserData.wealthLevel || 1,
            joinedAt: Date.now()
        });

        activeUsersRef.child(currentUser.uid).onDisconnect().remove();

        activeUsersListener = activeUsersRef.on('value', (snapshot) => {
            const newActiveUsers = snapshot.val() || {};
            
            // التحقق من المستخدمين الجدد
            Object.keys(newActiveUsers).forEach(uid => {
                if (!activeUsers[uid] && uid !== currentUser.uid && !joinedUsers.has(uid)) {
                    joinedUsers.add(uid);
                    showJoinNotification(newActiveUsers[uid]);
                }
            });
            
            activeUsers = newActiveUsers;
            updateActiveUsersDisplay();
        });
    }

    function showJoinNotification(user) {
        const container = document.getElementById('joinNotifications');
        const notification = document.createElement('div');
        notification.className = 'join-notification';
        notification.innerHTML = `
            <img src="${user.photoURL || 'https://i.pravatar.cc/100'}" alt="">
            <span>دخل ${user.displayName || 'مستخدم'} الغرفة</span>
        `;
        container.appendChild(notification);
        
        setTimeout(() => {
            notification.remove();
        }, 3000);
    }

    function setupRoomUpdatesListener() {
        let roomRef;
        if (roomType === 'private') {
            roomRef = db.collection('privateRooms').doc(roomId);
        } else {
            roomRef = db.collection('rooms').doc(roomId);
        }
        
        roomListener = roomRef.onSnapshot((doc) => {
            if (doc.exists) {
                const updatedData = doc.data();
                bannedUsers = updatedData.bannedUsers || [];
                mutedUsers = updatedData.mutedUsers || [];
                roomAdmins = updatedData.admins || [];
                isRoomAdmin = roomAdmins.includes(currentUser.uid);
                
                // التحقق إذا تم حظر المستخدم الحالي
                if (bannedUsers.includes(currentUser.uid)) {
                    showNotification('⚠️ تم حظرك من هذه الغرفة');
                    setTimeout(() => {
                        leaveRoom();
                        window.location.href = 'afnan_ai_white.html';
                    }, 2000);
                }
                
                checkIfMuted();
                
                // تحديث قوائم الإعدادات
                if (isRoomOwner) {
                    updateSettingsLists();
                }
            }
        });
    }

    function updateActiveUsersDisplay() {
        const grid = document.getElementById('activeUsersGrid');
        const countElement = document.getElementById('activeUsersCount');
        
        grid.innerHTML = '';
        const usersArray = Object.values(activeUsers);
        countElement.textContent = usersArray.length;
        
        usersArray.forEach(user => {
            const userCard = document.createElement('div');
            userCard.className = 'active-user-card';
            userCard.onclick = () => openProfileById(user.uid);
            
            const avatarWrapper = document.createElement('div');
            avatarWrapper.className = 'active-user-avatar-wrapper';
            
            const avatar = document.createElement('img');
            avatar.src = user.photoURL || 'https://i.pravatar.cc/100';
            avatar.className = 'active-user-avatar';
            
            const status = document.createElement('div');
            status.className = 'active-user-status';
            
            avatarWrapper.appendChild(avatar);
            avatarWrapper.appendChild(status);
            
            // إضافة الإطار
            if (user.activeFrame && storeData.itemsById[user.activeFrame]) {
                const frame = document.createElement('img');
                frame.src = storeData.itemsById[user.activeFrame].image;
                frame.className = 'active-user-frame';
                avatarWrapper.appendChild(frame);
            }
            
            const badges = document.createElement('div');
            badges.className = 'active-user-badges';
            
            if (user.activeBadges && user.activeBadges.length > 0) {
                user.activeBadges.slice(0, 3).forEach(badgeId => {
                    const badge = storeData.itemsById[badgeId];
                    if (badge) {
                        const badgeElement = document.createElement('div');
                        badgeElement.className = 'active-user-badge';
                        
                        if (badge.itemType === 'svga') {
                            badgeElement.innerHTML = '<span style="font-size:8px">SVGA</span>';
                        } else {
                            const badgeImg = document.createElement('img');
                            badgeImg.src = badge.image;
                            badgeElement.appendChild(badgeImg);
                        }
                        
                        badges.appendChild(badgeElement);
                    }
                });
            }
            
            const name = document.createElement('div');
            name.className = 'active-user-name';
            name.textContent = user.displayName || 'مستخدم';
            
            userCard.appendChild(avatarWrapper);
            userCard.appendChild(badges);
            userCard.appendChild(name);
            
            // إضافة شارة المالك أو الأدمن
            if (user.uid === roomData.owner) {
                const ownerBadge = document.createElement('div');
                ownerBadge.className = 'owner-badge';
                ownerBadge.innerHTML = '<i class="fa-solid fa-house"></i> المالك';
                userCard.appendChild(ownerBadge);
            } else if (roomAdmins.includes(user.uid)) {
                const adminBadge = document.createElement('div');
                adminBadge.className = 'admin-badge';
                adminBadge.innerHTML = '<i class="fa-solid fa-star"></i> أدمن';
                userCard.appendChild(adminBadge);
            }
            
            grid.appendChild(userCard);
        });
    }

    async function displayMessage(message) {
        const area = document.getElementById('chatArea');
        
        let senderData = activeUsers[message.senderId];
        if (!senderData && message.senderId !== 'system') {
            try {
                const userDoc = await db.collection('users').doc(message.senderId).get();
                if (userDoc.exists) {
                    senderData = userDoc.data();
                }
            } catch (error) {
                console.error('خطأ في تحميل بيانات المرسل:', error);
            }
        }
        
        const div = document.createElement('div');
        div.className = 'msg-bubble';
        
        if (message.type === 'system') {
            div.style.background = "rgba(245, 158, 11, 0.15)";
            div.innerHTML = `<div class="msg-text" style="color:var(--accent); font-weight:bold;">${message.text}</div>`;
        } else if (message.type === 'gift') {
            const giftData = storeData.gifts.find(g => g.id === message.giftId) || {};
            div.style.background = "rgba(139, 92, 246, 0.15)";
            div.style.borderColor = "rgba(139, 92, 246, 0.3)";
            div.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="font-size: 24px;">${giftData.icon || '🎁'}</div>
                    <div>
                        <div class="msg-text" style="color:var(--primary); font-weight:bold;">
                            ${senderData?.displayName || 'مستخدم'} أرسل هدية ${giftData.name || ''} لـ ${message.recipientName}
                        </div>
                        <div style="font-size: 11px; color: #aaa;">x${message.quantity}</div>
                    </div>
                </div>
            `;
        } else {
            const avatarWrapper = document.createElement('div');
            avatarWrapper.className = 'msg-avatar-wrapper';
            
            const avatar = document.createElement('img');
            avatar.src = senderData?.photoURL || 'https://i.pravatar.cc/100';
            avatar.className = 'msg-avatar';
            avatar.onclick = () => openProfileById(message.senderId);
            
            avatarWrapper.appendChild(avatar);
            
            // إضافة الإطار فوق الصورة مباشرة
            if (senderData?.activeFrame && storeData.itemsById[senderData.activeFrame]) {
                const frame = document.createElement('img');
                frame.src = storeData.itemsById[senderData.activeFrame].image;
                frame.className = 'msg-frame';
                avatarWrapper.appendChild(frame);
            }
            
            const badgesHtml = senderData?.activeBadges ? senderData.activeBadges.slice(0, 3).map(badgeId => {
                const badge = storeData.itemsById[badgeId];
                if (badge) {
                    if (badge.itemType === 'svga') {
                        return `<div class="active-badge" style="background: #333; display: flex; align-items: center; justify-content: center;">
                            <span style="font-size: 6px;">SVGA</span>
                        </div>`;
                    }
                    return `<div class="active-badge">
                        <img src="${badge.image}" alt="${badge.name}">
                    </div>`;
                }
                return '';
            }).join('') : '';
            
            // تحديد أيقونة المالك أو الأدمن
            let roleIcon = '';
            if (message.senderId === roomData.owner) {
                roleIcon = '<i class="fa-solid fa-house owner-icon"></i>';
            } else if (roomAdmins.includes(message.senderId)) {
                roleIcon = '<i class="fa-solid fa-star admin-icon"></i>';
            }
            
            div.innerHTML = `
                ${avatarWrapper.outerHTML}
                <div class="msg-content">
                    <div class="msg-user">
                        ${roleIcon}
                        ${senderData?.displayName || 'مستخدم'}
                        <div class="active-badges">${badgesHtml}</div>
                        <span class="badge b-wealth">W.${senderData?.wealthLevel || 1}</span>
                        <span class="badge b-magic">M.${senderData?.magicLevel || 1}</span>
                    </div>
                    <div class="msg-text">${message.text}</div>
                </div>
            `;
        }
        
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    async function openProfileById(userId) {
        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                currentProfileUser = { uid: userId, ...userDoc.data() };
                updateProfileSheet();
                toggleSheet('profileSheet', true);
            }
        } catch (error) {
            console.error('خطأ في فتح البروفايل:', error);
            showNotification('⚠️ خطأ في تحميل بيانات المستخدم');
        }
    }

    function updateProfileSheet() {
        if (!currentProfileUser) return;
        
        document.getElementById('p-name').textContent = currentProfileUser.displayName || 'مستخدم';
        document.getElementById('p-id').textContent = `ID: ${currentProfileUser.uid}`;
        document.getElementById('p-img').src = currentProfileUser.photoURL || 'https://i.pravatar.cc/100';
        
        // تحديث الإطار - يظهر فوق الصورة مباشرة
        const frameElement = document.getElementById('p-frame');
        if (currentProfileUser.activeFrame && storeData.itemsById[currentProfileUser.activeFrame]) {
            frameElement.src = storeData.itemsById[currentProfileUser.activeFrame].image;
            frameElement.style.display = 'block';
        } else {
            frameElement.style.display = 'none';
        }
        
        // تحديث مستويات السحر والثروة
        const magicLevel = currentProfileUser.magicLevel || 1;
        const wealthLevel = currentProfileUser.wealthLevel || 1;
        
        document.getElementById('p-magic-level').textContent = `السحر Lv.${magicLevel}`;
        document.getElementById('p-wealth-level').textContent = `الثروة Lv.${wealthLevel}`;
        
        const magicLevelImg = document.getElementById('p-magic-level-img');
        const wealthLevelImg = document.getElementById('p-wealth-level-img');
        
        if (storeData.magicLevels[magicLevel]) {
            magicLevelImg.src = storeData.magicLevels[magicLevel].image;
        }
        
        if (storeData.wealthLevels[wealthLevel]) {
            wealthLevelImg.src = storeData.wealthLevels[wealthLevel].image;
        }
        
        // تحديث الشارات
        const badgesContainer = document.getElementById('p-badges');

                const badge = storeData.itemsById[badgeId];
                if (badge) {

                    badgeElement.className = 'active-user-badge';

                        badgeImg.src = badge.image;
                        badgeElement.appendChild(badgeImg);
                    }
                    
                    badgeElement.title = badge.name;
                    badgesContainer.appendChild(badgeElement);
                }
            });
        }

        const followBtn = document.getElementById('followBtn');
        if (currentUserData.friends && currentUserData.friends.includes(currentProfileUser.uid)) {
            followBtn.textContent = 'متابع ✓';

            followBtn.style.background = 'var(--primary)';

        const banBtn = document.getElementById('banBtn');
        const muteBtn = document.getElementById('muteBtn');
        const makeAdminBtn = document.getElementById('makeAdminBtn');
        
        const canManage = (isRoomOwner || isRoomAdmin) && currentProfileUser.uid !== currentUser.uid && currentProfileUser.uid !== roomData.owner;
        
        if (canManage) {
            kickBtn.classList.remove('hidden');
            banBtn.classList.remove('hidden');
            muteBtn.classList.remove('hidden');
            
            // فقط المالك يمكنه تعيين أدمن
            if (isRoomOwner) {
                makeAdminBtn.classList.remove('hidden');
                
                if (roomAdmins.includes(currentProfileUser.uid)) {
                    makeAdminBtn.innerHTML = '<i class="fa-solid fa-user-minus"></i>';
                    makeAdminBtn.title = 'إلغاء الأدمن';
                } else {
                    makeAdminBtn.innerHTML = '<i class="fa-solid fa-crown"></i>';
                    makeAdminBtn.title = 'تعيين أدمن';
                }
            }
            
            // تحديث حالة أزرار الحظر والتقييد
            if (bannedUsers.includes(currentProfileUser.uid)) {
                banBtn.innerHTML = '<i class="fa-solid fa-unlock"></i>';
                banBtn.title = 'إلغاء الحظر';
            } else {
                banBtn.innerHTML = '<i class="fa-solid fa-ban"></i>';
                banBtn.title = 'حظر نهائي';
            }
            
            if (mutedUsers.includes(currentProfileUser.uid)) {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-up"></i>';
                muteBtn.title = 'إلغاء التقييد';
            } else {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-mute"></i>';
                muteBtn.title = 'تقييد الكتابة';
            }
        } else {
            kickBtn.classList.add('hidden');
            banBtn.classList.add('hidden');
            muteBtn.classList.add('hidden');
            makeAdminBtn.classList.add('hidden');
        }
    }

        try {
            await db.collection('users').doc(currentUser.uid).update({
                sentRequests: firebase.firestore.FieldValue.arrayUnion(currentProfileUser.uid)
            });
            
            await db.collection('users').doc(currentProfileUser.uid).update({
                friendRequests: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
            });
            
            if (!currentUserData.sentRequests) currentUserData.sentRequests = [];

    async function executeGift() {
        if (!selectedGift || !selectedRecipient) {
            showNotification('⚠️ اختر هدية ومستقبلاً');
            return;
        }
        
        const qtyInput = document.getElementById('giftQty');
        const qty = parseInt(qtyInput.value) || 1;
        
        const totalCost = selectedGift.price * qty;
        if ((currentUserData.balance || 0) < totalCost) {
            showNotification('⚠️ رصيدك غير كافٍ');
            return;
        }
        
        try {
            await db.collection('users').doc(currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(-totalCost)
            });
            
            let updateData = {};
            
            if (selectedGift.type === 'magic') {
                updateData.magicLevel = firebase.firestore.FieldValue.increment(1);
                updateData.balance = firebase.firestore.FieldValue.increment(selectedGift.reward || 0);
            } else if (selectedGift.type === 'wealth') {
                updateData.wealthLevel = firebase.firestore.FieldValue.increment(1);
                updateData.balance = firebase.firestore.FieldValue.increment(selectedGift.reward || 0);
            }
            
            if (Object.keys(updateData).length > 0) {
                await db.collection('users').doc(selectedRecipient.uid).update(updateData);
            }
            
            const messageRef = rtdb.ref(`roomMessages/${roomId}`).push();
            await messageRef.set({
                senderId: currentUser.uid,
                recipientId: selectedRecipient.uid,
                recipientName: selectedRecipient.displayName,
                giftId: selectedGift.id,
                quantity: qty,
                timestamp: Date.now(),
                type: 'gift'
            });
            
            const fx = document.createElement('div');
            fx.className = 'gift-fx';
            fx.innerHTML = selectedGift.icon || '🎁';
            document.body.appendChild(fx);
            setTimeout(() => fx.remove(), 1500);
            
            currentUserData.balance = (currentUserData.balance || 0) - totalCost;
            document.getElementById('giftBalance').textContent = currentUserData.balance;
            
            toggleSheet('giftSheet', false);
            showNotification(`🎁 تم إرسال ${selectedGift.name} إلى ${selectedRecipient.displayName}`);
            
        } catch (error) {
            console.error('خطأ في إرسال الهدية:', error);
            showNotification('⚠️ فشل إرسال الهدية');
        }
    }

        notification.className = 'notification';
        notification.innerHTML = `
            <div class="notification-icon">${message.includes('✓') ? '✓' : message.includes('⚠️') ? '⚠️' : '💬'}</div>
            <div>${message}</div>
        `;
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.style.opacity = '0';
            notification.style.transform = 'translateX(-50%) translateY(-10px)';
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    }

    function openRoomOwnerProfile() {
        if (roomData && roomData.owner) {
            openProfileById(roomData.owner);
        }
    }

    // إعداد مستمعات الأحداث
    document.getElementById('chatInput').addEventListener('focus', function() {
        document.getElementById('giftBtn').classList.add('hidden');
        document.getElementById('sendBtn').classList.remove('hidden');
    });

    document.getElementById('chatInput').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') sendMsg();
    });

    window.addEventListener('beforeunload', async function(e) {
        if (currentUser && roomId) {
            const activeUsersRef = rtdb.ref(`activeUsers/${roomId}/${currentUser.uid}`);
            await activeUsersRef.remove();
        }
    });
</script>

</body>
</html>
