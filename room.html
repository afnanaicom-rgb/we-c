<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Premium Room - Light Mode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>

    <style>
        :root {
            /* Light Mode Palette */
            --bg-main: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-sec: #6b7280;
            --primary: #6366f1; /* Indigo */
            --accent: #f59e0b; /* Amber */
            --border: #e5e7eb;
            --bubble-sent: #e0e7ff;
            --bubble-received: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100dvh; /* Dynamic Viewport Height */
            overflow: hidden; /* لمنع السكرول للصفحة كلها، السكرول داخلي فقط */
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px; /* توسيع العرض قليلاً */
            height: 100%;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* --- Header --- */
        .header {
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            height: 60px;
        }

        .room-info-card {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .owner-avatar-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
        }
        
        .avatar-base {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* يسمح بالضغط على الصورة تحته */
        }

        /* --- Users Bar --- */
        .users-bar {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            min-height: 85px;
            scrollbar-width: none;
        }
        .users-bar::-webkit-scrollbar { display: none; }

        .user-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 55px;
            cursor: pointer;
        }

        .user-circle-img-box {
            position: relative;
            width: 50px;
            height: 50px;
        }

        .user-name-micro {
            font-size: 10px;
            margin-top: 4px;
            color: var(--text-sec);
            max-width: 55px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Chat Area --- */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%239C92AC' fill-opacity='0.05' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3Ccircle cx='13' cy='13' r='3'/%3E%3C/g%3E%3C/svg%3E");
        }

        .chat-msg-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            animation: fadeIn 0.3s ease;
        }
        
        .chat-msg-row.me {
            flex-direction: row-reverse;
        }

        .chat-avatar-container {
            width: 42px;
            height: 42px;
            position: relative;
            flex-shrink: 0;
        }

        .chat-bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 16px;
            position: relative;
            box-shadow: var(--shadow);
            background-color: var(--bubble-received);
            border: 1px solid var(--border);
        }

        .chat-msg-row.me .chat-bubble {
            background-color: var(--bubble-sent);
            border-color: #c7d2fe;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 4px;
        }

        .chat-msg-row:not(.me) .chat-bubble {
            border-bottom-left-radius: 4px;
        }

        /* فقاعات مخصصة (صور/تدرجات) */
        .chat-bubble.custom-bubble {
            background-size: cover; /* جعل الصورة تغطي الفقاعة */
            background-position: center;
            background-repeat: no-repeat;
            color: #fff; /* النص أبيض غالباً مع الخلفيات الملونة */
            border: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .msg-header {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .msg-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sec);
        }

        .level-badge {
            height: 14px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
        }
        .level-badge img {
            height: 100%;
            width: auto;
        }

        .msg-text {
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
            z-index: 2;
        }

        /* --- Footer --- */
        .footer {
            padding: 10px 15px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-main);
            border-radius: 25px;
            padding: 0 15px;
            height: 45px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 14px;
            color: var(--text-main);
        }

        .action-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
            color: white;
            box-shadow: var(--shadow);
        }

        /* --- Layers (Modals/Effects) --- */
        .overlay-layer {
            position: fixed;
            inset: 0;
            z-index: 2000;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .svga-fullscreen {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Gift Animation Flying */
        .flying-gift {
            position: fixed;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .flying-gift img {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));
        }
        .flying-info {
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-top: 5px;
        }

        /* Sheets (Bottom Modals) */
        .sheet-container {
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .sheet-container.active {
            opacity: 1;
            pointer-events: auto;
        }
        .sheet-content {
            background: var(--bg-card);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .sheet-container.active .sheet-content {
            transform: translateY(0);
        }

        /* Profile Styles */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .profile-avatar-large {
            width: 100px;
            height: 100px;
            position: relative;
            margin-bottom: 10px;
        }
        .profile-stats {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-sec);
        }
        
        /* Gift Grid */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .gift-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .gift-item.selected {
            border-color: var(--accent);
            background: #fffbeb;
        }
        .gift-img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px; }

        .hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: 0; } }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="effectsLayer" class="overlay-layer"></div>

    <header class="header">
        <div class="room-info-card" onclick="openProfileById(roomOwnerId)">
            <div class="owner-avatar-wrapper">
                <img id="headerOwnerImg" src="https://via.placeholder.com/150" class="avatar-base">
                <div id="headerOwnerFrame" class="frame-overlay"></div>
            </div>
            <div>
                <div id="headerOwnerName" style="font-weight: 700; font-size: 14px;">...</div>
                <div style="font-size: 10px; color: var(--text-sec);">ID: <span id="headerOwnerId">...</span></div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="action-btn" style="width:35px; height:35px; background: #eee; color:#333;" onclick="window.history.back()">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </header>

    <div class="users-bar" id="usersBar">
        </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-msg-row">
            <div class="chat-bubble">
                <div class="msg-text">مرحباً بك في الغرفة! ابدأ المحادثة الآن.</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="input-wrapper">
            <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالة..." autocomplete="off">
        </div>
        
        <button id="giftBtn" class="action-btn" style="background: var(--accent);" onclick="openGiftSheet()">
            <i class="fa-solid fa-gift"></i>
        </button>
        
        <button id="sendBtn" class="action-btn hidden" style="background: var(--primary);" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </footer>
</div>

<div id="profileSheet" class="sheet-container">
    <div style="flex:1" onclick="closeSheet('profileSheet')"></div>
    <div class="sheet-content">
        <div class="profile-header">
            <div class="profile-avatar-large">
                <img id="p-img" src="" class="avatar-base">
                <div id="p-frame" class="frame-overlay"></div>
            </div>
            <h3 id="p-name" style="margin-bottom: 5px;">User Name</h3>
            <div id="p-id" style="color: var(--text-sec); font-size: 12px;">ID: 00000</div>
            
            <div class="profile-stats">
                <span id="p-followers">0 متابعين</span>
                <span id="p-following">0 يتابع</span>
            </div>

            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button id="followBtn" style="padding: 8px 25px; border-radius: 20px; border: none; background: var(--primary); color: #fff; font-weight: bold;">متابعة</button>
                <button onclick="mentionUser()" style="width: 40px; height: 35px; border-radius: 10px; border: 1px solid var(--border); background: #fff;"><i class="fa-solid fa-at"></i></button>
                <button onclick="giftUserFromProfile()" style="width: 40px; height: 35px; border-radius: 10px; border: 1px solid var(--border); background: #fff; color: var(--accent);"><i class="fa-solid fa-gift"></i></button>
            </div>
        </div>
    </div>
</div>

<div id="giftSheet" class="sheet-container">
    <div style="flex:1" onclick="closeSheet('giftSheet')"></div>
    <div class="sheet-content">
        <h4 style="text-align: center; margin-bottom: 10px;">إرسال هدية</h4>
        <div style="margin-bottom: 10px; font-size: 12px;">إلى: <b id="giftTargetName">الجميع</b></div>
        
        <div class="gifts-grid" id="giftsGrid">
            </div>

        <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 12px; font-weight: bold;">رصيدك: <span id="myBalance" style="color: var(--accent);">0</span></div>
            <button onclick="sendSelectedGift()" style="background: var(--accent); color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold;">إرسال</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, getDocs, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getDatabase, ref, push, onValue, set, onDisconnect, child, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
        authDomain: "rtx3090-28439.firebaseapp.com",
        projectId: "rtx3090-28439",
        storageBucket: "rtx3090-28439.firebasestorage.app",
        messagingSenderId: "178612030690",
        appId: "1:178612030690:web:883189ced2ed3a78e3e2bb",
        databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);

    // --- Global State ---
    let currentUser = null;
    let roomOwnerId = null;
    let storeData = { itemsById: {}, wealthLevels: {}, magicLevels: {} }; // For badges and SVGAs
    let currentProfileUser = null;
    let selectedGift = null;
    let giftRecipient = null; // null implies "everyone" or room owner if desired
    
    // URL Params
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id') || 'test-room';

    // --- SVGA Player Helper ---
    const svgaParser = new SVGA.Parser();
    function playSvga(url, targetDiv, isFullScreen = false, loops = 1) {
        if (!url) return;
        targetDiv.innerHTML = '';
        const player = new SVGA.Player(targetDiv);
        player.loops = loops;
        player.clearsAfterStop = !isFullScreen; // Keep frame, clear gift
        
        svgaParser.load(url, (videoItem) => {
            player.setVideoItem(videoItem);
            player.startAnimation();
            if(isFullScreen) {
                // Remove player div after animation
                player.onFinished(() => {
                    targetDiv.innerHTML = ''; 
                });
            }
        });
    }

    // --- Initialization ---
    async function init() {
        // 1. Load Store Data (Levels, Frames, Bubbles, Gifts)
        await loadStoreData();

        // 2. Auth Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Fetch user data
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    currentUser = { uid: snap.id, ...snap.data() };
                    document.getElementById('myBalance').innerText = (currentUser.balance || 0).toLocaleString();
                    checkEntranceEffect(); // Check if I should play my entrance effect
                });
                
                // Room Owner Logic (Assuming URL param ID is the owner)
                roomOwnerId = roomId; 
                loadRoomOwnerInfo(roomOwnerId);
                
                // Load Users
                loadUsersList();
                
                // Load Chat
                loadChat();

            } else {
                window.location.href = 'login.html';
            }
        });

        // 3. UI Listeners
        const input = document.getElementById('chatInput');
        input.addEventListener('input', (e) => {
            const hasText = e.target.value.trim().length > 0;
            document.getElementById('giftBtn').classList.toggle('hidden', hasText);
            document.getElementById('sendBtn').classList.toggle('hidden', !hasText);
        });
    }

    async function loadStoreData() {
        // Load items, levels, gifts to memory
        const itemsSnap = await getDocs(collection(db, "storeItems"));
        itemsSnap.forEach(d => { storeData.itemsById[d.id] = d.data(); });

        const wlSnap = await getDocs(collection(db, "wealthLevels"));
        wlSnap.forEach(d => { storeData.wealthLevels[d.data().level] = d.data(); });
        
        const mlSnap = await getDocs(collection(db, "magicLevels"));
        mlSnap.forEach(d => { storeData.magicLevels[d.data().level] = d.data(); });
        
        // Also load Gifts
        const giftSnap = await getDocs(collection(db, "gifts"));
        const grid = document.getElementById('giftsGrid');
        grid.innerHTML = '';
        giftSnap.forEach(d => {
            const g = { id: d.id, ...d.data() };
            // Append to Grid
            const el = document.createElement('div');
            el.className = 'gift-item';
            el.innerHTML = `
                <img src="${g.image || 'gift.png'}" class="gift-img">
                <div style="font-size:10px">${g.name}</div>
                <div style="font-size:10px;color:var(--accent)">${g.price}</div>
            `;
            el.onclick = () => {
                document.querySelectorAll('.gift-item').forEach(x => x.classList.remove('selected'));
                el.classList.add('selected');
                selectedGift = g;
            };
            grid.appendChild(el);
        });
    }

    // --- Logic Functions ---

    function loadRoomOwnerInfo(uid) {
        getDoc(doc(db, "users", uid)).then(snap => {
            if(snap.exists()) {
                const data = snap.data();
                document.getElementById('headerOwnerName').textContent = data.displayName;
                document.getElementById('headerOwnerId').textContent = uid.substring(0,6);
                document.getElementById('headerOwnerImg').src = data.photoURL;
                // Owner Frame
                if(data.activeFrame && storeData.itemsById[data.activeFrame]) {
                    const item = storeData.itemsById[data.activeFrame];
                    if(item.itemType === 'svga') {
                        playSvga(item.fileUrl, document.getElementById('headerOwnerFrame'), false, 0);
                    }
                }
            }
        });
    }

    function loadUsersList() {
        const usersRef = collection(db, "users");
        // For demo, fetching all. In production, use presence or subcollection
        getDocs(usersRef).then(snap => {
            const container = document.getElementById('usersBar');
            container.innerHTML = '';
            snap.forEach(docSnap => {
                const u = docSnap.data();
                const div = document.createElement('div');
                div.className = 'user-circle';
                div.onclick = () => openProfile(u, docSnap.id);
                
                let frameHtml = '';
                // Frame for user list
                const frameId = `frame-list-${docSnap.id}`;
                
                div.innerHTML = `
                    <div class="user-circle-img-box">
                        <img src="${u.photoURL}" class="avatar-base">
                        <div id="${frameId}" class="frame-overlay"></div>
                    </div>
                    <div class="user-name-micro">${u.displayName}</div>
                `;
                container.appendChild(div);

                // Play Frame SVGA
                if(u.activeFrame && storeData.itemsById[u.activeFrame]) {
                    const item = storeData.itemsById[u.activeFrame];
                    if(item.itemType === 'svga') {
                        setTimeout(() => playSvga(item.fileUrl, document.getElementById(frameId), false, 0), 500);
                    }
                }
            });
        });
    }

    // --- Chat & Effects ---
    
    function loadChat() {
        const chatRef = ref(rtdb, `roomChats/${roomId}/messages`);
        onValue(chatRef, (snapshot) => {
            const msgs = snapshot.val();
            if(!msgs) return;
            const container = document.getElementById('chatArea');
            container.innerHTML = ''; // Simplistic redraw. Optimize for real app.

            Object.values(msgs).forEach(msg => {
                renderMessage(msg, container);
            });
            container.scrollTop = container.scrollHeight;
        });
        
        // Listen for new child added specifically for effects (Car/Gift)
        // Note: onValue redraws everything, but we need effects to play once.
        // We use a separate listener or timestamp check for effects.
        // Implementation: Just checking the last message if it's new and an effect.
    }

    function renderMessage(msg, container) {
        // Logic to show gift animation if it's recent (handled separately usually, but here simple)
        if(msg.type === 'gift' && Date.now() - msg.timestamp < 3000) {
            // Trigger animation only if it's very recent (avoids replay on reload)
            // But better handled by child_added event.
        }

        const isMe = msg.senderId === currentUser.uid;
        const row = document.createElement('div');
        row.className = `chat-msg-row ${isMe ? 'me' : ''}`;

        // Prepare Avatar with Frame
        let avatarHtml = `
            <div class="chat-avatar-container" onclick="window.openProfileById('${msg.senderId}')">
                <img src="${msg.senderPhoto}" class="avatar-base">
                <div id="chat-frame-${msg.id}" class="frame-overlay"></div>
            </div>
        `;

        // Bubble Styling
        let bubbleStyle = '';
        let bubbleClass = 'chat-bubble';
        
        // Custom Bubble Logic
        if(msg.bubbleId && storeData.itemsById[msg.bubbleId]) {
            const bubbleItem = storeData.itemsById[msg.bubbleId];
            if(bubbleItem.image) {
                bubbleClass += ' custom-bubble';
                bubbleStyle = `background-image: url('${bubbleItem.image}');`;
            }
        }

        // Level Badges (Capped at 100)
        const wLvl = Math.min(msg.wealthLevel || 1, 100);
        const wBadgeUrl = storeData.wealthLevels[wLvl]?.icon || ''; // Get from stored data
        
        let badgesHtml = '';
        if(wBadgeUrl) badgesHtml += `<span class="level-badge"><img src="${wBadgeUrl}"></span>`;

        // Active Badges beside avatar
        if(msg.activeBadges) {
            // Logic to render active badges next to name
        }

        row.innerHTML = `
            ${avatarHtml}
            <div class="${bubbleClass}" style="${bubbleStyle}">
                <div class="msg-header" ${isMe ? 'style="justify-content: flex-end"' : ''}>
                    ${badgesHtml}
                    <span class="msg-name">${msg.senderName}</span>
                </div>
                <div class="msg-text">${msg.text}</div>
            </div>
        `;
        
        container.appendChild(row);

        // Sync Frame
        if(msg.frameId && storeData.itemsById[msg.frameId]) {
            setTimeout(() => {
                const el = document.getElementById(`chat-frame-${msg.id}`);
                if(el) playSvga(storeData.itemsById[msg.frameId].fileUrl, el, false, 0);
            }, 100);
        }
    }

    // --- Sending ---
    window.sendMessage = async () => {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;

        const msgData = {
            senderId: currentUser.uid,
            senderName: currentUser.displayName,
            senderPhoto: currentUser.photoURL,
            text: text,
            timestamp: Date.now(),
            wealthLevel: currentUser.wealthLevel || 1,
            frameId: currentUser.activeFrame || null,
            bubbleId: currentUser.activeBubble || null, // Bubble logic
            id: Date.now() + Math.random().toString() // unique ID for DOM
        };

        await push(ref(rtdb, `roomChats/${roomId}/messages`), msgData);
        input.value = '';
        document.getElementById('giftBtn').classList.remove('hidden');
        document.getElementById('sendBtn').classList.add('hidden');
    };

    // --- Gift Logic ---
    window.openGiftSheet = () => {
        giftRecipient = currentProfileUser || null; // If opened from profile, send to them, else everyone
        document.getElementById('giftTargetName').innerText = giftRecipient ? giftRecipient.displayName : "غرفة (المالك)";
        document.getElementById('giftSheet').classList.add('active');
    };

    window.sendSelectedGift = async () => {
        if(!selectedGift) return alert("اختر هدية");
        if(currentUser.balance < selectedGift.price) return alert("الرصيد غير كافي");

        // 1. Deduct Balance (Firestore)
        await updateDoc(doc(db, "users", currentUser.uid), {
            balance: increment(-selectedGift.price)
        });

        // 2. Add Wealth/Magic to Recipient (Firestore) - Logic simplified
        // ...

        // 3. Send Message to RTDB with type 'gift' to trigger animation
        const targetId = giftRecipient ? giftRecipient.uid : roomOwnerId;
        const targetName = giftRecipient ? giftRecipient.displayName : "المالك";
        
        const giftMsg = {
            type: 'gift',
            giftId: selectedGift.id,
            giftUrl: selectedGift.svgaUrl || selectedGift.image, // Prefer SVGA
            isSvga: !!selectedGift.svgaUrl,
            senderId: currentUser.uid,
            senderPhoto: currentUser.photoURL,
            receiverId: targetId,
            receiverName: targetName,
            price: selectedGift.price,
            text: `أرسل ${selectedGift.name}`,
            timestamp: Date.now()
        };

        await push(ref(rtdb, `roomChats/${roomId}/messages`), giftMsg);
        
        closeSheet('giftSheet');
    };

    // --- Animation Handling (Listener) ---
    const roomRef = ref(rtdb, `roomChats/${roomId}/messages`);
    // Listen for new additions to play animations
    onDisconnect(roomRef).cancel(); // cleanup
    
    // We use a query to limit only to new messages (simplified here via timestamp check in a real child_added)
    // Here using child_added effectively:
    let initialLoad = true;
    setTimeout(() => { initialLoad = false; }, 2000); // Ignore old messages

    import { query as rQuery, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const newMsgQuery = rQuery(ref(rtdb, `roomChats/${roomId}/messages`), limitToLast(1));

    onChildAdded(newMsgQuery, (snap) => {
        if(initialLoad) return;
        const msg = snap.val();
        
        // 1. Gift Animation
        if(msg.type === 'gift') {
            playGiftAnimation(msg);
        }
        
        // 2. Entrance Animation (If message type is 'entrance')
        if(msg.type === 'entrance') {
            playEntranceCar(msg.svgaUrl);
        }
    });

    function playGiftAnimation(msg) {
        // A. Fly Animation
        const senderEl = document.querySelector(`img[src="${msg.senderPhoto}"]`); // Rough finder
        // In real app, find sender avatar rect and receiver avatar rect
        
        const startX = window.innerWidth / 2; // Fallback
        const startY = window.innerHeight - 100;
        
        const flyer = document.createElement('div');
        flyer.className = 'flying-gift';
        flyer.style.left = startX + 'px';
        flyer.style.top = startY + 'px';
        flyer.innerHTML = `
            <img src="${msg.isSvga ? 'gift_icon_placeholder.png' : msg.giftUrl}">
            <div class="flying-info">x1 ${msg.price}</div>
        `;
        document.body.appendChild(flyer);

        // Move to center
        setTimeout(() => {
            flyer.style.transform = `translateY(-${window.innerHeight/2}px) scale(1.5)`;
            flyer.style.opacity = '1';
        }, 50);

        // B. Full Screen SVGA
        if(msg.isSvga) {
            setTimeout(() => {
                const layer = document.getElementById('effectsLayer');
                const div = document.createElement('div');
                div.className = 'svga-fullscreen';
                layer.appendChild(div);
                playSvga(msg.giftUrl, div, true, 1);
                flyer.remove();
            }, 800);
        } else {
            setTimeout(() => flyer.remove(), 2000);
        }
    }

    function checkEntranceEffect() {
        // Runs once on load
        if(currentUser && currentUser.entranceCar) {
            const item = storeData.itemsById[currentUser.entranceCar];
            if(item && item.fileUrl) {
                // Send 'entrance' signal to room
                push(ref(rtdb, `roomChats/${roomId}/messages`), {
                    type: 'entrance',
                    senderId: currentUser.uid,
                    svgaUrl: item.fileUrl,
                    timestamp: Date.now()
                });
            }
        }
    }
    
    function playEntranceCar(url) {
        const layer = document.getElementById('effectsLayer');
        const div = document.createElement('div');
        div.className = 'svga-fullscreen';
        layer.appendChild(div);
        playSvga(url, div, true, 1);
    }

    // --- Profile & UI Helpers ---
    window.openProfile = (user, uid) => {
        currentProfileUser = {uid, ...user};
        document.getElementById('p-name').textContent = user.displayName;
        document.getElementById('p-id').textContent = "ID: " + uid.substring(0,8);
        document.getElementById('p-img').src = user.photoURL;
        document.getElementById('p-followers').textContent = (user.friends?.length || 0) + " متابعين";
        
        // Profile Frame
        if(user.activeFrame && storeData.itemsById[user.activeFrame]) {
            const item = storeData.itemsById[user.activeFrame];
            playSvga(item.fileUrl, document.getElementById('p-frame'), false, 0);
        } else {
            document.getElementById('p-frame').innerHTML = '';
        }

        document.getElementById('profileSheet').classList.add('active');
    };

    window.openProfileById = (uid) => {
        // Fetch specific user then open
        getDoc(doc(db, "users", uid)).then(snap => {
            if(snap.exists()) window.openProfile(snap.data(), snap.id);
        });
    };

    window.closeSheet = (id) => {
        document.getElementById(id).classList.remove('active');
        if(id === 'profileSheet') currentProfileUser = null;
    };

    window.mentionUser = () => {
        if(currentProfileUser) {
            document.getElementById('chatInput').value = `@${currentProfileUser.displayName} `;
            closeSheet('profileSheet');
        }
    };
    
    window.giftUserFromProfile = () => {
        if(currentProfileUser) {
            giftRecipient = currentProfileUser;
            closeSheet('profileSheet');
            openGiftSheet();
        }
    };

    // Start
    init();

</script>
</body>
</html>
