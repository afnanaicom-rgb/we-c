                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    userData = { uid: userSnap.id, ...userSnap.data() };
                    onSnapshot(userDocRef, async (docSnap) => {
                        if (docSnap.exists()) {
                            userData = { uid: docSnap.id, ...docSnap.data() };
                            updateUI();
                        }
                    });
                    await loadGlobalData();
                    
                    // Check if we're in a room from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const roomId = urlParams.get('id');
                    if (roomId) {
                        await joinRoom(roomId);
                    } else {
                        showHomeView();
                    }
                } else {
                    alert('هذا الحساب غير مسجل في النظام. يرجى التواصل مع الإدارة.');
                    await signOut(auth);
                    window.location.href = "login.html";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadGlobalData() {
            // Load all store data as before
            const storeSnap = await getDocs(collection(db, "storeItems"));
            storeData.items = storeSnap.docs.map(d => ({id: d.id, ...d.data()}));
            storeData.itemsById = {};
            storeData.items.forEach(item => { storeData.itemsById[item.id] = item; });
            
            const gSnap = await getDocs(collection(db, "gifts"));
            storeData.gifts = gSnap.docs.map(d => ({id: d.id, ...d.data(), type: 'wealth'}));
            
            const lgSnap = await getDocs(collection(db, "luckGifts"));
            storeData.luckGifts = lgSnap.docs.map(d => ({id: d.id, ...d.data(), type: 'magic'}));
            
            const mlSnap = await getDocs(collection(db, "magicLevels"));
            mlSnap.docs.forEach(d => storeData.magicLevels[d.id] = d.data());
            
            const wlSnap = await getDocs(collection(db, "wealthLevels"));
            wlSnap.docs.forEach(d => storeData.wealthLevels[d.id] = d.data());
            
            const cbSnap = await getDocs(collection(db, "chatBubbles"));
            storeData.chatBubbles = cbSnap.docs.map(d => ({id: d.id, ...d.data()}));
            
            updateUI();

        async function joinRoom(roomId) {
            try {
                // Get room data
                const roomDoc = await getDoc(doc(db, "rooms", roomId));
                if (!roomDoc.exists()) {
                    alert('الغرفة غير موجودة');
                    showHomeView();
                    return;
                }
                
                currentRoom = { id: roomId, ...roomDoc.data() };
                
                // Check if user is banned
                if (currentRoom.bannedUsers && currentRoom.bannedUsers.includes(userData.uid)) {
                    alert('أنت محظور من هذه الغرفة');
                    showHomeView();
                    return;
                }
                
                // Show room view
                showRoomView();
                
                // Update room UI
                document.getElementById('room-name').innerText = currentRoom.name;
                document.getElementById('room-content').style.backgroundImage = `url('${currentRoom.background || ''}')`;
                document.getElementById('room-content').style.backgroundSize = 'cover';
                document.getElementById('room-content').style.backgroundPosition = 'center';
                
                // Show admin controls if user is owner or admin
                const adminControls = document.getElementById('admin-controls');
                if (currentRoom.owner === userData.uid || (currentRoom.admins && currentRoom.admins.includes(userData.uid))) {
                    adminControls.classList.remove('hidden');
                } else {
                    adminControls.classList.add('hidden');
                }
                
                // Subscribe to room messages
                listenToRoomMessages();
                
                // Update online users
                updateOnlineUsers();
                
                // Join room in realtime database
                const userPresenceRef = ref(rtdb, `roomPresence/${roomId}/${userData.uid}`);
                await set(userPresenceRef, {
                    uid: userData.uid,
                    name: userData.displayName,
                    photoURL: userData.photoURL,
                    activeFrame: userData.activeFrame,
                    activeBadges: userData.activeBadges || [],
                    joinedAt: Date.now()
                });
                
                // Remove user when they leave
                window.addEventListener('beforeunload', () => {
                    remove(userPresenceRef);
                });
                
            } catch (error) {
                console.error('Error joining room:', error);
                alert('حدث خطأ أثناء الانضمام للغرفة');
            }
        }

        function listenToRoomMessages() {
            if (roomUnsubscribe) roomUnsubscribe();
            
            const messagesRef = ref(rtdb, `roomMessages/${currentRoom.id}`);
            roomUnsubscribe = onValue(messagesRef, (snapshot) => {
                const messages = snapshot.val();
                const container = document.getElementById('room-chat-messages');
                container.innerHTML = '';
                
                if (messages) {
                    Object.values(messages).sort((a, b) => a.timestamp - b.timestamp).forEach(msg => {
                        const isMe = msg.senderId === userData.uid;
                        const messageElement = createRoomMessageElement(msg, isMe);
                        container.appendChild(messageElement);
                    });
                    
                    container.scrollTop = container.scrollHeight;
                }
            });
        }

        function createRoomMessageElement(msg, isMe) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `mb-4 ${isMe ? 'text-left' : 'text-right'}`;
            
            if (msg.type === 'gift') {
                messageDiv.innerHTML = `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="gift-message max-w-[80%]">
                            <div class="gift-message-icon">
                                <img src="${msg.giftImage}" class="w-full h-full object-contain">
                            </div>
                            <p class="text-xs font-bold text-gray-800 mb-1">🎁 ${msg.giftName}</p>
                            <p class="text-[10px] text-gray-600">
                                ${isMe ? 'لقد أرسلت هدية' : `${msg.senderName} أرسل هدية`}
                            </p>
                        </div>
                    </div>
                `;
            } else {
                const senderBadges = msg.senderBadges || [];
                let badgesHTML = '';
                
                if (senderBadges.length > 0) {
                    const visibleBadges = senderBadges.slice(0, 3);
                    badgesHTML = `
                        <div class="sender-badges">
                            ${visibleBadges.map(badgeId => {
                                const badge = storeData.itemsById[badgeId];
                                if (badge) {
                                    if (badge.itemType === 'svga') {
                                        return `<div class="sender-badge" id="room-badge-${badgeId}-${msg.senderId}"></div>`;
                                    } else {
                                        return `<img src="${badge.image}" class="sender-badge object-contain" title="${badge.name}">`;
                                    }
                                }
                                return '';
                            }).join('')}
                            ${senderBadges.length > 3 ? '<div class="more-badges">+' + (senderBadges.length - 3) + '</div>' : ''}
                        </div>
                    `;
                }
                
                const bubbleClass = isMe ? 'chat-bubble-me' : 'chat-bubble-them';
                const timestampClass = isMe ? '' : 'them';
                
                messageDiv.innerHTML = `
                    <div class="relative">
                        <div class="chat-sender-info ${isMe ? 'me' : ''}">
                            <div class="sender-avatar-wrapper cursor-pointer" onclick="openUserProfile('${msg.senderId}')">
                                <img src="${msg.senderPhoto}" class="sender-avatar">
                            </div>
                            <span class="sender-name">
                                ${msg.senderName}
                                ${badgesHTML}
                            </span>
                        </div>
                        <div class="${bubbleClass}">
                            ${msg.text}
                            <div class="chat-timestamp ${timestampClass}">
                                ${new Date(msg.timestamp).toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})}
                            </div>
                        </div>
                    </div>
                `;
                
                // Load SVGA badges if any
                if (senderBadges.length > 0) {
                    setTimeout(() => {
                        senderBadges.slice(0, 3).forEach(badgeId => {
                            const badge = storeData.itemsById[badgeId];
                            if (badge && badge.itemType === 'svga' && badge.fileUrl) {
                                const container = document.getElementById(`room-badge-${badgeId}-${msg.senderId}`);
                                if (container) {
                                    playSvga(badge.fileUrl, container, { loops: 1, clearsAfterStop: false });
                                }
                            }
                        });
                    }, 100);
                }
            }
            
            return messageDiv;
        }

        window.sendRoomGift = async function(giftId, giftType) {
            if (!currentRoom) {
                alert('يجب أن تكون في غرفة أولاً');
                return;
            }
            
            const targetUserId = currentProfileUser ? currentProfileUser.uid : null;
            if (!targetUserId) {
                alert('يجب تحديد مستخدم لإرسال الهدية له');
                return;
            }
            
            const giftList = giftType === 'magic' ? storeData.luckGifts : storeData.gifts;
            const gift = giftList.find(g => g.id === giftId);
            
            if (userData.balance < (gift.price || 0)) {
                alert('رصيدك غير كافٍ!');
                return;
            }
            
            // Deduct balance
            await updateDoc(doc(db, "users", userData.uid), {
                balance: increment(-(gift.price || 0))
            });
            
            // Send gift message to room
            const messagesRef = ref(rtdb, `roomMessages/${currentRoom.id}`);
            await push(messagesRef, {
                senderId: userData.uid,
                senderName: userData.displayName,
                senderPhoto: userData.photoURL,
                receiverId: targetUserId,
                receiverName: currentProfileUser.displayName,
                giftId: gift.id,
                giftName: gift.name,
                giftImage: gift.image,
                giftType: gift.type,
                type: 'gift',
                timestamp: Date.now()
            });
            
            // Update receiver's data
            const receiverRef = doc(db, "users", targetUserId);
            if (giftType === 'magic') {
                await updateDoc(receiverRef, {
                    jewels: increment(10),
                    balance: increment(gift.reward || 0)
                });
            } else if (giftType === 'wealth') {
                await updateDoc(receiverRef, {
                    wealthLevel: increment(gift.reward || 1),
                    balance: increment(gift.reward || 0)
                });
            }
            
            // Show animation
            showGiftAnimation(gift);
            
            // Close gift box
            toggleRoomGiftBox();
        };

        // SVGA Player Functions (keep from original)
        function playSvga(url, container, options = {}) {
            try {
                container.innerHTML = '';
                const player = new SVGA.Player(container);
                const parser = new SVGA.Parser();
                parser.load(url, (videoItem) => {
                    player.setVideoItem(videoItem);
                    player.loops = options.loops || 0;
                    player.clearsAfterStop = options.clearsAfterStop || false;
                    player.startAnimation();
                    setTimeout(() => {
                        const canvas = container.querySelector('canvas');
                        if (canvas) { 
                            canvas.classList.add('vga-player-canvas'); 
                            canvas.style.objectFit = 'contain'; 
                            canvas.style.display = 'block'; 
                        }
                    }, 50);
                    const id = 'player_' + Date.now();
                    activeSvgaPlayers[id] = { player, container };
                    container.dataset.playerId = id;
                }, (error) => { 
                    container.innerHTML = '<div class="text-center text-xs text-gray-400 p-2">SVGA</div>'; 
                });
            } catch (error) { 
                container.innerHTML = '<div class="text-center text-xs text-gray-400 p-2">SVGA</div>'; 
            }
        }
