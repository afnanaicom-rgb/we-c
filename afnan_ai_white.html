        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Noto Sans Arabic', sans-serif; touch-action: manipulation }
        body { background: radial-gradient(circle at 0% 0%, #eef2ff 0%, #fdf2f8 50%, #f0f9ff 100%); color: #1f2937; overflow-x: hidden; min-height: 100vh }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04), 0 2px 4px -1px rgba(0,0,0,0.02), inset 0 1px 0 0 rgba(255, 255, 255, 0.4) }

        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.15); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s ease }

        .avatar-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; overflow: visible }

        .svga-avatar-frame { position: absolute; pointer-events: none; z-index: 2; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: frameFloat 3s ease-in-out infinite; overflow: visible; width: calc(100% + 16px); height: calc(100% + 16px); top: 50%; left: 50%; transform: translate(-50%, -50%) }
        .svga-avatar-frame canvas { border-radius: 50%; object-fit: contain; width: 100%!important; height: 100%!important; position: absolute!important; top: 50%!important; left: 50%!important; transform: translate(-50%, -50%)!important; max-width: 100%!important; max-height: 100%!important; min-width: 100%!important; min-height: 100%!important; z-index: 2 }
        .perfect-frame { position: absolute; pointer-events: none; z-index: 2; object-fit: contain; border-radius: 50%; animation: frameFloat 3s ease-in-out infinite; width: calc(100% + 16px); height: calc(100% + 16px); top: 50%; left: 50%; transform: translate(-50%, -50%) }
        @keyframes frameFloat { 0%, 100% { transform: translate(-50%, -50%) scale(1) } 50% { transform: translate(-50%, -50%) scale(1.05) } }
        .no-scrollbar::-webkit-scrollbar { display: none }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none }
        .banner-container { height: 120px; margin-top: 20px }
        .header-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8) }
        .svga-player-canvas { width: 100%!important; height: 60%!important; transform: translateX(25px)!important; z-index: 2; margin: auto; position: relative!important; top: 0!important; left: 0!important }
        .buy-btn { width: 90%; margin: 0 auto; padding: 8px; border: none; border-radius: 6px; background: #000; color: #fff; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: all 0.3s ease }
        .buy-btn:hover { background: #333; transform: translateY(-2px) }
        .buy-btn:active { transform: scale(0.98) }
        .buy-btn:disabled { background: #ccc; cursor: not-allowed; transform: none }
        .frame-size-small .svga-avatar-frame, .frame-size-small .perfect-frame { width: calc(100% + 8px); height: calc(100% + 8px) }
        .frame-size-medium .svga-avatar-frame, .frame-size-medium .perfect-frame { width: calc(100% + 16px); height: calc(100% + 16px) }
        .frame-size-large .svga-avatar-frame, .frame-size-large .perfect-frame { width: calc(100% + 24px); height: calc(100% + 24px) }
        .frame-size-xl .svga-avatar-frame, .frame-size-xl .perfect-frame { width: calc(100% + 32px); height: calc(100% + 32px) }
        .badges-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center }

        let userData = {};

        function calculateLevel(totalPoints) {
            let lvl = 1, needed = 30000, temp = totalPoints;
            while (temp >= needed && lvl < 100) { temp -= needed; lvl++; needed = (lvl === 100) ? needed * 2 : needed * 1.3; }
            return lvl;
        }

        async function saveActiveState(type, id) {
            if (!userData.uid) return;
            const expiry = Date.now() + (24 * 60 * 60 * 1000);
            let activeItems = JSON.parse(localStorage.getItem('active_items_' + userData.uid) || '{}');
            if (id === null) delete activeItems[type]; else activeItems[type] = { id, expiry };
            localStorage.setItem('active_items_' + userData.uid, JSON.stringify(activeItems));
            await updateDoc(doc(db, 'users', userData.uid), { [`last_active_${type}`]: id, [`expiry_active_${type}`]: id ? expiry : null });
        }

        async function restoreActiveState() {
            if (!userData.uid) return;
            const now = Date.now();
            const types = ['frame', 'svga', 'chatbubble'];
            for (const type of types) {
                const fId = userData[`last_active_${type}`];
                const fExp = userData[`expiry_active_${type}`];
                if (fId && fExp && fExp > now) { if (type === 'frame' || type === 'svga') userData.activeFrame = fId; }
                else if (fExp && fExp <= now) { await updateDoc(doc(db, 'users', userData.uid), { [`last_active_${type}`]: null, [`expiry_active_${type}`]: null }); }
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                let userDocRef = doc(db, "users", user.uid);
                let userSnap = await getDoc(userDocRef);
                if (!userSnap.exists()) {
                    const q = query(collection(db, "users"), where("email", "==", user.email));
                    const qSnap = await getDocs(q);
                    if (!qSnap.empty) { userDocRef = doc(db, "users", qSnap.docs[0].id); userSnap = await getDoc(userDocRef); }
                }
                if (userSnap.exists()) {
                    userData = { uid: userSnap.id, ...userSnap.data() };
                    await restoreActiveState();
                    onSnapshot(userDocRef, (docSnap) => { if (docSnap.exists()) { userData = { uid: docSnap.id, ...docSnap.data() }; updateUI(); } });
                    await loadBanner();
                    await loadGlobalData();
                    await loadRooms();
                } else { window.location.href = "login.html"; }
            } else { window.location.href = "login.html"; }
        });

        async function loadGlobalData() {
            const storeSnap = await getDocs(collection(db, "storeItems"));
            storeData.items = storeSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            storeData.items.forEach(item => { storeData.itemsById[item.id] = item; });
            const mlSnap = await getDocs(collection(db, "magicLevels"));
            mlSnap.docs.forEach(d => storeData.magicLevels[d.id] = d.data());
            const wlSnap = await getDocs(collection(db, "wealthLevels"));
            wlSnap.docs.forEach(d => storeData.wealthLevels[d.id] = d.data());
            updateUI();
        }

        function updateUI() {
            if (!userData.uid) return;
            document.getElementById('sideName').innerText = userData.displayName || "مستخدم";
            document.getElementById('sideEmail').innerText = userData.email || "لا يوجد بريد";
            document.getElementById('sideAvatar').src = userData.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('walletAmount').innerText = (userData.balance || 0).toLocaleString();
            const magicLvl = calculateLevel(userData.magicPoints || 0);
            const wealthLvl = calculateLevel(userData.wealthPoints || 0);
            document.getElementById('sideMagicLevelText').innerText = `LVL ${magicLvl}`;
            document.getElementById('sideWealthLevelText').innerText = `LVL ${wealthLvl}`;
            if (storeData.magicLevels[magicLvl]) document.getElementById('magicLevelImg').src = storeData.magicLevels[magicLvl].image;
            if (storeData.wealthLevels[wealthLvl]) document.getElementById('wealthLevelImg').src = storeData.wealthLevels[wealthLvl].image;
            const frameEl = document.getElementById('sideFrame');
            const svgaCont = document.getElementById('sideSvgaFrame');
            frameEl.classList.add('hidden'); svgaCont.classList.add('hidden'); svgaCont.innerHTML = '';
            if (userData.activeFrame) {
                const item = storeData.itemsById[userData.activeFrame];
                if (item) {
                    if (item.itemType === 'svga') { svgaCont.classList.remove('hidden'); playSvga(item.fileUrl, svgaCont); }
                    else { frameEl.src = item.image; frameEl.classList.remove('hidden'); }
                }
            }
            const sidebarBadges = document.getElementById('sidebarActiveBadges');
            sidebarBadges.innerHTML = '';
            if (userData.activeBadges) {
                userData.activeBadges.forEach(badgeId => {
                    const badge = storeData.itemsById[badgeId];
                    if (badge) sidebarBadges.innerHTML += `<img src="${badge.image}" class="w-8 h-8 object-contain">`;
                });
            }
            lucide.createIcons();
        }

        async function uploadToSupabase(file, path) {
            if (!supabase) return null;
            const fileName = `${Date.now()}-${file.name}`;
            const { data, error } = await supabase.storage.from('uploads').upload(`${path}/${fileName}`, file);
            if (error) return null;
            const { data: urlData } = supabase.storage.from('uploads').getPublicUrl(`${path}/${fileName}`);
            return urlData.publicUrl;
        }

        window.saveProfileChanges = async () => {
            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true; btn.innerText = "جاري الحفظ...";
            const name = document.getElementById('editNameInp').value;
            const file = document.getElementById('editPhotoFile').files[0];
            let photoURL = userData.photoURL;
            if (file) { const url = await uploadToSupabase(file, 'profiles'); if (url) photoURL = url; }
            await updateDoc(doc(db, "users", userData.uid), { displayName: name, photoURL });
            btn.disabled = false; btn.innerText = "حفظ";
            closeEditModal();
        };

        window.loadStoreItems = (type) => {
            const grid = document.getElementById('storeGrid');
            grid.innerHTML = '';
            let items = storeData.items.filter(item => item.type === type);
            const tabs = ['frame', 'badge', 'svga', 'chatbubble'];
            tabs.forEach(t => {
                const el = document.getElementById('store-tab-' + (t === 'frame' ? 'frames' : t === 'badge' ? 'badges' : t));
                if (el) el.className = (type === t) ? 'flex-none px-6 py-2.5 bg-gray-900 text-white rounded-full font-bold text-sm shadow-lg transition' : 'flex-none px-6 py-2.5 glass-card text-gray-600 rounded-full font-bold text-sm hover:bg-white transition';
            });
            items.forEach(item => {
                let field = type === 'frame' ? 'purchasedFrames' : type === 'badge' ? 'purchasedBadges' : type === 'svga' ? 'purchasedSvga' : 'purchasedChatBubbles';
                const owned = userData[field]?.some(i => i.id === item.id);
                let preview = item.itemType === 'svga' ? `<div class="w-16 h-16 mb-2" id="store-p-${item.id}"></div>` : `<img src="${item.image}" class="w-16 h-16 object-contain mb-2">`;
                grid.innerHTML += `<div class="glass-card p-4 rounded-3xl flex flex-col items-center justify-between min-h-[180px] relative">${preview}<h4 class="font-bold text-sm text-center mb-2">${item.name}</h4><button onclick="${owned ? '' : `buyItem('${type}','${item.id}',${item.price})`}" class="buy-btn ${owned ? 'bg-gray-100 text-gray-400' : 'bg-black text-white'}">${owned ? 'مملوك' : `${item.price} 💰 شراء`}</button></div>`;
                if (item.itemType === 'svga') setTimeout(() => playSvga(item.fileUrl, document.getElementById(`store-p-${item.id}`)), 100);
            });
        };

        window.buyItem = async (type, id, price) => {
            if ((userData.balance || 0) < price) return alert('رصيدك غير كافٍ!');
            let field = type === 'frame' ? 'purchasedFrames' : type === 'badge' ? 'purchasedBadges' : type === 'svga' ? 'purchasedSvga' : 'purchasedChatBubbles';
            await updateDoc(doc(db, "users", userData.uid), { balance: increment(-price), [field]: arrayUnion({ id, purchasedAt: new Date() }) });
            alert('تم الشراء!'); loadStoreItems(type);
        };

        window.loadBagItems = () => {
            const ids = ['bagGrid', 'badgesBagGrid', 'svgaBagGrid', 'chatbubblesBagGrid'];
            ids.forEach(id => document.getElementById(id).innerHTML = '');
            const frames = userData.purchasedFrames || [];
            frames.forEach(f => {
                const item = storeData.itemsById[f.id];
                if (item) {
                    const isEq = userData.activeFrame === f.id;
                    const div = document.createElement('div');
                    div.onclick = () => equipFrame(f.id);
                    div.className = `p-3 rounded-2xl glass-card flex flex-col items-center justify-center cursor-pointer ${isEq ? 'border-2 border-black' : ''}`;
                    if (item.itemType === 'svga') { div.innerHTML = `<div class="w-12 h-12" id="bag-f-${f.id}"></div>`; setTimeout(() => playSvga(item.fileUrl, document.getElementById(`bag-f-${f.id}`)), 100); }
                    else div.innerHTML = `<img src="${item.image}" class="w-12 h-12 object-contain">`;
                    document.getElementById('bagGrid').appendChild(div);
                }
            });
            const badges = userData.purchasedBadges || [];
            badges.forEach(b => {
                const item = storeData.itemsById[b.id];
                if (item) {
                    const isAc = userData.activeBadges?.includes(b.id);
                    document.getElementById('badgesBagGrid').innerHTML += `<div onclick="toggleBadge('${b.id}')" class="p-2 rounded-xl glass-card cursor-pointer ${isAc ? 'border-2 border-black' : ''}"><img src="${item.image}" class="w-8 h-8 object-contain"></div>`;
                }
            });
        };

        window.equipFrame = async (id) => { const n = userData.activeFrame === id ? null : id; await saveActiveState("frame", n); await updateDoc(doc(db, "users", userData.uid), { activeFrame: n }); loadBagItems(); };
        window.toggleBadge = async (id) => { const isAc = userData.activeBadges?.includes(id); await updateDoc(doc(db, "users", userData.uid), { activeBadges: isAc ? arrayRemove(id) : arrayUnion(id) }); loadBagItems(); };

        window.toggleSidebar = (s) => { document.getElementById('sidebar').classList.toggle('open', s); document.getElementById('sidebarOverlay').classList.toggle('hidden', !s); };
        window.switchView = (v) => { document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden')); document.getElementById('view-' + v).classList.remove('hidden'); if (v === 'bag') loadBagItems(); if (v === 'store') loadStoreItems('frame'); toggleSidebar(false); };
        window.confirmLogout = () => { if (confirm('خروج؟')) signOut(auth); };
        window.openEditProfile = () => { document.getElementById('editNameInp').value = userData.displayName; document.getElementById('editModal').classList.remove('hidden'); toggleSidebar(false); };
        window.closeEditModal = () => document.getElementById('editModal').classList.add('hidden');
        window.copyEmail = () => { navigator.clipboard.writeText(userData.email); alert('تم النسخ'); };
        window.recharge = async (a) => { await updateDoc(doc(db, "users", userData.uid), { balance: increment(a) }); };

        async function loadBanner() {
            const bSnap = await getDocs(collection(db, "appData", "banner", "items"));
            const wrapper = document.getElementById('bannerWrapper');
            wrapper.innerHTML = '';
            bSnap.forEach(d => { wrapper.innerHTML += `<div class="swiper-slide"><img src="${d.data().image}"></div>`; });
            new Swiper(".mySwiper", { loop: true, autoplay: { delay: 3000 } });
        }

        async function loadRooms() {
            const rSnap = await getDocs(collection(db, "rooms"));
            const grid = document.getElementById('roomsGrid');
            const roomsRef = ref(rtdb, 'rooms');
            onValue(roomsRef, (snap) => {
                const rtdbRooms = snap.val() || {};
                const rooms = rSnap.docs.map(d => ({ id: d.id, ...d.data(), count: rtdbRooms[d.id]?.users ? Object.keys(rtdbRooms[d.id].users).length : 0 }));
                rooms.sort((a, b) => b.count - a.count);
                grid.innerHTML = '';
                rooms.forEach(r => {
                    grid.innerHTML += `<div onclick="window.location.href='room.html?id=${r.id}'" class="glass-card p-4 rounded-3xl flex items-center gap-4 cursor-pointer hover:bg-white transition"><div class="w-12 h-12 rounded-full ${r.color || 'bg-blue-500'} flex items-center justify-center text-xl">${r.icon || '🏠'}</div><div class="flex-1"><h4 class="font-bold">${r.name}</h4></div><div class="bg-green-50 px-2 py-1 rounded-lg text-[10px] font-bold text-green-600">${r.count}</div></div>`;
                });
            });
        }

        window.openMyRoom = async () => {
            const q = query(collection(db, "rooms"), where("owner", "==", userData.uid));
            const snap = await getDocs(q);
            if (snap.empty) { await setDoc(doc(db, "rooms", userData.uid), { owner: userData.uid, name: `غرفة ${userData.displayName}`, icon: '🏠', color: 'bg-blue-500' }); window.location.href = `room.html?id=${userData.uid}`; }
            else { window.location.href = `room.html?id=${snap.docs[0].id}`; }
        };

        function playSvga(url, container) { const player = new SVGA.Player(container); const parser = new SVGA.Parser(); parser.load(url, (v) => { player.setVideoItem(v); player.startAnimation(); }); }
        lucide.createIcons();
    </script>
</body>
</html>
