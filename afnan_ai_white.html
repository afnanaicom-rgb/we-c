<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afnan Chat - الغرف</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.1/build/svga.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Noto Sans Arabic', sans-serif; touch-action: manipulation; margin: 0; padding: 0; }
        body { background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%); color: #ffffff; min-height: 100vh; overflow-x: hidden; }
        
        /* Stars Background */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 0; }
        .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
        
        /* Glass Effect */
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-dark { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Header */
        .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 70px; z-index: 100; }
        .online-users { display: flex; gap: 8px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
        .online-users::-webkit-scrollbar { display: none; }
        .online-user { position: relative; flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; }
        .online-user img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid transparent; transition: all 0.3s; }
        .online-user.active img { border-color: #9333ea; box-shadow: 0 0 15px rgba(147, 51, 234, 0.5); }
        .online-indicator { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #22c55e; border-radius: 50%; border: 2px solid #0a0a0a; }
        
        /* Chat Area */
        .chat-container { position: fixed; top: 70px; left: 0; right: 0; bottom: 80px; overflow-y: auto; padding: 16px; z-index: 10; }
        .chat-container::-webkit-scrollbar { width: 4px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(147, 51, 234, 0.3); border-radius: 2px; }
        
        /* Chat Bubbles */
        .chat-message { margin-bottom: 16px; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .message-avatar-wrapper { position: relative; width: 40px; height: 40px; flex-shrink: 0; cursor: pointer; }
        .message-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); }
        .message-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% + 10px); height: calc(100% + 10px); pointer-events: none; z-index: 2; }
        
        .message-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .message-name { font-weight: 600; font-size: 13px; color: #fff; }
        .message-badges { display: flex; gap: 2px; }
        .message-badge { width: 18px; height: 18px; border-radius: 4px; overflow: hidden; }
        .message-badge img, .message-badge canvas { width: 100%; height: 100%; object-fit: contain; }
        .more-badges { font-size: 10px; color: rgba(255,255,255,0.5); padding: 0 4px; }
        
        .message-bubble { 
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2), rgba(59, 130, 246, 0.2)); 
            border-radius: 16px 16px 16px 4px; 
            padding: 12px 16px; 
            margin-right: 48px; 
            border: 1px solid rgba(147, 51, 234, 0.3);
            position: relative;
            word-wrap: break-word;
        }
        .message-bubble.mine { 
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(21, 128, 61, 0.2)); 
            border-color: rgba(34, 197, 94, 0.3);
            border-radius: 16px 16px 4px 16px;
            margin-right: 0;
            margin-left: 48px;
        }
        .message-bubble.with-chat-bubble { border: none; background: transparent; }
        
        .message-text { font-size: 14px; line-height: 1.6; color: #fff; }
        .message-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; text-align: left; }
        
        /* Gift Message */
        .gift-message { background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.2)); border: 1px solid rgba(251, 191, 36, 0.4); }
        .gift-content { display: flex; align-items: center; gap: 12px; }
        .gift-icon { width: 48px; height: 48px; }
        .gift-icon img { width: 100%; height: 100%; object-fit: contain; }
        
        /* Bottom Bar */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; z-index: 100; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
        .exit-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); display: flex; align-items: center; justify-content: center; color: #ef4444; cursor: pointer; transition: all 0.3s; }
        .exit-btn:hover { background: rgba(239, 68, 68, 0.3); }
        .input-wrapper { flex: 1; position: relative; }
        .message-input { width: 100%; height: 48px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 0 56px 0 20px; color: #fff; font-size: 14px; outline: none; transition: all 0.3s; }
        .message-input:focus { background: rgba(255,255,255,0.12); border-color: rgba(147, 51, 234, 0.5); }
        .message-input::placeholder { color: rgba(255,255,255,0.4); }
        .action-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; border: none; }
        .gift-btn { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; }
        .gift-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); }
        .send-btn { background: linear-gradient(135deg, #9333ea, #7c3aed); color: #fff; }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4); }
        
        /* User Profile Bottom Sheet */
        .profile-sheet { position: fixed; bottom: 0; left: 0; right: 0; height: 60vh; background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%); border-radius: 24px 24px 0 0; z-index: 200; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .profile-sheet.open { transform: translateY(0); }
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .sheet-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 12px auto; }
        .sheet-content { padding: 20px; height: calc(100% - 28px); overflow-y: auto; }
        
        .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
        .profile-avatar-large { position: relative; width: 100px; height: 100px; margin-bottom: 16px; }
        .profile-avatar-large img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .profile-frame-large { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% + 16px); height: calc(100% + 16px); pointer-events: none; z-index: 2; }
        .profile-badges-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
        .profile-badge-item { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.05); }
        
        .profile-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 24px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: #fff; }
        .stat-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        
        .profile-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .profile-action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; background: rgba(255,255,255,0.05); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: all 0.3s; }
        .profile-action-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .profile-action-btn i { width: 24px; height: 24px; }
        .profile-action-btn span { font-size: 11px; color: rgba(255,255,255,0.7); }
        
        /* Gift Box Modal */
        .gift-modal { position: fixed; bottom: 0; left: 0; right: 0; height: 70vh; background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%); border-radius: 24px 24px 0 0; z-index: 200; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .gift-modal.open { transform: translateY(0); }
        .gift-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .gift-tabs { display: flex; gap: 16px; }
        .gift-tab { padding: 8px 16px; font-size: 14px; color: rgba(255,255,255,0.5); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .gift-tab.active { color: #fbbf24; border-color: #fbbf24; }
        .gift-balance { display: flex; align-items: center; gap: 6px; background: rgba(251, 191, 36, 0.1); padding: 6px 12px; border-radius: 20px; }
        .gift-balance span { color: #fbbf24; font-weight: 600; font-size: 13px; }
        .gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px; overflow-y: auto; height: calc(100% - 140px); }
        .gift-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; background: rgba(255,255,255,0.05); border-radius: 16px; cursor: pointer; transition: all 0.3s; border: 1px solid transparent; }
        .gift-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(251, 191, 36, 0.3); }
        .gift-item img { width: 48px; height: 48px; object-fit: contain; }
        .gift-item-name { font-size: 11px; color: rgba(255,255,255,0.7); text-align: center; }
        .gift-item-price { font-size: 12px; color: #fbbf24; font-weight: 600; }
        
        .gift-target { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .gift-target-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; }
        .gift-target-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .gift-target-info { flex: 1; }
        .gift-target-name { font-size: 14px; font-weight: 600; }
        .gift-target-status { font-size: 12px; color: rgba(255,255,255,0.5); }
        .send-gift-btn { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; padding: 10px 24px; border-radius: 20px; font-weight: 600; border: none; cursor: pointer; }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; right: 0; width: 80%; max-width: 320px; height: 100%; background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%); z-index: 300; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 299; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
        .sidebar-avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-user-info { flex: 1; }
        .sidebar-user-name { font-weight: 600; font-size: 15px; }
        .sidebar-user-id { font-size: 12px; color: rgba(255,255,255,0.5); }
        .sidebar-menu { padding: 16px; }
        .sidebar-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; cursor: pointer; transition: all 0.3s; margin-bottom: 4px; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); }
        .sidebar-item i { color: rgba(255,255,255,0.6); }
        .sidebar-item span { font-size: 14px; color: rgba(255,255,255,0.9); }
        
        /* Car Animation */
        .car-container { position: fixed; bottom: 80px; left: 0; right: 0; height: 120px; pointer-events: none; z-index: 50; overflow: hidden; }
        .car-animation { position: absolute; bottom: 0; width: 200px; height: 100px; animation: driveCar 5s linear forwards; }
        @keyframes driveCar { 
            0% { transform: translateX(-200px); opacity: 0; } 
            10% { opacity: 1; } 
            90% { opacity: 1; } 
            100% { transform: translateX(calc(100vw + 200px)); opacity: 0; } 
        }
        
        /* Chat Bubble SVGA */
        .chat-bubble-svga { position: absolute; inset: 0; pointer-events: none; z-index: -1; border-radius: 16px; overflow: hidden; }
        
        /* Room List */
        .room-list { padding: 16px; }
        .room-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 16px; cursor: pointer; transition: all 0.3s; }
        .room-card:hover { background: rgba(255,255,255,0.08); border-color: rgba(147, 51, 234, 0.3); transform: translateY(-2px); }
        .room-header { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
        .room-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #9333ea, #3b82f6); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .room-info { flex: 1; }
        .room-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .room-desc { font-size: 13px; color: rgba(255,255,255,0.5); }
        .room-stats { display: flex; gap: 16px; }
        .room-stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.6); }
        
        /* Blocked Users */
        .blocked-list { padding: 16px; }
        .blocked-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 8px; }
        .blocked-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
        .blocked-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .blocked-info { flex: 1; }
        .blocked-name { font-size: 14px; font-weight: 500; }
        .unblock-btn { padding: 8px 16px; background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 8px; font-size: 12px; cursor: pointer; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Stars Background -->
    <div class="stars" id="stars"></div>
    
    <!-- ==================== ROOMS LIST VIEW ==================== -->
    <div id="roomsView" class="min-h-screen pb-20">
        <!-- Header -->
        <div class="top-bar glass flex items-center justify-between px-4">
            <button onclick="toggleSidebar()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <h1 class="text-lg font-bold">الغرف</h1>
            <button onclick="showWallet()" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-yellow-500/20 border border-yellow-500/30">
                <i data-lucide="coins" class="w-4 h-4 text-yellow-400"></i>
                <span id="headerBalance" class="text-sm font-semibold text-yellow-400">0</span>
            </button>
        </div>
        
        <!-- Room List -->
        <div class="room-list pt-20" id="roomList"></div>
    </div>
    
    <!-- ==================== CHAT ROOM VIEW ==================== -->
    <div id="chatView" class="hidden min-h-screen">
        <!-- Top Bar - Online Users -->
        <div class="top-bar glass flex items-center">
            <button onclick="leaveRoom()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition mr-2">
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
            <div class="online-users flex-1" id="onlineUsers"></div>
        </div>
        
        <!-- Chat Messages -->
        <div class="chat-container" id="chatMessages"></div>
        
        <!-- Car Animation Container -->
        <div class="car-container" id="carContainer"></div>
        
        <!-- Bottom Bar -->
        <div class="bottom-bar glass">
            <button onclick="leaveRoom()" class="exit-btn">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
            <div class="input-wrapper">
                <input type="text" id="messageInput" class="message-input" placeholder="اكتب رسالتك..." oninput="toggleActionButton()" onkeypress="handleKeyPress(event)">
                <button id="giftActionBtn" onclick="openGiftModal()" class="action-btn gift-btn">
                    <i data-lucide="gift" class="w-5 h-5"></i>
                </button>
                <button id="sendActionBtn" onclick="sendMessage()" class="action-btn send-btn hidden">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- ==================== USER PROFILE SHEET ==================== -->
    <div class="sheet-overlay" id="profileOverlay" onclick="closeProfileSheet()"></div>
    <div class="profile-sheet" id="profileSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-content">
            <div class="profile-header">
                <div class="profile-avatar-large" id="profileAvatarLarge">
                    <img id="profileAvatarImg" src="" alt="">
                    <div class="profile-frame-large" id="profileFrameLarge"></div>
                </div>
                <h2 id="profileName" class="text-xl font-bold"></h2>
                <p id="profileId" class="text-sm text-white/50"></p>
                <div class="profile-badges-row" id="profileBadgesRow"></div>
            </div>
            
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-value" id="profileFriends">0</div>
                    <div class="stat-label">أصدقاء</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="profileVisitors">0</div>
                    <div class="stat-label">زوار</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="profileLevel">1</div>
                    <div class="stat-label">المستوى</div>
                </div>
            </div>
            
            <div class="profile-actions">
                <button class="profile-action-btn" onclick="sendGiftToUser()">
                    <i data-lucide="gift" class="text-yellow-400"></i>
                    <span>إرسال هدية</span>
                </button>
                <button class="profile-action-btn" onclick="toggleFollowUser()">
                    <i data-lucide="user-plus" class="text-blue-400" id="followIcon"></i>
                    <span id="followText">متابعة</span>
                </button>
                <button class="profile-action-btn" onclick="openPrivateChat()">
                    <i data-lucide="message-circle" class="text-green-400"></i>
                    <span>رسالة</span>
                </button>
                <button class="profile-action-btn" onclick="blockUser()">
                    <i data-lucide="ban" class="text-red-400"></i>
                    <span>حظر</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- ==================== GIFT MODAL ==================== -->
    <div class="sheet-overlay" id="giftOverlay" onclick="closeGiftModal()"></div>
    <div class="gift-modal" id="giftModal">
        <div class="gift-header">
            <div class="gift-tabs">
                <div class="gift-tab active" onclick="switchGiftTab('fixed')">هدايا</div>
                <div class="gift-tab" onclick="switchGiftTab('luck')">حظ</div>
            </div>
            <div class="gift-balance">
                <i data-lucide="coins" class="w-4 h-4 text-yellow-400"></i>
                <span id="giftBalance">0</span>
            </div>
        </div>
        <div class="gift-grid" id="giftGrid"></div>
        <div class="gift-target" id="giftTarget">
            <div class="gift-target-avatar">
                <img id="giftTargetImg" src="" alt="">
            </div>
            <div class="gift-target-info">
                <div class="gift-target-name" id="giftTargetName"></div>
                <div class="gift-target-status">إرسال هدية</div>
            </div>
            <button class="send-gift-btn" onclick="confirmSendGift()">إرسال</button>
        </div>
    </div>
    
    <!-- ==================== SIDEBAR ==================== -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-avatar">
                <img id="sidebarAvatar" src="https://via.placeholder.com/150" alt="">
            </div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="sidebarName">...</div>
                <div class="sidebar-user-id" id="sidebarId">ID: ...</div>
            </div>
            <button onclick="toggleSidebar()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="sidebar-menu">
            <div class="sidebar-item" onclick="showWallet()">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span>المحفظة</span>
            </div>
            <div class="sidebar-item" onclick="showStore()">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                <span>المتجر</span>
            </div>
            <div class="sidebar-item" onclick="showBag()">
                <i data-lucide="backpack" class="w-5 h-5"></i>
                <span>حقيبتي</span>
            </div>
            <div class="sidebar-item" onclick="showFriends()">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span>الأصدقاء</span>
            </div>
            <div class="sidebar-item" onclick="showBlockedUsers()">
                <i data-lucide="shield-off" class="w-5 h-5"></i>
                <span>المحظورين</span>
            </div>
            <div class="sidebar-item" onclick="logout()">
                <i data-lucide="log-out" class="w-5 h-5 text-red-400"></i>
                <span class="text-red-400">تسجيل خروج</span>
            </div>
        </div>
    </div>
    
    <!-- ==================== BLOCKED USERS VIEW ==================== -->
    <div id="blockedView" class="hidden min-h-screen pb-20">
        <div class="top-bar glass flex items-center px-4">
            <button onclick="showRooms()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition">
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
            <h1 class="text-lg font-bold mr-4">المحظورين</h1>
        </div>
        <div class="blocked-list pt-20" id="blockedList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, getDocs, increment, query, where, arrayUnion, arrayRemove, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getDatabase, ref, push, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY",
            authDomain: "rtx3090-28439.firebaseapp.com",
            projectId: "rtx3090-28439",
            storageBucket: "rtx3090-28439.firebasestorage.app",
            messagingSenderId: "178612030690",
            appId: "1:178612030690:web:883189ced2ed3a78e3e2bb",
            databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        let userData = {};
        let storeData = { items: [], itemsById: {}, gifts: [], luckGifts: [], chatBubbles: [] };
        let currentRoom = null;
        let selectedUser = null;
        let selectedGift = null;
        let messagesRef = null;
        let activeSvgaPlayers = {};

        // Create stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = Math.random();
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // Auth State
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDocRef = doc(db, "users", user.uid);
                onSnapshot(userDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        userData = { uid: docSnap.id, ...docSnap.data() };
                        updateUI();
                    }
                });
                await loadGlobalData();
                await loadRooms();
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadGlobalData() {
            const [itemsSnap, giftsSnap, luckSnap, bubblesSnap] = await Promise.all([
                getDocs(collection(db, "storeItems")),
                getDocs(collection(db, "gifts")),
                getDocs(collection(db, "luckGifts")),
                getDocs(collection(db, "chatBubbles"))
            ]);
            storeData.items = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            storeData.itemsById = {};
            storeData.items.forEach(item => storeData.itemsById[item.id] = item);
            storeData.gifts = giftsSnap.docs.map(d => ({ id: d.id, ...d.data(), type: 'wealth' }));
            storeData.luckGifts = luckSnap.docs.map(d => ({ id: d.id, ...d.data(), type: 'magic' }));
            storeData.chatBubbles = bubblesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        function updateUI() {
            document.getElementById('headerBalance').innerText = (userData.balance || 0).toLocaleString();
            document.getElementById('sidebarAvatar').src = userData.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('sidebarName').innerText = userData.displayName || 'مستخدم';
            document.getElementById('sidebarId').innerText = 'ID: ' + (userData.customId || userData.uid?.slice(0, 8));
        }

        // ==================== ROOMS ====================
        async function loadRooms() {
            const roomsSnap = await getDocs(collection(db, "rooms"));
            const roomList = document.getElementById('roomList');
            roomList.innerHTML = '';
            roomsSnap.docs.forEach(doc => {
                const room = doc.data();
                roomList.innerHTML += `
                    <div class="room-card" onclick="enterRoom('${doc.id}', '${room.name}')">
                        <div class="room-header">
                            <div class="room-icon">${room.icon || '💬'}</div>
                            <div class="room-info">
                                <div class="room-name">${room.name}</div>
                                <div class="room-desc">${room.description || 'غرفة دردشة عامة'}</div>
                            </div>
                        </div>
                        <div class="room-stats">
                            <div class="room-stat"><i data-lucide="users" class="w-4 h-4"></i><span>${room.users || 0} متصل</span></div>
                            <div class="room-stat"><i data-lucide="message-square" class="w-4 h-4"></i><span>${room.messages || 0} رسالة</span></div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        window.enterRoom = async (roomId, roomName) => {
            currentRoom = { id: roomId, name: roomName };
            document.getElementById('roomsView').classList.add('hidden');
            document.getElementById('chatView').classList.remove('hidden');
            
            // Join room
            await updateDoc(doc(db, "rooms", roomId), { users: increment(1) });
            
            // Set user as online
            await set(ref(rtdb, `rooms/${roomId}/users/${userData.uid}`), {
                name: userData.displayName,
                photo: userData.photoURL,
                frame: userData.activeFrame,
                timestamp: Date.now()
            });
            
            // Listen to online users
            onValue(ref(rtdb, `rooms/${roomId}/users`), (snapshot) => {
                const users = snapshot.val() || {};
                renderOnlineUsers(users);
            });
            
            // Listen to messages
            messagesRef = ref(rtdb, `rooms/${roomId}/messages`);
            onValue(messagesRef, (snapshot) => {
                const messages = snapshot.val() || {};
                renderMessages(Object.entries(messages).map(([id, m]) => ({ id, ...m })));
            });
            
            // Show car if purchased
            showCarIfAvailable();
        };

        window.leaveRoom = async () => {
            if (currentRoom) {
                await updateDoc(doc(db, "rooms", currentRoom.id), { users: increment(-1) });
                await set(ref(rtdb, `rooms/${currentRoom.id}/users/${userData.uid}`), null);
                off(ref(rtdb, `rooms/${currentRoom.id}/messages`));
                off(ref(rtdb, `rooms/${currentRoom.id}/users`));
            }
            currentRoom = null;
            document.getElementById('chatView').classList.add('hidden');
            document.getElementById('roomsView').classList.remove('hidden');
        };

        function renderOnlineUsers(users) {
            const container = document.getElementById('onlineUsers');
            container.innerHTML = '';
            Object.entries(users).forEach(([uid, user]) => {
                if (uid === userData.uid) return;
                const frameItem = user.frame ? storeData.itemsById[user.frame] : null;
                container.innerHTML += `
                    <div class="online-user" onclick="showUserProfile('${uid}')">
                        <img src="${user.photo || 'https://via.placeholder.com/150'}" alt="">
                        ${frameItem ? `<div class="message-frame" id="online-frame-${uid}"></div>` : ''}
                        <div class="online-indicator"></div>
                    </div>
                `;
                if (frameItem?.itemType === 'svga') {
                    setTimeout(() => {
                        const container = document.getElementById(`online-frame-${uid}`);
                        if (container) playSvga(frameItem.fileUrl, container, { loops: 0, clearsAfterStop: false });
                    }, 100);
                }
            });
        }

        // ==================== CHAT MESSAGES ====================
        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            messages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            
            messages.forEach(msg => {
                const isMine = msg.senderId === userData.uid;
                const sender = msg.senderData || {};
                const frameItem = sender.frame ? storeData.itemsById[sender.frame] : null;
                const chatBubble = sender.chatBubble ? storeData.chatBubbles.find(b => b.id === sender.chatBubble) : null;
                
                let badgesHtml = '';
                if (sender.badges && sender.badges.length > 0) {
                    const visibleBadges = sender.badges.slice(0, 3);
                    visibleBadges.forEach((badgeId, idx) => {
                        const badge = storeData.itemsById[badgeId];
                        if (badge) {
                            if (badge.itemType === 'svga') {
                                badgesHtml += `<div class="message-badge" id="msg-badge-${msg.id}-${idx}"></div>`;
                            } else {
                                badgesHtml += `<div class="message-badge"><img src="${badge.image}" alt=""></div>`;
                            }
                        }
                    });
                    if (sender.badges.length > 3) {
                        badgesHtml += `<span class="more-badges">+${sender.badges.length - 3}</span>`;
                    }
                }
                
                if (msg.type === 'gift') {
                    container.innerHTML += `
                        <div class="chat-message">
                            <div class="message-header">
                                <div class="message-avatar-wrapper" onclick="showUserProfile('${msg.senderId}')">
                                    <img src="${sender.photo || 'https://via.placeholder.com/150'}" class="message-avatar">
                                    ${frameItem ? `<div class="message-frame" id="msg-frame-${msg.id}"></div>` : ''}
                                </div>
                                <div class="message-info">
                                    <span class="message-name">${sender.name || 'مستخدم'}</span>
                                    <div class="message-badges">${badgesHtml}</div>
                                </div>
                            </div>
                            <div class="message-bubble gift-message ${isMine ? 'mine' : ''}">
                                <div class="gift-content">
                                    <div class="gift-icon"><img src="${msg.giftImage}" alt=""></div>
                                    <div>
                                        <div class="message-text">أرسل هدية 🎁</div>
                                        <div style="font-size: 12px; color: #fbbf24;">${msg.giftName}</div>
                                    </div>
                                </div>
                                <div class="message-time">${formatTime(msg.timestamp)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    const bubbleStyle = chatBubble ? 'with-chat-bubble' : '';
                    const bubbleContent = chatBubble && chatBubble.fileUrl 
                        ? `<div class="chat-bubble-svga" id="bubble-svga-${msg.id}"></div><div style="position: relative; z-index: 1;">${msg.text}</div>`
                        : msg.text;
                    
                    container.innerHTML += `
                        <div class="chat-message">
                            <div class="message-header">
                                <div class="message-avatar-wrapper" onclick="showUserProfile('${msg.senderId}')">
                                    <img src="${sender.photo || 'https://via.placeholder.com/150'}" class="message-avatar">
                                    ${frameItem ? `<div class="message-frame" id="msg-frame-${msg.id}"></div>` : ''}
                                </div>
                                <div class="message-info">
                                    <span class="message-name">${sender.name || 'مستخدم'}</span>
                                    <div class="message-badges">${badgesHtml}</div>
                                </div>
                            </div>
                            <div class="message-bubble ${isMine ? 'mine' : ''} ${bubbleStyle}">
                                ${bubbleContent}
                                <div class="message-time">${formatTime(msg.timestamp)}</div>
                            </div>
                        </div>
                    `;
                    
                    // Play chat bubble SVGA
                    if (chatBubble?.fileUrl) {
                        setTimeout(() => {
                            const container = document.getElementById(`bubble-svga-${msg.id}`);
                            if (container) playSvga(chatBubble.fileUrl, container, { loops: 1, clearsAfterStop: true });
                        }, 100);
                    }
                }
                
                // Play frame SVGA
                if (frameItem?.itemType === 'svga') {
                    setTimeout(() => {
                        const container = document.getElementById(`msg-frame-${msg.id}`);
                        if (container) playSvga(frameItem.fileUrl, container, { loops: 0, clearsAfterStop: false });
                    }, 100);
                }
                
                // Play badge SVGAs
                if (sender.badges) {
                    sender.badges.slice(0, 3).forEach((badgeId, idx) => {
                        const badge = storeData.itemsById[badgeId];
                        if (badge?.itemType === 'svga') {
                            setTimeout(() => {
                                const container = document.getElementById(`msg-badge-${msg.id}-${idx}`);
                                if (container) playSvga(badge.fileUrl, container, { loops: 1, clearsAfterStop: false });
                            }, 100);
                        }
                    });
                }
            });
            
            container.scrollTop = container.scrollHeight;
            lucide.createIcons();
        }

        window.sendMessage = async () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentRoom) return;
            
            const messageData = {
                senderId: userData.uid,
                senderData: {
                    name: userData.displayName,
                    photo: userData.photoURL,
                    frame: userData.activeFrame,
                    badges: userData.activeBadges || [],
                    chatBubble: userData.activeChatBubble
                },
                text: text,
                type: 'text',
                timestamp: Date.now()
            };
            
            await push(ref(rtdb, `rooms/${currentRoom.id}/messages`), messageData);
            input.value = '';
            toggleActionButton();
        };

        window.handleKeyPress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        window.toggleActionButton = () => {
            const input = document.getElementById('messageInput');
            const giftBtn = document.getElementById('giftActionBtn');
            const sendBtn = document.getElementById('sendActionBtn');
            
            if (input.value.trim()) {
                giftBtn.classList.add('hidden');
                sendBtn.classList.remove('hidden');
            } else {
                giftBtn.classList.remove('hidden');
                sendBtn.classList.add('hidden');
            }
        };

        // ==================== USER PROFILE ====================
        window.showUserProfile = async (uid) => {
            const userSnap = await getDoc(doc(db, "users", uid));
            if (!userSnap.exists()) return;
            
            selectedUser = { uid, ...userSnap.data() };
            
            document.getElementById('profileAvatarImg').src = selectedUser.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('profileName').innerText = selectedUser.displayName || 'مستخدم';
            document.getElementById('profileId').innerText = 'ID: ' + (selectedUser.customId || uid.slice(0, 8));
            document.getElementById('profileFriends').innerText = (selectedUser.friends || []).length;
            document.getElementById('profileVisitors').innerText = selectedUser.visitors || 0;
            document.getElementById('profileLevel').innerText = selectedUser.magicLevel || 1;
            
            // Frame
            const frameLarge = document.getElementById('profileFrameLarge');
            frameLarge.innerHTML = '';
            if (selectedUser.activeFrame) {
                const frameItem = storeData.itemsById[selectedUser.activeFrame];
                if (frameItem?.itemType === 'svga') {
                    playSvga(frameItem.fileUrl, frameLarge, { loops: 0, clearsAfterStop: false });
                }
            }
            
            // Badges
            const badgesRow = document.getElementById('profileBadgesRow');
            badgesRow.innerHTML = '';
            if (selectedUser.activeBadges) {
                selectedUser.activeBadges.forEach(badgeId => {
                    const badge = storeData.itemsById[badgeId];
                    if (badge) {
                        if (badge.itemType === 'svga') {
                            const div = document.createElement('div');
                            div.className = 'profile-badge-item';
                            div.id = `profile-badge-${badgeId}`;
                            badgesRow.appendChild(div);
                            playSvga(badge.fileUrl, div, { loops: 0, clearsAfterStop: false });
                        } else {
                            badgesRow.innerHTML += `<div class="profile-badge-item"><img src="${badge.image}" alt=""></div>`;
                        }
                    }
                });
            }
            
            // Update follow button
            const isFollowing = (userData.friends || []).includes(uid);
            document.getElementById('followIcon').className = isFollowing ? 'text-green-400' : 'text-blue-400';
            document.getElementById('followText').innerText = isFollowing ? 'متابع' : 'متابعة';
            
            document.getElementById('profileOverlay').classList.add('open');
            document.getElementById('profileSheet').classList.add('open');
        };

        window.closeProfileSheet = () => {
            document.getElementById('profileOverlay').classList.remove('open');
            document.getElementById('profileSheet').classList.remove('open');
        };

        window.sendGiftToUser = () => {
            closeProfileSheet();
            openGiftModal(selectedUser.uid);
        };

        window.toggleFollowUser = async () => {
            if (!selectedUser) return;
            const isFollowing = (userData.friends || []).includes(selectedUser.uid);
            
            if (isFollowing) {
                await updateDoc(doc(db, "users", userData.uid), { friends: arrayRemove(selectedUser.uid) });
                await updateDoc(doc(db, "users", selectedUser.uid), { friends: arrayRemove(userData.uid) });
            } else {
                await updateDoc(doc(db, "users", userData.uid), { sentRequests: arrayUnion(selectedUser.uid) });
                await updateDoc(doc(db, "users", selectedUser.uid), { friendRequests: arrayUnion(userData.uid) });
            }
            closeProfileSheet();
        };

        window.openPrivateChat = () => {
            if (!selectedUser) return;
            alert('سيتم فتح المحادثة الخاصة قريباً');
            closeProfileSheet();
        };

        window.blockUser = async () => {
            if (!selectedUser) return;
            await updateDoc(doc(db, "users", userData.uid), { blockedUsers: arrayUnion(selectedUser.uid) });
            alert('تم حظر المستخدم');
            closeProfileSheet();
        };

        // ==================== GIFT MODAL ====================
        window.openGiftModal = (targetUid = null) => {
            if (targetUid) selectedUser = { uid: targetUid };
            if (!selectedUser) return;
            
            document.getElementById('giftTargetImg').src = selectedUser.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('giftTargetName').innerText = selectedUser.displayName || 'مستخدم';
            document.getElementById('giftBalance').innerText = (userData.balance || 0).toLocaleString();
            
            renderGifts('fixed');
            
            document.getElementById('giftOverlay').classList.add('open');
            document.getElementById('giftModal').classList.add('open');
        };

        window.closeGiftModal = () => {
            document.getElementById('giftOverlay').classList.remove('open');
            document.getElementById('giftModal').classList.remove('open');
            selectedGift = null;
        };

        window.switchGiftTab = (tab) => {
            document.querySelectorAll('.gift-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderGifts(tab);
        };

        function renderGifts(type) {
            const grid = document.getElementById('giftGrid');
            const gifts = type === 'fixed' ? storeData.gifts : storeData.luckGifts;
            
            grid.innerHTML = gifts.map(gift => `
                <div class="gift-item" onclick="selectGift('${gift.id}', '${type}')">
                    <img src="${gift.image}" alt="${gift.name}">
                    <div class="gift-item-name">${gift.name}</div>
                    <div class="gift-item-price">${gift.price} 💰</div>
                </div>
            `).join('');
        }

        window.selectGift = (giftId, type) => {
            selectedGift = { id: giftId, type };
            document.querySelectorAll('.gift-item').forEach(el => el.style.borderColor = 'transparent');
            event.currentTarget.style.borderColor = '#fbbf24';
        };

        window.confirmSendGift = async () => {
            if (!selectedGift || !selectedUser) return;
            
            const giftList = selectedGift.type === 'luck' ? storeData.luckGifts : storeData.gifts;
            const gift = giftList.find(g => g.id === selectedGift.id);
            
            if (!gift) return;
            if ((userData.balance || 0) < gift.price) {
                alert('رصيدك غير كافٍ!');
                return;
            }
            
            // Deduct balance
            await updateDoc(doc(db, "users", userData.uid), { balance: increment(-gift.price) });
            
            // Send gift message
            if (currentRoom) {
                await push(ref(rtdb, `rooms/${currentRoom.id}/messages`), {
                    senderId: userData.uid,
                    senderData: {
                        name: userData.displayName,
                        photo: userData.photoURL,
                        frame: userData.activeFrame,
                        badges: userData.activeBadges || []
                    },
                    giftId: gift.id,
                    giftName: gift.name,
                    giftImage: gift.image,
                    type: 'gift',
                    timestamp: Date.now()
                });
            }
            
            // Add to receiver
            await updateDoc(doc(db, "users", selectedUser.uid), { 
                balance: increment(gift.reward || 0),
                wealthLevel: increment(gift.reward || 1)
            });
            
            closeGiftModal();
        };

        // ==================== SIDEBAR ====================
        window.toggleSidebar = () => {
            document.getElementById('sidebarOverlay').classList.toggle('open');
            document.getElementById('sidebar').classList.toggle('open');
        };

        window.showWallet = () => { toggleSidebar(); alert('المحفظة - قريباً'); };
        window.showStore = () => { toggleSidebar(); alert('المتجر - قريباً'); };
        window.showBag = () => { toggleSidebar(); alert('حقيبتي - قريباً'); };
        window.showFriends = () => { toggleSidebar(); alert('الأصدقاء - قريباً'); };
        
        window.showBlockedUsers = async () => {
            toggleSidebar();
            document.getElementById('roomsView').classList.add('hidden');
            document.getElementById('blockedView').classList.remove('hidden');
            
            const blockedList = document.getElementById('blockedList');
            blockedList.innerHTML = '';
            
            const blockedUsers = userData.blockedUsers || [];
            if (blockedUsers.length === 0) {
                blockedList.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">لا يوجد محظورين</div>';
                return;
            }
            
            for (const uid of blockedUsers) {
                const userSnap = await getDoc(doc(db, "users", uid));
                if (userSnap.exists()) {
                    const user = userSnap.data();
                    blockedList.innerHTML += `
                        <div class="blocked-item">
                            <div class="blocked-avatar"><img src="${user.photoURL || 'https://via.placeholder.com/150'}" alt=""></div>
                            <div class="blocked-info">
                                <div class="blocked-name">${user.displayName || 'مستخدم'}</div>
                            </div>
                            <button class="unblock-btn" onclick="unblockUser('${uid}')">إلغاء الحظر</button>
                        </div>
                    `;
                }
            }
        };

        window.unblockUser = async (uid) => {
            await updateDoc(doc(db, "users", userData.uid), { blockedUsers: arrayRemove(uid) });
            showBlockedUsers();
        };

        window.showRooms = () => {
            document.getElementById('blockedView').classList.add('hidden');
            document.getElementById('roomsView').classList.remove('hidden');
        };

        window.logout = async () => {
            if (currentRoom) await leaveRoom();
            await signOut(auth);
            window.location.href = "login.html";
        };

        // ==================== CAR ANIMATION ====================
        function showCarIfAvailable() {
            const carItem = userData.purchasedSvga?.find(s => s.id === 'car' || s.active);
            if (!carItem) return;
            
            const carContainer = document.getElementById('carContainer');
            const carDiv = document.createElement('div');
            carDiv.className = 'car-animation';
            carDiv.id = 'activeCar';
            carContainer.appendChild(carDiv);
            
            const carData = storeData.itemsById[carItem.id];
            if (carData?.fileUrl) {
                playSvga(carData.fileUrl, carDiv, { loops: 1, clearsAfterStop: true });
            }
            
            // Remove after animation
            setTimeout(() => {
                carDiv.remove();
            }, 5000);
        }

        // ==================== SVGA PLAYER ====================
        function playSvga(url, container, options = {}) {
            try {
                container.innerHTML = '';
                const player = new SVGA.Player(container);
                const parser = new SVGA.Parser();
                
                parser.load(url, (videoItem) => {
                    player.setVideoItem(videoItem);
                    player.loops = options.loops || 0;
                    player.clearsAfterStop = options.clearsAfterStop !== false;
                    player.startAnimation();
                    
                    const id = 'player_' + Date.now();
                    activeSvgaPlayers[id] = player;
                    
                    if (options.loops === 1) {
                        player.onFinished = () => {
                            if (options.clearsAfterStop) container.innerHTML = '';
                        };
                    }
                });
            } catch (e) { console.error('SVGA Error:', e); }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        // Initialize
        lucide.createIcons();
        setInterval(() => lucide.createIcons(), 1000);
    </script>
</body>
</html>
