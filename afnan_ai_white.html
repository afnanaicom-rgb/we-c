<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Noto Sans Arabic', sans-serif; touch-action: manipulation }
        body { background: radial-gradient(circle at 0% 0%, #eef2ff 0%, #fdf2f8 50%, #f0f9ff 100%); color: #1f2937; overflow-x: hidden; min-height: 100vh }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04), 0 2px 4px -1px rgba(0,0,0,0.02), inset 0 1px 0 0 rgba(255, 255, 255, 0.4) }
        .glass-deep { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%); border-right: 1px solid rgba(255, 255, 255, 0.8) }
        .glass-card { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.4); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.03), inset 0 1px 0 0 rgba(255, 255, 255, 0.5) }
        .glass-card:active { transform: scale(0.97); box-shadow: 0 1px 3px -1px rgba(0,0,0,0.02), inset 0 2px 0 0 rgba(255, 255, 255, 0.3) }
        .sidebar-container { position: fixed; top: 0; right: 0; width: 85%; max-width: 320px; height: 100%; z-index: 50; transform: translateX(110%); transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1) }
        .sidebar-container.open { transform: translateX(0) }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.15); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s ease }
        .sidebar-overlay.visible { opacity: 1; pointer-events: auto }
        .avatar-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; overflow: visible }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; z-index: 1 }
        .svga-avatar-frame { position: absolute; pointer-events: none; z-index: 2; border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: frameFloat 3s ease-in-out infinite; overflow: visible; width: calc(100% + 16px); height: calc(100% + 16px); top: 50%; left: 50%; transform: translate(-50%, -50%) }
        .svga-avatar-frame canvas { border-radius: 50%; object-fit: contain; width: 100%!important; height: 100%!important; position: absolute!important; top: 50%!important; left: 50%!important; transform: translate(-50%, -50%)!important; max-width: 100%!important; max-height: 100%!important; min-width: 100%!important; min-height: 100%!important; z-index: 2 }
        .perfect-frame { position: absolute; pointer-events: none; z-index: 2; object-fit: contain; border-radius: 50%; animation: frameFloat 3s ease-in-out infinite; width: calc(100% + 16px); height: calc(100% + 16px); top: 50%; left: 50%; transform: translate(-50%, -50%) }
        @keyframes frameFloat { 0%, 100% { transform: translate(-50%, -50%) scale(1) } 50% { transform: translate(-50%, -50%) scale(1.05) } }
        .no-scrollbar::-webkit-scrollbar { display: none }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none }
        .banner-container { height: 120px; margin-top: 20px }
        .header-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8) }
        .svga-player-canvas { width: 100%!important; height: 60%!important; transform: translateX(25px)!important; z-index: 2; margin: auto; position: relative!important; top: 0!important; left: 0!important }
        .buy-btn { width: 90%; margin: 0 auto; padding: 8px; border: none; border-radius: 6px; background: #000; color: #fff; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: all 0.3s ease }
        .buy-btn:hover { background: #333; transform: translateY(-2px) }
        .buy-btn:active { transform: scale(0.98) }
        .buy-btn:disabled { background: #ccc; cursor: not-allowed; transform: none }
        .frame-size-small .svga-avatar-frame, .frame-size-small .perfect-frame { width: calc(100% + 8px); height: calc(100% + 8px) }
        .frame-size-medium .svga-avatar-frame, .frame-size-medium .perfect-frame { width: calc(100% + 16px); height: calc(100% + 16px) }
        .frame-size-large .svga-avatar-frame, .frame-size-large .perfect-frame { width: calc(100% + 24px); height: calc(100% + 24px) }
        .frame-size-xl .svga-avatar-frame, .frame-size-xl .perfect-frame { width: calc(100% + 32px); height: calc(100% + 32px) }
        .badges-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center }
        .room-item { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3); transition: all 0.3s ease }
        .room-item:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4) }
        .room-item-private { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white }
        .swiper { width: 100%; height: 100%; border-radius: 28px }
        .swiper-slide { display: flex; align-items: center; justify-content: center }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot, collection, getDocs, increment, query, where, arrayUnion, arrayRemove, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBnmqWRY6lV54meFvO89QeXwtd28w81FcY", authDomain: "rtx3090-28439.firebaseapp.com", projectId: "rtx3090-28439", storageBucket: "rtx3090-28439.firebasestorage.app", messagingSenderId: "178612030690", appId: "1:178612030690:web:883189ced2ed3a78e3e2bb", databaseURL: "https://rtx3090-28439-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        let userData = {};
        let storeData = { items: [], itemsById: {}, gifts: [], luckGifts: [], magicLevels: {}, wealthLevels: {}, chatBubbles: [] };
        let activeSvgaPlayers = {};

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // دعم هيكلة Firestore المرنة (رقم، نص، أو بريد)
                // نبحث أولاً عن وثيقة تحمل UID الخاص بـ Auth
                let userDocRef = doc(db, "users", user.uid);
                let userSnap = await getDoc(userDocRef);
                
                // إذا لم توجد، نبحث عن وثيقة يكون فيها حقل email يساوي بريد المستخدم الحالي (للتوافق القديم)
                if (!userSnap.exists()) {
                    const q = query(collection(db, "users"), where("email", "==", user.email));
                    const qSnap = await getDocs(q);
                    if (!qSnap.empty) {
                        userDocRef = doc(db, "users", qSnap.docs[0].id);
                        userSnap = await getDoc(userDocRef);
                    }
                }

                if (userSnap.exists()) {
                    userData = { uid: userSnap.id, ...userSnap.data() };
                    onSnapshot(userDocRef, async (docSnap) => {
                        if (docSnap.exists()) {
                            userData = { uid: docSnap.id, ...docSnap.data() };
                            await updateUI();
                        }
                    });
                    await loadBanner();
                    await loadGlobalData();
                    await loadRooms();
                    await ensurePrivateRoom();
                } else {
                    alert('هذا الحساب غير مسجل في النظام.');
                    await signOut(auth);
                    window.location.href = "login.html";
                }
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadGlobalData() {
            const storeSnap = await getDocs(collection(db, "storeItems"));
            storeData.items = storeSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            storeData.itemsById = {};
            storeData.items.forEach(item => { storeData.itemsById[item.id] = item; });
            const gSnap = await getDocs(collection(db, "gifts"));
            storeData.gifts = gSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const mlSnap = await getDocs(collection(db, "magicLevels"));
            mlSnap.docs.forEach(d => storeData.magicLevels[d.id] = d.data());
            const wlSnap = await getDocs(collection(db, "wealthLevels"));
            wlSnap.docs.forEach(d => storeData.wealthLevels[d.id] = d.data());
            const cbSnap = await getDocs(collection(db, "chatBubbles"));
            storeData.chatBubbles = cbSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            await updateUI();
        }

        async function updateUI() {
            if (!userData.uid) return;
            document.getElementById('sideName').innerText = userData.displayName || "مستخدم";
            document.getElementById('sideEmail').innerText = userData.email || "لا يوجد بريد";
            document.getElementById('sideAvatar').src = userData.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('walletAmount').innerText = (userData.balance || 0).toLocaleString();
            
            const ml = userData.magicLevel || 1;
            const wl = userData.wealthLevel || 1;
            if (storeData.magicLevels[ml]) document.getElementById('magicLevelImg').src = storeData.magicLevels[ml].image;
            if (storeData.wealthLevels[wl]) document.getElementById('wealthLevelImg').src = storeData.wealthLevels[wl].image;
            document.getElementById('sideMagicLevelText').innerText = ml;
            document.getElementById('sideWealthLevelText').innerText = wl;

            const avatarWrapper = document.getElementById('sidebarAvatarWrapper');
            const frameEl = document.getElementById('sideFrame');
            const svgaContainer = document.getElementById('sideSvgaFrame');
            frameEl.classList.add('hidden');
            svgaContainer.classList.add('hidden');
            svgaContainer.innerHTML = '';
            avatarWrapper.classList.remove('frame-size-small', 'frame-size-medium', 'frame-size-large', 'frame-size-xl');

            if (userData.activeFrame) {
                const item = storeData.itemsById[userData.activeFrame];
                if (item) {
                    const sizeClass = getFrameSizeClass(item.frameConfig);
                    if (sizeClass) avatarWrapper.classList.add(sizeClass);
                    if (item.itemType === 'svga') {
                        svgaContainer.classList.remove('hidden');
                        playPerfectSvga(item.fileUrl, svgaContainer);
                        applyFrameStyles(avatarWrapper, item.frameConfig);
                    } else {
                        frameEl.src = item.image;
                        frameEl.classList.remove('hidden');
                        applyFrameStyles(avatarWrapper, item.frameConfig);
                    }
                }
            }
            
            const sidebarBadges = document.getElementById('sidebarActiveBadges');
            sidebarBadges.innerHTML = '';
            if (userData.activeBadges) {
                userData.activeBadges.forEach(badgeId => {
                    const badge = storeData.itemsById[badgeId];
                    if (badge) sidebarBadges.innerHTML += `<img src="${badge.image}" class="w-8 h-8 object-contain">`;
                });
            }
        }

        function getFrameSizeClass(config) {
            if (!config || !config.size) return '';
            const map = { 'small': 'frame-size-small', 'medium': 'frame-size-medium', 'large': 'frame-size-large', 'xl': 'frame-size-xl' };
            return map[config.size] || '';
        }

        function applyFrameStyles(element, config) {
            if (!config) return;
            const frameEl = element.querySelector('.svga-avatar-frame, .perfect-frame');
            if (!frameEl) return;
            if (config.width) frameEl.style.width = config.width;
            if (config.height) frameEl.style.height = config.height;
            if (config.top) frameEl.style.top = config.top;
            if (config.left) frameEl.style.left = config.left;
            if (config.transform) frameEl.style.transform = config.transform;
        }

        function playPerfectSvga(url, container) {
            container.innerHTML = '';
            const player = new SVGA.Player(container);
            const parser = new SVGA.Parser();
            parser.load(url, (videoItem) => {
                player.setVideoItem(videoItem);
                player.startAnimation();
                const canvas = container.querySelector('canvas');
                if (canvas) canvas.classList.add('svga-player-canvas');
            });
        }

        async function loadBanner() {
            const bSnap = await getDocs(collection(db, "appData", "banner", "items"));
            const wrapper = document.getElementById('bannerWrapper');
            wrapper.innerHTML = '';
            if (!bSnap.empty) {
                bSnap.forEach(doc => {
                    const data = doc.data();
                    wrapper.innerHTML += `<div class="swiper-slide"><img src="${data.image}"></div>`;
                });
            } else {
                // التوافق مع الهيكل القديم لوثيقة واحدة
                const oldDoc = await getDoc(doc(db, "appData", "banner"));
                if (oldDoc.exists()) {
                    wrapper.innerHTML = `<div class="swiper-slide"><img src="${oldDoc.data().image}"></div>`;
                }
            }
            new Swiper(".mySwiper", { loop: true, autoplay: { delay: 3000 } });
        }

        async function loadRooms() {
            const rSnap = await getDocs(collection(db, "rooms"));
            const grid = document.getElementById('roomsGrid');
            grid.innerHTML = '';
            
            // جلب عدد المستخدمين في كل غرفة من Realtime Database للترتيب
            const roomsRef = ref(rtdb, 'rooms');
            onValue(roomsRef, (snapshot) => {
                const rtdbRooms = snapshot.val() || {};
                const roomsData = rSnap.docs.map(d => {
                    const r = d.data();
                    const activeUsersCount = rtdbRooms[d.id]?.users ? Object.keys(rtdbRooms[d.id].users).length : 0;
                    return { id: d.id, ...r, activeUsersCount };
                });

                // ترتيب الغرف: الغرف النشطة أولاً، ثم حسب عدد المستخدمين تنازلياً
                roomsData.sort((a, b) => b.activeUsersCount - a.activeUsersCount);

                grid.innerHTML = '';
                roomsData.forEach(r => {
                    grid.innerHTML += `
                        <div onclick="window.location.href='room.html?id=${r.id}'" class="glass-card p-4 rounded-3xl flex items-center gap-4 cursor-pointer hover:bg-white transition">
                            <div class="w-12 h-12 rounded-full ${r.color || 'bg-blue-500'} flex items-center justify-center text-xl">${r.icon || '🏠'}</div>
                            <div class="flex-1">
                                <h4 class="font-bold text-gray-900">${r.name}</h4>
                                <p class="text-xs text-gray-500">${r.description || ''}</p>
                            </div>
                            <div class="flex items-center gap-1 bg-green-50 px-2 py-1 rounded-lg">
                                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                <span class="text-[10px] font-bold text-green-600">${r.activeUsersCount}</span>
                            </div>
                            <i data-lucide="chevron-left" class="w-4 h-4 text-gray-400"></i>
                        </div>`;
                });
                lucide.createIcons();
            });
        }

        window.toggleSidebar = (show) => {
            const s = document.getElementById('sidebar');
            const o = document.getElementById('sidebarOverlay');
            s.classList.toggle('open', show);
            o.classList.toggle('hidden', !show);
            if (show) setTimeout(() => o.classList.add('visible'), 10);
            else o.classList.remove('visible');
        };

        window.switchView = (v) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('view-' + v).classList.remove('hidden');
            document.getElementById('pageTitle').innerText = v === 'home' ? 'الرئيسية' : v === 'wallet' ? 'المحفظة' : v === 'store' ? 'المتجر' : 'حقيبتي';
            toggleSidebar(false);
        };

        window.confirmLogout = () => { if (confirm('هل تريد تسجيل الخروج؟')) signOut(auth); };
        window.copyEmail = () => { navigator.clipboard.writeText(userData.email); alert('تم النسخ'); };
        window.recharge = async (a) => { await updateDoc(doc(db, "users", userData.uid), { balance: increment(a) }); };
        window.openEditProfile = () => { document.getElementById('editNameInp').value = userData.displayName; document.getElementById('editPhotoInp').value = userData.photoURL; document.getElementById('editModal').classList.remove('hidden'); toggleSidebar(false); };
        window.closeEditModal = () => document.getElementById('editModal').classList.add('hidden');
        window.saveProfileChanges = async () => { await updateDoc(doc(db, "users", userData.uid), { displayName: document.getElementById('editNameInp').value, photoURL: document.getElementById('editPhotoInp').value }); closeEditModal(); };
        
        async function ensurePrivateRoom() {
            const prRef = doc(db, "privateRooms", userData.uid);
            const prSnap = await getDoc(prRef);
            if (!prSnap.exists()) {
                await setDoc(prRef, { owner: userData.uid, name: `غرفة ${userData.displayName}`, icon: '🏠', color: 'bg-purple-500' });
            }
            document.getElementById('myRoomName').innerText = `غرفة ${userData.displayName}`;
        }

        window.showPrivateRoom = () => {
            document.getElementById('btn-public').classList.replace('bg-white', 'text-gray-500');
            document.getElementById('btn-private').classList.replace('text-gray-500', 'bg-white');
            document.getElementById('roomsGrid').classList.add('hidden');
            document.getElementById('privateRoomContainer').classList.remove('hidden');
        };

        window.filterRooms = (t) => {
            document.getElementById('btn-public').classList.replace('text-gray-500', 'bg-white');
            document.getElementById('btn-private').classList.replace('bg-white', 'text-gray-500');
            document.getElementById('roomsGrid').classList.remove('hidden');
            document.getElementById('privateRoomContainer').classList.add('hidden');
        };

        window.openMyRoom = () => { window.location.href = `room.html?id=${userData.uid}&type=private`; };

        lucide.createIcons();
    </script>
</body>
</html>
